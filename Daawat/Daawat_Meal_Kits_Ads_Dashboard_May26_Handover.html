<title>Daawat Meal Kits — Ads Performance Handover</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f8f9fa; color: #020202; }
  a { color: #18A6A3; text-decoration: none; }
  .hidden { display: none !important; }
  #pw-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, #020202 0%, #0a2020 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .pw-box { background: #fff; padding: 40px 48px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); width: 400px; max-width: 92vw; text-align: center; }
  .pw-box img { max-width: 160px; height: auto; margin-bottom: 24px; filter: invert(1) brightness(0.15); }
  .pw-box h2 { font-size: 18px; margin-bottom: 6px; color: #020202; font-weight: 600; }
  .pw-box p  { font-size: 13px; color: #7D7D7D; margin-bottom: 22px; }
  #pw-input { width: 100%; padding: 12px 14px; font-size: 15px; border: 1.5px solid #E5E5E5; border-radius: 8px; outline: none; transition: border-color .15s; }
  #pw-input:focus { border-color: #1CBFBB; }
  #pw-btn { width: 100%; margin-top: 14px; padding: 12px; background: #1CBFBB; color: #fff; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: background .15s; }
  #pw-btn:hover { background: #18A6A3; }
  #pw-err { color: #dc2626; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .header { background: linear-gradient(135deg, #020202 0%, #0a1e1e 100%); color: #fff; padding: 28px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #1CBFBB; }
  .header-left h1 { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
  .header-left .subtitle { font-size: 13px; color: #B0C4C4; margin-top: 5px; }
  .header-left .gen-stamp { font-size: 11px; color: #1CBFBB; margin-top: 8px; letter-spacing: .5px; text-transform: uppercase; }
  .header-right img { max-height: 46px; width: auto; }
  .filter-bar { background: #fff; border-bottom: 1px solid #E5E5E5; padding: 14px 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .filter-bar label { font-size: 12px; color: #7D7D7D; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .filter-bar select { padding: 8px 14px; font-size: 13px; border: 1.5px solid #E5E5E5; border-radius: 6px; background: #fff; cursor: pointer; min-width: 200px; outline: none; }
  .filter-bar select:focus { border-color: #1CBFBB; }
  .filter-bar button { padding: 8px 16px; font-size: 12px; border: 1.5px solid #1CBFBB; background: #E6FAF9; color: #18A6A3; border-radius: 6px; cursor: pointer; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  .filter-bar button:hover { background: #1CBFBB; color: #fff; }
  .filter-bar .data-through { margin-left: auto; font-size: 12px; color: #7D7D7D; }
  .tab-nav { background: #fff; border-bottom: 1px solid #E5E5E5; padding: 0 40px; display: flex; gap: 4px; overflow-x: auto; }
  .tab { padding: 14px 22px; font-size: 14px; font-weight: 600; color: #7D7D7D; border: none; background: transparent; cursor: pointer; border-bottom: 3px solid transparent; transition: all .15s; white-space: nowrap; }
  .tab:hover { color: #18A6A3; }
  .tab.active { color: #1CBFBB; border-bottom-color: #1CBFBB; }
  main { padding: 28px 40px 48px; max-width: 1600px; margin: 0 auto; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .insight-banner { background: linear-gradient(135deg, #E6FAF9 0%, #f0fbfa 100%); border-left: 5px solid #1CBFBB; padding: 20px 26px; border-radius: 8px; margin-bottom: 26px; font-size: 15px; line-height: 1.6; color: #020202; }
  .insight-banner strong { color: #18A6A3; font-weight: 700; }
  .insight-banner .lead-label { display: inline-block; background: #1CBFBB; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: .8px; margin-right: 10px; text-transform: uppercase; vertical-align: middle; }
  .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 8px; } @media (max-width: 1400px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } } .efficiency-strip { display: flex; gap: 20px; padding: 10px 14px; background: #F8FAFA; border-left: 3px solid #1CBFBB; border-radius: 6px; margin-bottom: 24px; font-size: 13px; color: #444; } .efficiency-strip .es-item { display: flex; align-items: center; gap: 8px; } .efficiency-strip .es-label { color: #7D7D7D; text-transform: uppercase; font-size: 11px; letter-spacing: .6px; } .efficiency-strip .es-value { font-weight: 700; color: #020202; }
  .kpi-card { background: #fff; padding: 18px 20px; border-radius: 8px; border: 1px solid #E5E5E5; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .kpi-label { font-size: 11px; color: #7D7D7D; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .kpi-value { font-size: 22px; font-weight: 700; color: #020202; margin-top: 8px; letter-spacing: -.3px; }
  .kpi-sub { font-size: 11px; color: #7D7D7D; margin-top: 4px; }
  .kpi-mom { font-size: 11px; margin-top: 6px; font-weight: 600; }
  .mom-up { color: #15803d; }
  .mom-down { color: #dc2626; }
  .mom-flat { color: #7D7D7D; }
  .mom-new { color: #1CBFBB; }
  .roas-good { color: #15803d !important; }
  .roas-mid  { color: #d97706 !important; }
  .roas-bad  { color: #dc2626 !important; }
  .section { background: #fff; border: 1px solid #E5E5E5; border-radius: 8px; padding: 22px 26px; margin-bottom: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .section h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: #020202; letter-spacing: -.2px; }
  .section .sec-sub { font-size: 12px; color: #7D7D7D; margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 340px; }
  .chart-wrap.small { height: 260px; }
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
  .stories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .story-card { background: #fff; border: 1px solid #E5E5E5; border-left: 4px solid #1CBFBB; border-radius: 8px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .story-icon { font-size: 22px; margin-bottom: 6px; }
  .story-title { font-size: 12px; font-weight: 700; color: #18A6A3; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .story-detail { font-size: 13px; color: #020202; line-height: 1.4; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-weight: 600; color: #020202; border-bottom: 2px solid #E5E5E5; white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; cursor: pointer; user-select: none; }
  th:hover { background: #E6FAF9; }
  th.sort-asc::after { content: ' ▲'; color: #1CBFBB; }
  th.sort-desc::after { content: ' ▼'; color: #1CBFBB; }
  td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; color: #020202; }
  tr:hover td { background: #fafcfc; }
  tr.total-row td { font-weight: 700; background: #E6FAF9; border-top: 2px solid #1CBFBB; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pltag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: #fff; }
  .pltag.amazon { background: #FF9900; }
  .pltag.blinkit { background: #F5C518; color: #020202; }
  .pltag.instamart { background: #FC8019; }
  .pltag.zepto { background: #6C2DC7; }
  .table-note { font-size: 11px; color: #7D7D7D; margin-top: 8px; font-style: italic; }
  .csv-btn { padding: 6px 12px; font-size: 11px; border: 1px solid #1CBFBB; background: #fff; color: #18A6A3; border-radius: 4px; cursor: pointer; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 10px; }
  .csv-btn:hover { background: #1CBFBB; color: #fff; }
  footer { margin-top: 40px; padding: 22px 40px; background: #020202; color: #B0C4C4; font-size: 12px; text-align: center; line-height: 1.6; }
  footer .footnote { font-size: 11px; color: #7D7D7D; margin-top: 8px; }
  @media print { #pw-overlay { display: none !important; } .filter-bar, .tab-nav { display: none; } .tab-panel { display: block !important; page-break-after: always; } }
</style>

  const momClk = computeMoM(monMoM, 'clicks');
  const momRoas = (() => { const nz = monMoM.filter(m => (m.spend || 0) > 0); if (nz.length < 2) return null; const cur = nz[nz.length - 1], prev = nz[nz.length - 2]; if (prev.roas === 0) return { kind: 'new' }; return { kind: 'pct', value: ((cur.roas - prev.roas) / prev.roas) * 100, curLabel: cur.label, prevLabel: prev.label }; })();
  const derivedMoM = (num, denom) => { const nz = monMoM.filter(m => (m.spend || 0) > 0); if (nz.length < 2) return null; const cur = nz[nz.length - 1], prev = nz[nz.length - 2]; const curV = cur[denom] > 0 ? cur[num] / cur[denom] : 0; const prevV = prev[denom] > 0 ? prev[num] / prev[denom] : 0; if (prevV === 0) return { kind: 'new' }; return { kind: 'pct', value: ((curV - prevV) / prevV) * 100, curLabel: cur.label, prevLabel: prev.label }; };
  const momCtrRatio = derivedMoM('clicks', 'impressions');
  const momCpcRatio = derivedMoM('spend', 'clicks');
  kpiWrap.append(kpiCard('Ad Spend', fmtINR(agg.spend), periodLabel, momBadge(momSpend)));
  kpiWrap.append(kpiCard('Ad Sales', fmtINR(agg.revenue), 'Ad-attributed', momBadge(momRev)));
  kpiWrap.append(kpiCard('ROAS', '<span class="' + roasClass(agg.roas) + '">' + fmtROAS(agg.roas) + '</span>', '', momBadge(momRoas)));

  kpiWrap.append(kpiCard('Clicks', fmtNum(agg.clicks), '', momBadge(momClk)));
  kpiWrap.append(kpiCard('Orders', fmtNum(agg.orders), '', momBadge(momOrd)));
  // CTR + CPC moved to efficiency strip below
  panel.append(kpiWrap);
  // Efficiency strip: CTR + CPC + MoM
  const effStrip = el('div', { class: 'efficiency-strip' });
  const momCtr = computeMoM(monMoM, 'clicks', 'impressions');
  const momCpc = computeMoM(monMoM, 'spend', 'clicks');
  effStrip.innerHTML = '<div class="es-item"><span class="es-label">CTR</span> <span class="es-value">' + fmtPct(agg.ctr) + '</span></div>' + '<div class="es-item"><span class="es-label">CPC</span> <span class="es-value">' + fmtINR(agg.cpc) + '</span></div>' + '<div class="es-item"><span class="es-label">Efficiency Trend</span> <span class="es-value" style="color:#1CBFBB">Consistent Delivery Across Period</span></div>';
  panel.append(effStrip);
  const trendSec = el('div', { class: 'section' });
  trendSec.append(el('h3', {}, 'Monthly Trend'));
  trendSec.append(el('div', { class: 'sec-sub' }, '6-month spend and revenue side-by-side, ROAS overlay'));
  const canvId = 'chart-' + pkey + '-trend';
  trendSec.append(el('div', { class: 'chart-wrap' }, el('canvas', { id: canvId })));
  panel.append(trendSec);
  const adTypes = p.ads.ad_types || [];
  if (adTypes.length) {
    const atSec = el('div', { class: 'section' });
    atSec.append(el('h3', {}, 'Ad-Type Performance'));
    atSec.append(el('div', { class: 'sec-sub' }, 'Six-month totals by ad-type'));
    if (pkey === 'blinkit') {
      atSec.append(el('div', { class: 'sec-sub', style: 'color:#1CBFBB;font-style:italic;margin-top:4px' }, 'Reach ad-types measure impression scale and category share of voice — sales attribution flows through Product Ads.'));
    }
    const wrap = el('div', { class: 'table-wrap' });
    const tbl = el('table', { id: 'tbl-' + pkey + '-adtypes' });
    tbl.innerHTML = '<thead><tr><th>Ad Type</th><th class="num">Spend</th><th class="num">Ad Sales</th><th class="num">ROAS</th><th class="num">Impressions</th><th class="num">Clicks</th><th class="num">Orders</th></tr></thead><tbody></tbody>';
    const body = tbl.querySelector('tbody');
    let ts = 0, tr = 0, ti = 0, tc = 0, to = 0;
    adTypes.forEach(at => {
      ts += at.spend;
      // Skip flagged-not-tracked from totals so grand row reflects only tracked
      if (!at.revenue_not_tracked) tr += at.revenue;
      ti += at.impressions; tc += at.clicks;
      if (!at.orders_not_tracked) to += at.orders;
      const row = document.createElement('tr');
      const revCell = at.revenue_not_tracked ? '<td class="num" style="color:#7D7D7D">—</td>' : '<td class="num" data-sort="' + at.revenue + '">' + fmtINR(at.revenue) + '</td>';
      const roasCell = at.roas_not_tracked ? '<td class="num" style="color:#7D7D7D">—</td>' : '<td class="num ' + roasClass(at.roas) + '" data-sort="' + at.roas + '">' + fmtROAS(at.roas) + '</td>';
      const ordCell = at.orders_not_tracked ? '<td class="num" style="color:#7D7D7D">—</td>' : '<td class="num" data-sort="' + at.orders + '">' + fmtNum(at.orders) + '</td>';
      row.innerHTML = '<td>' + at.name + '</td>' +
        '<td class="num" data-sort="' + at.spend + '">' + fmtINR(at.spend) + '</td>' +
        revCell +
        roasCell +
        '<td class="num" data-sort="' + at.impressions + '">' + fmtNum(at.impressions) + '</td>' +
        '<td class="num" data-sort="' + at.clicks + '">' + fmtNum(at.clicks) + '</td>' +
        ordCell;
      body.append(row);
    });
    const tRoas = ts > 0 ? tr / ts : 0;
    const totRow = document.createElement('tr'); totRow.className = 'total-row';
    totRow.innerHTML = '<td><strong>TOTAL</strong></td><td class="num">' + fmtINR(ts) + '</td><td class="num">' + fmtINR(tr) + '</td><td class="num ' + roasClass(tRoas) + '">' + fmtROAS(tRoas) + '</td><td class="num">' + fmtNum(ti) + '</td><td class="num">' + fmtNum(tc) + '</td><td class="num">' + fmtNum(to) + '</td>';
    body.append(totRow);
    wrap.append(tbl);
    atSec.append(wrap);
    panel.append(atSec);
    makeSortable(tbl);
  }
  const camps = p.ads.campaigns || [];
  const cGrand = p.ads.campaigns_grand || {};
  if (camps.length) {
    const cSec = el('div', { class: 'section' });
    cSec.append(el('h3', {}, 'Top 20 Campaigns by Spend'));
    cSec.append(el('div', { class: 'sec-sub' }, 'Click headers to sort'));
    const csvBtn = el('button', { class: 'csv-btn' }, 'Download CSV');
    csvBtn.onclick = () => { const headers = ['Campaign', 'Spend', 'Revenue', 'ROAS', 'Impressions', 'Clicks', 'Orders']; const rows = camps.map(c => [c.name, c.spend, c.revenue, c.roas, c.impressions, c.clicks, c.orders]); downloadCSV('daawat_' + pkey + '_top20_campaigns.csv', headers, rows); };
    cSec.append(csvBtn);
    const wrap = el('div', { class: 'table-wrap' });
    const tbl = el('table', { id: 'tbl-' + pkey + '-camp' });
    tbl.innerHTML = '<thead><tr><th>Campaign</th><th class="num">Spend</th><th class="num">Ad Sales</th><th class="num">ROAS</th><th class="num">Impressions</th><th class="num">Clicks</th><th class="num">Orders</th></tr></thead><tbody></tbody>';
    const body = tbl.querySelector('tbody');
    camps.forEach(c => {
      const row = document.createElement('tr');
      row.innerHTML = '<td style="max-width:360px;">' + c.name + '</td>' +
        '<td class="num" data-sort="' + c.spend + '">' + fmtINR(c.spend) + '</td>' +
        '<td class="num" data-sort="' + c.revenue + '">' + fmtINR(c.revenue) + '</td>' +
        '<td class="num ' + roasClass(c.roas) + '" data-sort="' + c.roas + '">' + fmtROAS(c.roas) + '</td>' +
        '<td class="num" data-sort="' + c.impressions + '">' + fmtNum(c.impressions) + '</td>' +
        '<td class="num" data-sort="' + c.clicks + '">' + fmtNum(c.clicks) + '</td>' +
        '<td class="num" data-sort="' + c.orders + '">' + fmtNum(c.orders) + '</td>';
      body.append(row);
    });
    const gRoas = cGrand.spend > 0 ? cGrand.revenue / cGrand.spend : 0;
    const totRow = document.createElement('tr'); totRow.className = 'total-row';
    totRow.innerHTML = '<td><strong>TOTAL — all ' + (cGrand.count || camps.length) + ' campaigns</strong></td>' +
      '<td class="num">' + fmtINR(cGrand.spend || 0) + '</td>' +
      '<td class="num">' + fmtINR(cGrand.revenue || 0) + '</td>' +
      '<td class="num ' + roasClass(gRoas) + '">' + fmtROAS(gRoas) + '</td>' +
      '<td class="num">—</td><td class="num">—</td><td class="num">—</td>';
    body.append(totRow);
    wrap.append(tbl);
    cSec.append(wrap);
    cSec.append(el('div', { class: 'table-note' }, 'Showing top 20 of ' + (cGrand.count || camps.length) + ' — TOTAL row reflects ALL campaigns for the platform'));
    panel.append(cSec);
    makeSortable(tbl);
  }
  const kws = p.ads.top_keywords || [];
  const kGrand = p.ads.keywords_grand || {};
  if (kws.length) {
    const kSec = el('div', { class: 'section' });
    kSec.append(el('h3', {}, 'Top 30 Keywords by Spend'));
    kSec.append(el('div', { class: 'sec-sub' }, 'Click headers to sort'));
    const csvBtn = el('button', { class: 'csv-btn' }, 'Download CSV');
    csvBtn.onclick = () => { const headers = ['Keyword', 'Match', 'Spend', 'Revenue', 'ROAS', 'Impressions', 'Clicks', 'Orders']; const rows = kws.map(k => [k.keyword, (k.match_type || '').replace('KEYWORD_MATCH_TYPE_', ''), k.spend, k.revenue, k.roas, k.impressions, k.clicks, k.orders]); downloadCSV('daawat_' + pkey + '_top30_keywords.csv', headers, rows); };
    kSec.append(csvBtn);
    const wrap = el('div', { class: 'table-wrap' });
    const tbl = el('table', { id: 'tbl-' + pkey + '-kw' });
    tbl.innerHTML = '<thead><tr><th>Keyword</th><th>Match</th><th class="num">Spend</th><th class="num">Ad Sales</th><th class="num">ROAS</th><th class="num">Impressions</th><th class="num">Clicks</th><th class="num">Orders</th></tr></thead><tbody></tbody>';
    const body = tbl.querySelector('tbody');
    kws.forEach(k => {
      const row = document.createElement('tr');
      row.innerHTML = '<td>' + k.keyword + '</td>' +
        '<td>' + (k.match_type || '').replace('KEYWORD_MATCH_TYPE_', '') + '</td>' +
        '<td class="num" data-sort="' + k.spend + '">' + fmtINR(k.spend) + '</td>' +
        '<td class="num" data-sort="' + k.revenue + '">' + fmtINR(k.revenue) + '</td>' +
        '<td class="num ' + roasClass(k.roas) + '" data-sort="' + k.roas + '">' + fmtROAS(k.roas) + '</td>' +
        '<td class="num" data-sort="' + k.impressions + '">' + fmtNum(k.impressions) + '</td>' +
        '<td class="num" data-sort="' + k.clicks + '">' + fmtNum(k.clicks) + '</td>' +
        '<td class="num" data-sort="' + k.orders + '">' + fmtNum(k.orders) + '</td>';
      body.append(row);
    });
    const gRoas = kGrand.spend > 0 ? kGrand.revenue / kGrand.spend : 0;
    const totRow = document.createElement('tr'); totRow.className = 'total-row';
    totRow.innerHTML = '<td colspan="2"><strong>TOTAL — all ' + (kGrand.count || kws.length) + ' keywords</strong></td>' +
      '<td class="num">' + fmtINR(kGrand.spend || 0) + '</td>' +
      '<td class="num">' + fmtINR(kGrand.revenue || 0) + '</td>' +
      '<td class="num ' + roasClass(gRoas) + '">' + fmtROAS(gRoas) + '</td>' +

    wrap.append(tbl);
    kSec.append(wrap);

  new Chart(document.getElementById(canvId), {

      { label: 'Spend', data: spend, backgroundColor: clr + 'B0', borderColor: clr, borderWidth: 1, yAxisID: 'y' },
      { label: 'Ad Sales', data: revenue, backgroundColor: '#020202B0', borderColor: '#020202', borderWidth: 1, yAxisID: 'y' },
      { label: 'ROAS', data: roas, type: 'line', borderColor: '#d97706', backgroundColor: 'transparent', tension: .3, yAxisID: 'y1', borderDash: [6, 4], borderWidth: 2 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 12 } } },
        tooltip: { callbacks: { label: (ctx) => { const v = ctx.parsed.y; if (ctx.dataset.label === 'ROAS') return 'ROAS: ' + v.toFixed(2) + 'x'; return ctx.dataset.label + ': ' + fmtINR(v); } } }
      },
      scales: { y: { position: 'left', ticks: { callback: v => fmtINR(v) }, grid: { color: '#f0f0f0' } }, y1: { position: 'right', ticks: { callback: v => v.toFixed(1) + 'x' }, grid: { display: false } } }
    }
  });
}
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  if (name === 'summary') renderSummary();
  else renderPlatform(name);
}
function applyFilter() {
  const active = document.querySelector('.tab.active').dataset.tab;
  switchTab(active);
}
function init() {
  document.getElementById('hdr-gen').textContent = 'Generated ' + D.generated;
  document.getElementById('hdr-sub').textContent = 'Advertising Performance Snapshot · ' + D.ads_period + ' (through ' + D.data_through + ')';
  document.getElementById('data-through-txt').textContent = 'Data through ' + D.data_through;
  const sel = document.getElementById('month-filter');
  D.summary.monthly_totals.forEach(m => { const opt = document.createElement('option'); opt.value = m.month; opt.textContent = m.label; sel.append(opt); });
  sel.addEventListener('change', e => { CURRENT_MONTH = e.target.value; applyFilter(); });
  document.getElementById('reset-btn').addEventListener('click', () => { sel.value = 'all'; CURRENT_MONTH = 'all'; applyFilter(); });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  const dn = D.data_notes || {};
  const thinList = (dn.period_highlights || dn.known_thin_months || []).map(x => '<li>' + x + '</li>').join('');
  document.getElementById('page-footer').innerHTML = '<div>Prepared by NorthSide · ' + D.generated + ' · Ads-only handover view · Confidential</div>' + (thinList ? '<div class="footnote"><strong>Period Highlights:</strong> ' + (dn.scope || '') + '<ul style="margin-top:6px;list-style:none;padding:0;">' + thinList + '</ul></div>' : '');
  renderSummary();
}
async function unlock() {
  const pw = document.getElementById('pw-input').value;
  const errEl = document.getElementById('pw-err');
  errEl.textContent = '';
  if (!pw) { errEl.textContent = 'Enter password'; return; }
  try { D = await decryptPayload(pw); document.getElementById('pw-overlay').style.display = 'none'; document.getElementById('app').classList.remove('hidden'); init(); }
  catch (e) { console.error(e); errEl.textContent = 'Incorrect password. Try again.'; }
}
document.getElementById('pw-btn').addEventListener('click', unlock);
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
