<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Elevens Coffee — H1 2026 vs H2 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>

:root{--teal:#1CBFBB;--teal-d:#18A6A3;--teal-t:#E6FAF9;--dark:#1a1a1a;--bg:#f8f9fa;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--green:#15803d;--amber:#d97706;--red:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#020202,#1a1a1a);display:flex;align-items:center;justify-content:center;z-index:9999}
#gate .box{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:40px;width:340px;text-align:center}
#gate img{height:34px;margin-bottom:22px}
#gate h2{color:#fff;font-size:16px;font-weight:500;margin-bottom:6px}
#gate p{color:#7D7D7D;font-size:13px;margin-bottom:20px}
#gate input{width:100%;padding:11px 14px;border:1px solid #333;border-radius:8px;background:#1c1c1c;color:#fff;font-size:14px;margin-bottom:12px}
#gate button{width:100%;padding:11px;border:none;border-radius:8px;background:var(--teal);color:#04342C;font-weight:600;font-size:14px;cursor:pointer}
#gate .err{color:#dc2626;font-size:12px;margin-top:10px;min-height:16px}
#app{display:none;max-width:1180px;margin:0 auto;padding:0 18px 60px}
header{background:linear-gradient(135deg,#020202,#1a1a1a);color:#fff;margin:0 -18px 0;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header .l{display:flex;align-items:center;gap:14px}
header img{height:30px}
header h1{font-size:18px;font-weight:500}
header .sub{font-size:12px;color:#9ca3af;margin-top:2px}
header .meta{font-size:11px;color:#9ca3af;text-align:right}
.banner{background:linear-gradient(135deg,var(--teal-t),#fff);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:14px 18px;margin:18px 0;font-size:13.5px;color:#0b4a48}
.banner b{color:var(--teal-d)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.toggle{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:none;background:#fff;padding:7px 14px;font-size:12.5px;color:var(--mut);cursor:pointer}
.toggle button.on{background:var(--teal);color:#04342C;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 18px}
.tabs button{border:none;background:none;padding:9px 14px;font-size:13.5px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--teal-d);border-bottom-color:var(--teal);font-weight:600}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.g4{grid-template-columns:1fr}}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;text-align:center}
.kpi .lab{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:24px;font-weight:600;margin:5px 0 2px}
.kpi .pl{font-size:11.5px;color:var(--mut)}
.kpi .badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:7px}
.up{background:#dcfce7;color:var(--green)} .dn{background:#fee2e2;color:var(--red)} .fl{background:#fef3c7;color:var(--amber)}
h3.sec{font-size:14px;font-weight:600;margin:22px 0 10px;color:#111}
.stories{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 0}
.stories div{padding:10px 18px;border-bottom:1px solid #f1f3f5;font-size:13px;display:flex;gap:10px}
.stories div:last-child{border-bottom:none}
.stories .n{color:var(--teal-d);font-weight:600;min-width:18px}
.sowhat{background:var(--teal-t);border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:12px 16px;margin-top:14px;font-size:13px;color:#0b4a48}
.sowhat b{color:var(--teal-d)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid #f1f3f5}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.02em;background:#fafbfc}
td:first-child,th:first-child{text-align:left}
tr.tot td{font-weight:700;border-top:2px solid var(--line);background:#fafbfc}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.risk{background:#fee2e2;color:var(--red)} .ontrack{background:#dcfce7;color:var(--green)}
tr.bbsel td{background:#e4f8f0}
tr.bbsel td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.csv{float:right;font-size:11px;color:var(--teal-d);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
.note{font-size:11px;color:var(--mut);margin-top:8px;font-style:italic}
canvas{max-height:280px}
.chartbox{position:relative;height:280px}
.drill{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.drill .dl-lab{font-size:12px;color:var(--mut);font-weight:600}
.drill a.dl{font-size:12.5px;text-decoration:none;color:var(--teal-d);background:var(--teal-t);border:1px solid var(--teal);border-radius:8px;padding:6px 12px;font-weight:600}
.drill a.dl:hover{background:var(--teal);color:#04342C}

</style>
</head>

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(){
  const pw=document.getElementById('pw').value.trim(); if(!pw)return;
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC_SALT),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC_IV)},key,b64(ENC_DATA));
    D=JSON.parse(new TextDecoder().decode(pt));
    if(!D) throw new Error('bad');
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    render();
  }catch(e){ document.getElementById('err').textContent='Incorrect password. Please try again.'; }
}
function inr(v){v=+v||0;const a=Math.abs(v);if(a>=1e7)return '₹'+(v/1e7).toFixed(2)+'Cr';if(a>=1e5)return '₹'+(v/1e5).toFixed(2)+'L';if(a>=1e3)return '₹'+(v/1e3).toFixed(1)+'K';return '₹'+Math.round(v);}
function num(v){return (+v||0).toLocaleString('en-IN');}
function nm(s){return String(s||'').replace(/\s+/g,' ').trim();}
function badge(dl,goodDir){
  if(dl==='NEW')return '<span class="chip ontrack">NEW in H1</span>';
  if(dl==='DROP')return '<span class="chip" style="background:#fef3c7;color:var(--amber)">under review</span>';
  const v=+dl; const ar=v>0?'▲':(v<0?'▼':'▬');
  // goodDir: 1 = up is good (default), -1 = down is good (e.g. TACoS), 0 = neutral (e.g. spend)
  var gd=(goodDir===undefined)?1:goodDir;
  if(gd===0) return '<span class="badge" style="background:#eef1f4;color:var(--mut)">'+ar+' '+Math.abs(v).toFixed(0)+'%</span>';
  var good=v*gd; var cls=good>0?'up':(good<0?'dn':'fl');
  return '<span class="badge '+cls+'">'+ar+' '+Math.abs(v).toFixed(0)+'%</span>';
}
function deltaCell(dl){
  if(dl==='NEW')return '<span class="chip ontrack">NEW</span>';
  if(dl==='DROP')return '<span class="chip risk">—</span>';
  const v=+dl; const c=v>0?'var(--green)':(v<0?'var(--red)':'var(--mut)'); const ar=v>0?'▲':(v<0?'▼':'▬');
  return '<span style="color:'+c+';font-weight:600">'+ar+' '+Math.abs(v).toFixed(0)+'%</span>';
}

  charts.r=new Chart(document.getElementById('cRoas'),{data:{labels:t.months,datasets:[
    {type:'line',label:'Ad ROAS',data:t.roas,borderColor:'#1CBFBB',backgroundColor:'#1CBFBB22',fill:true,tension:.3,pointRadius:4},
    {type:'line',label:'Break-even (1.0x)',data:t.months.map(()=>1),borderColor:'#dc2626',borderDash:[5,4],borderWidth:1.5,pointRadius:0}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>v.toFixed(1)+'x'}}}}});
}catch(e){console.warn(e);}}

function cmpTable(id,rows,label,firstCol){
  let tr=rows.map(r=>'<tr><td>'+nm(r.name)+'</td><td>'+inr(r.h2)+'</td><td>'+inr(r.h1)+'</td><td>'+deltaCell(r.delta)+'</td></tr>').join('');
  const t2=rows.reduce((a,r)=>a+r.h2,0),t1=rows.reduce((a,r)=>a+r.h1,0);
  tr+='<tr class="tot"><td>TOTAL</td><td>'+inr(t2)+'</td><td>'+inr(t1)+'</td><td>'+deltaCell(dpct(t2,t1))+'</td></tr>';
  return '<div class="card"><h3 class="sec" style="margin:0 0 8px">'+label+' '+csvBtn(id)+'</h3><div style="overflow-x:auto"><table id="'+id+'"><thead><tr><th>'+firstCol+'</th><th>H2 2025</th><th>H1 2026</th><th>&Delta;</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
}
function cmpChart(cid){
  return '<div class="card"><h3 class="sec" style="margin:0 0 8px">H2 2025 vs H1 2026 — revenue</h3><div class="chartbox"><canvas id="'+cid+'"></canvas></div></div>';
}
function drawCmp(cid,rows){try{
  charts[cid]&&charts[cid].destroy();
  charts[cid]=new Chart(document.getElementById(cid),{type:'bar',data:{labels:rows.map(r=>nm(r.name)),datasets:[
    {label:'H2 2025',data:rows.map(r=>r.h2),backgroundColor:'#c7cbd1'},
    {label:'H1 2026',data:rows.map(r=>r.h1),backgroundColor:'#1CBFBB'}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+inr(c.raw)}}},scales:{y:{ticks:{callback:v=>inr(v)}}}}});
}catch(e){console.warn(e);}}

function tabCollections(){
  const r=D.collections;
  let html='<div class="grid g2">'+cmpTable('tColl',r,'Collection revenue — H2 vs H1','Collection')+cmpChart('cColl')+'</div>';
  const gr=r.filter(x=>x.delta==='NEW').map(x=>nm(x.name));
  html+='<div class="sowhat"><b>So what —</b> Speciality, Explorer&rsquo;s Pack and Single Origin drove H1 growth'+(gr.length?'; '+gr.join(' &amp; ')+' launched in H1':'')+'. Coffee Machine held flat (organic, zero ad spend). Concentrate ad support on the profitable growers and keep Machine organic.</div>';
  document.getElementById('tabbody').innerHTML=html; drawCmp('cColl',r);
}
function tabProducts(){
  const ps=D.packsizes, pr=D.products;
  let html='<div class="grid g2">'+cmpTable('tPack',ps,'Pack size — H2 vs H1','Pack size')+cmpChart('cPack')+'</div>';
  html+='<h3 class="sec">Top products — H2 vs H1</h3><div class="card"><div style="overflow-x:auto"><table id="tProd"><thead><tr><th>Product</th><th>H2 2025</th><th>H1 2026</th><th>&Delta;</th></tr></thead><tbody>'+
    pr.map(r=>'<tr><td>'+nm(r.name)+'</td><td>'+inr(r.h2)+'</td><td>'+inr(r.h1)+'</td><td>'+deltaCell(r.delta)+'</td></tr>').join('')+'</tbody></table></div></div>';
  html+='<div class="sowhat"><b>So what —</b> Pack-of-1 remains the volume base; multi-packs (P3/P5) and Variety are the higher-AOV expansion lanes launched/scaled in H1. Push bundles to lift AOV.</div>';
  document.getElementById('tabbody').innerHTML=html; drawCmp('cPack',ps);
}
function tabAds(){
  const a=D.adsegs;
  let tr=a.map(r=>'<tr><td>'+r.seg+'</td><td>'+inr(r.h2_spend)+'</td><td>'+inr(r.h1_spend)+'</td><td>'+deltaCell(r.delta)+'</td><td>'+r.h2_roas.toFixed(2)+'x</td><td>'+r.h1_roas.toFixed(2)+'x</td></tr>').join('');
  const ts2=a.reduce((s,r)=>s+r.h2_spend,0),ts1=a.reduce((s,r)=>s+r.h1_spend,0);
  tr+='<tr class="tot"><td>TOTAL</td><td>'+inr(ts2)+'</td><td>'+inr(ts1)+'</td><td>'+deltaCell(dpct(ts2,ts1))+'</td><td>'+D.h2.roas.toFixed(2)+'x</td><td>'+D.h1.roas.toFixed(2)+'x</td></tr>';
  let html='<div class="card"><h3 class="sec" style="margin:0 0 8px">Ad type — spend &amp; ROAS, H2 vs H1 '+csvBtn('tAds')+'</h3><div style="overflow-x:auto"><table id="tAds"><thead><tr><th>Ad Type</th><th>Spend H2 25</th><th>Spend H1 26</th><th>&Delta; Spend</th><th>ROAS H2</th><th>ROAS H1</th></tr></thead><tbody>'+tr+'</tbody></table></div>';
  html+='<div class="note">Full ASIN / keyword / campaign detail &rarr; <a href="'+D.ads_url+'" target="_blank" rel="noopener" style="color:var(--teal-d);font-weight:600">Elevens Coffee — Ads Dashboard &#8599;</a></div></div>';
  html+='<div class="sowhat"><b>So what —</b> SB investment scaled significantly into H1 at '+a[2].h1_roas.toFixed(2)+'x — the biggest efficiency opportunity under review. SD remains the strongest lane. Plan: rebalance SB, protect SD, refine SP industry terms. See the Ads dashboard for keyword-level actions.</div>';
  document.getElementById('tabbody').innerHTML=html;
}
function tabGeo(){
  let html='<div class="grid g2">'+cmpTable('tZone',D.zones,'Zone revenue — H2 vs H1','Zone')+cmpChart('cZone')+'</div>';
  html+='<div class="grid g2" style="margin-top:12px">'+cmpTable('tState',D.states.slice(0,10),'Top states — H2 vs H1','State')+cmpTable('tCity',D.cities,'Top cities — H2 vs H1','City')+'</div>';
  html+='<div class="sowhat"><b>So what — FBA / GST expansion opportunity —</b> Currently stocked via Bangalore, Mumbai &amp; Gurgaon (67% of revenue sits in those 3 FBA states — closer FBA clearly lifts sales). Highest-demand states with no local warehouse yet: <b>Tamil Nadu (Chennai)</b> and the <b>East (Kolkata)</b>. Recommend adding GST/FBA at <b>Chennai + Kolkata</b> to unlock under-served demand.</div>';
  document.getElementById('tabbody').innerHTML=html; drawCmp('cZone',D.zones);
}
function tabPlan(){
  const jp=D.july_plan||{}; const t=jp.targets||[]; const je=jp.jun_exit||{};
  let html='<div class="banner" style="margin-top:0"><b>From review to plan —</b> H1 exited June at ~₹'+(je.total_rev/100000).toFixed(2)+'L total (Pods ₹'+(je.pods_rev/100000).toFixed(2)+'L @ '+je.roas.toFixed(2)+'x). July holds the ambition and pivots the focus from <i>scale</i> to <i>efficiency</i>.</div>';
  html+='<h3 class="sec">July 2026 targets (single month — distinct from the H1 target on the Actual vs Target tab)</h3><div class="grid g2">';
  t.forEach(x=>{ html+='<div class="kpi"><div class="lab">'+x.name+'</div><div class="val">'+inr(x.rev)+' <span style="font-size:13px;color:var(--mut)">Pods</span></div><div class="pl">Spend '+inr(x.spend)+' · bROAS <b style="color:var(--teal-d)">'+x.broas.toFixed(2)+'x</b></div><div class="pl" style="margin-top:4px">'+x.note+'</div></div>'; });
  html+='</div>';
  html+='<h3 class="sec">Three priorities (the H2 turn)</h3><div class="stories">'+(jp.priorities||[]).map((p,i)=>'<div><span class="n">'+(i+1)+'</span><span><b>'+p.t+'</b> — '+p.d+'</span></div>').join('')+'</div>';
  html+='<div class="grid g2" style="margin-top:16px">';
  html+='<div class="card"><h3 class="sec" style="margin:0 0 8px">&#11088; Working well — scale these</h3><table><thead><tr><th>Lane</th><th>ROAS</th></tr></thead><tbody>'+(jp.scale_up||[]).map(s=>'<tr><td>'+s.n+'</td><td style="color:var(--green);font-weight:600">'+s.r+'</td></tr>').join('')+'</tbody></table></div>';
  html+='<div class="card"><h3 class="sec" style="margin:0 0 8px">&#128295; Under review — to optimise</h3><table><thead><tr><th>Lane</th><th>ROAS</th></tr></thead><tbody>'+(jp.under_review||[]).map(s=>'<tr><td>'+s.n+'</td><td style="color:var(--amber);font-weight:600">'+s.r+'</td></tr>').join('')+'</tbody></table></div>';
  html+='</div>';
  html+='<h3 class="sec">H2 focus areas</h3><div class="stories">'+(jp.causes||[]).map((c,i)=>'<div><span class="n">'+(i+1)+'</span><span>'+c+'</span></div>').join('')+'</div>';
  html+='<div class="sowhat" style="margin-top:16px"><b>So what —</b> H1 proved the brand can scale; H2 is about scaling <i>profitably</i>. The plan recovers the June gap at flat spend through ad-mix optimisation, unlocks under-served demand via inventory redistribution, and optionally captures Prime Day — targeting '+ (t[0]?t[0].broas.toFixed(2):'1.22')+'x (base) to '+(t[1]?t[1].broas.toFixed(2):'1.26')+'x (with Prime Day).</div>';
  document.getElementById('tabbody').innerHTML=html;
}
</script>
</body>
</html>
