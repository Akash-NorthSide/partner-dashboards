<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta http-equiv="X-Robots-Tag" content="noindex, nofollow">
<title>Elevens Coffee Rank Tracker</title>
<style>
:root{color-scheme:light;--teal:#1CBFBB;--teal-d:#18A6A3;--teal-ink:#0E7C79;--teal-bg:#E6FAF9;--ink:#0c2a29;--ink2:#3d5655;--mut:#5f7473;--bd:#e0e9e8;--bg:#f4f7f7;--surf:#ffffff;--surf2:#f4fbfb;
--good:#166534;--good-bg:#dcfce7;--good-s:#16a34a;--warn:#92400e;--warn-bg:#fef3c7;--warn-s:#f59e0b;--bad:#9a3412;--bad-bg:#ffedd5;--bad-s:#ea580c;--neu:#5f7473;--neu-bg:#edf2f2;
--b1:#0E7C79;--b2:#1CBFBB;--b3:#b9e8e6;--gate:#020202;--gate2:#0d1414}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
/* EC-98: same opening page as the other Elevens dashboards (Sales / Ads / Market share) */
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#020202 0%,#1a3a39 100%);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#gate .box{background:#fff;border-radius:12px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;max-width:400px;width:90%;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
#gate img{height:40px;margin-bottom:20px}
#gate h2{font-size:1.25rem;font-weight:600;color:#020202;margin:0 0 8px}
#gate p{font-size:.875rem;color:#7D7D7D;margin:0 0 24px}
#gate input{width:100%;padding:12px 16px;border:2px solid #E6E4E4;border-radius:8px;font-size:1rem;font-family:inherit;outline:none;background:#fff;color:#020202;margin-bottom:16px}
#gate input:focus{border-color:#1CBFBB}
#gate button{width:100%;padding:12px;background:#1CBFBB;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
#gate button:hover{background:#369290}
#gerr{color:#D9822B;font-size:.8125rem;margin-top:12px;min-height:16px}
#gerr:empty{display:none}
.ns-switch{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.ns-seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:3px;gap:2px}
.ns-seg a{color:#e6f4f3;text-decoration:none;font-size:13px;font-weight:700;padding:6px 14px;border-radius:7px;white-space:nowrap;line-height:1.4}
.ns-seg a:hover{background:rgba(255,255,255,.12)}
.ns-seg a.on{background:#1CBFBB;color:#012}
.ns-lock{font:inherit;font-size:13px;font-weight:700;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:6px 12px;cursor:pointer;white-space:nowrap;line-height:1.4}
.ns-lock:hover{border-color:#1CBFBB;color:#1CBFBB}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header.top{background:linear-gradient(120deg,#020202,#143a39);color:#fff;padding:18px 22px;border-radius:0 0 14px 14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
header.top .logos{display:flex;align-items:center;gap:12px}
header.top img.ns{height:26px}
header.top img.br{height:30px;background:#fff;border-radius:6px;padding:3px 6px}
header.top .ttl{flex:1;min-width:200px}
header.top h1{font-size:19px;margin:0;font-weight:700}
header.top .sub{color:#a8ecea;font-size:12.5px;margin-top:2px}
header.top .src img{height:17px;display:block;margin-left:auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:2px solid var(--bd)}
.tab{background:none;border:none;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--teal-ink);border-bottom-color:var(--teal)}
.tab:focus-visible,.copy:focus-visible,#gate button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
.gap{display:grid;gap:14px}
.gap>*,.two>*,.tiles>*{min-width:0}
h2.sh{font-size:15px;margin:0 0 2px}
p.sn{font-size:12.5px;color:var(--mut);margin:0 0 12px}
/* verdict */
.verdict{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:12px;padding:14px 18px;border:1px solid var(--bd);background:var(--surf)}
.vpill{font-weight:800;font-size:15px;padding:6px 14px;border-radius:999px;white-space:nowrap}
.v-good .vpill{background:var(--good-bg);color:var(--good)}.v-steady .vpill{background:var(--teal-bg);color:var(--teal-ink)}.v-watch .vpill{background:var(--warn-bg);color:var(--warn)}
.vline{font-size:16px;font-weight:700}
.vsub{font-size:12.5px;color:var(--mut)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.tiles{grid-template-columns:1fr}}
.tile .who{font-size:12.5px;font-weight:700;color:var(--teal-ink);margin-top:2px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.three>*{min-width:0}
.vol{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.vol:last-child{border-bottom:none}
.vol .ix{font-size:12px;font-weight:800;color:var(--mut)}
.vol .nm b{display:block;font-size:13.5px;line-height:1.25}.vol .nm span{font-size:11.5px;color:var(--mut)}
.vol .rk{font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:999px;padding:3px;background:var(--surf2);margin-bottom:6px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal-ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.pn em{display:block;font-style:normal;font-size:12px;color:var(--teal-ink);font-weight:600}
.tile .lbl{font-size:13px;font-weight:700;color:var(--ink2)}
.tile .row{display:flex;align-items:baseline;gap:10px;margin-top:2px;flex-wrap:wrap}
.tile .big{font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .big small{font-size:14px;color:var(--mut);font-weight:600}
.tile .hint{font-size:12px;color:var(--mut);margin-top:6px}
.tile svg{display:block;width:100%;height:auto;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.c-up{background:var(--good-bg);color:var(--good)}.c-dn{background:var(--bad-bg);color:var(--bad)}.c-eq{background:var(--neu-bg);color:var(--neu)}
/* takeaways */
.tk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14.5px}
.tk:last-child{border-bottom:none}
.tk .ic{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.tk .kind{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);min-width:52px}
.k-win .ic{background:var(--good-bg);color:var(--good)}.k-watch .ic{background:var(--warn-bg);color:var(--warn)}.k-act .ic{background:var(--teal-bg);color:var(--teal-ink)}
/* stacked bars */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.sbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surf);margin:4px 0 12px}
.sbar div{min-width:4px}
.leg{display:grid;gap:6px}
.leg .li{display:flex;align-items:center;gap:8px;font-size:13px}
.leg .sw{width:12px;height:12px;border-radius:3px;flex:none}
.leg .li b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px}
.leg .li span.d{color:var(--mut);font-size:12px}
.note{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px}
/* products */
.grp{margin-bottom:6px}
.grph{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px}
.grph h3{font-size:14px;margin:0}
.grph span{font-size:12px;color:var(--mut)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 130px 92px 92px;grid-template-areas:"n s r c";align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:none}
.pn{grid-area:n;min-width:0}.pn b{display:block;font-size:14px;line-height:1.25}.pn span{font-size:12px;color:var(--mut)}
.ps{grid-area:s}.ps svg{display:block;width:130px;height:34px}
.pr{grid-area:r;font-size:20px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.pc{grid-area:c;text-align:right}
@media(max-width:560px){.prow{grid-template-columns:1fr auto auto;grid-template-areas:"n n n" "s r c";row-gap:4px}.ps svg{width:110px}}
/* heat map */
.tscroll{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:6px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid #edf2f2}
th{background:var(--surf2);color:#0c3a39;font-weight:700;font-size:11.5px}
td.l,th.l{text-align:left}
.hm th.l,.hm td.l{position:sticky;left:0;background:var(--surf);z-index:1;min-width:190px;box-shadow:1px 0 0 var(--bd)}
.hm th.l{background:var(--surf2)}
.hm tr.gh td{background:var(--surf2);font-weight:700;font-size:11.5px;color:var(--ink2);text-align:left;letter-spacing:.3px;text-transform:uppercase}
.hm tr.gh td.l{background:var(--surf2)}
.cell{display:inline-block;min-width:34px;padding:3px 0;border-radius:6px;font-weight:700;font-size:12px}
.h-top{background:var(--good-s);color:#fff}.h-org{background:var(--good-bg);color:var(--good)}.h-ad{background:var(--warn-bg);color:var(--warn)}.h-no{background:var(--bad-bg);color:var(--bad)}
.cell.both{position:relative}.cell.both::after{content:'';position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--warn-s);border:1.5px solid #fff}
.health{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.xrow{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:6px 12px;align-items:start;padding:8px 0;border-bottom:1px solid var(--bd)}.xrow b{font-size:13.5px}
.xcs{display:flex;flex-wrap:wrap;gap:6px}.xc{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.x-on{background:var(--good-bg);color:var(--good)}.x-drop{background:var(--bad-bg);color:var(--bad);border:1px solid #fdba74}.xd{letter-spacing:1px;margin-right:6px;font-size:10px}.xd .y{color:var(--good-s)}.xd .n{color:#9aaead}.xd .o{color:var(--bad-s)}
.xev{display:grid;gap:6px;margin:4px 0 12px}.xe{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;padding:7px 10px;border-radius:8px}.xe b{font-weight:800}.xe .when{margin-left:auto;font-size:12px;color:var(--mut)}.xe-dropped{background:var(--bad-bg);color:var(--bad)}.xe-started{background:var(--good-bg);color:var(--good)}.xe-amount{background:var(--warn-bg);color:var(--warn)}.xe-quiet{background:var(--surf2);color:var(--good)}.xe-old{background:var(--surf2);color:var(--mut);font-size:12.5px}.xe-old b{font-weight:700}.xe .dts{display:flex;gap:4px;flex-wrap:wrap;flex-basis:100%;padding-left:2px}.xe .dt{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.06)}.xe .dt.now{font-weight:800;box-shadow:inset 0 0 0 1px currentColor}.xe-sep{font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:6px 0 0}td.xdrop{background:var(--bad-bg);color:var(--bad);font-weight:700}.x-off{background:var(--neu-bg);color:var(--neu)}.x-oos{background:var(--bad-bg);color:var(--bad)}.x-na{background:#f3f6f6;color:#9aaead}
@media(max-width:560px){.xrow{grid-template-columns:1fr}.xc{white-space:normal}}
.h-na{background:repeating-linear-gradient(45deg,#f3f6f6 0 4px,#e7eeee 4px 8px);color:transparent}.h-lt{background:#efe9dc;color:#8a6d2b}
th.al{box-shadow:inset 0 -3px 0 var(--warn-s)}
@media(max-width:560px){.hm th.l,.hm td.l{min-width:128px;max-width:150px;white-space:normal;line-height:1.3}.tag-new{margin-left:3px}}
.kwn{display:block;font-weight:600}.kww{display:block;font-size:11px;font-weight:600;margin-top:1px}.w-free{color:var(--good)}.w-ad{color:var(--warn)}.w-none{color:var(--bad)}
.tag-new{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--teal-ink);background:var(--teal-bg);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px}
.sc{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 64px;gap:6px 12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.sc:last-child{border-bottom:none}.sc .g{font-weight:700;font-size:13.5px}.sc .sbar{margin:0;height:18px}.sc .n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
@media(max-width:560px){.sc{grid-template-columns:1fr 56px}.sc .sbar{grid-column:1/-1;grid-row:2}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--ink2);align-items:center}
.legend .cell{min-width:30px;text-align:center}
.st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.st-top,.st-org{background:var(--good-bg);color:var(--good)}.st-ad{background:var(--warn-bg);color:var(--warn)}.st-no{background:var(--bad-bg);color:var(--bad)}
/* data */
.sechd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.copy{border:none;background:var(--teal);color:#012;font-weight:600;font-size:11.5px;padding:5px 11px;border-radius:6px;cursor:pointer}
.copy:hover{background:var(--teal-d)}
dl.how{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:8px 14px;margin:0;font-size:13.5px}
dl.how dt{font-weight:700;color:var(--teal-ink)}dl.how dd{margin:0;color:var(--ink2)}
@media(max-width:560px){dl.how{grid-template-columns:1fr}dl.how dd{margin-bottom:6px}}
details.more{border:1px solid var(--bd);border-radius:10px;padding:10px 14px;background:var(--surf)}
details.more summary{cursor:pointer;font-weight:700}
details.more[open] summary{margin-bottom:10px}
tr.skip td{color:var(--mut);background:#fafcfc}
.foot{text-align:center;color:var(--mut);font-size:11.5px;margin-top:20px;padding-top:12px;border-top:1px solid var(--bd)}
#err{background:var(--bad-bg);color:var(--bad);padding:12px 16px;border-radius:8px;margin:12px 0}
@media(max-width:560px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tab{padding:10px 10px;white-space:nowrap;font-size:13.5px}header.top{padding:14px 16px}header.top h1{font-size:17px}.tile .big{font-size:30px}}
/* stock + today + exchange tab (added 06.11.2026) */
.stk{border:1px solid #fdba74;border-left:5px solid var(--bad-s);background:#fff7ed;border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:8px 20px;align-items:center}
.stk h2{font-size:15px;margin:0;color:var(--bad)}.stk h2 span{font-weight:500;font-size:12.5px;color:var(--mut)}
.stk ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}.stk li{margin:3px 0}.stk li.back{color:var(--good);font-weight:600;list-style:none;margin-left:-18px}
.stk .sk .lbl{font-size:12.5px;font-weight:700;color:var(--ink2)}.stk .sk .big{font-size:28px;font-weight:800;color:var(--bad);line-height:1.1}.stk .sk .big small{font-size:13px;color:var(--mut);font-weight:600}.stk .sk svg{display:block;width:100%;height:auto;margin-top:4px}
.stk-ok{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid var(--bd);border-left:5px solid var(--good-s);background:var(--surf);font-size:13.5px}.stk-ok b{color:var(--good)}
@media(max-width:640px){.stk{grid-template-columns:1fr}}
.tag-oos,.tag-part{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag-oos{color:var(--bad);background:var(--bad-bg)}.tag-part{color:var(--warn);background:var(--warn-bg)}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:760px){.tiles.t3{grid-template-columns:1fr}}
.chartbox{overflow-x:auto}.chartbox svg{display:block;width:100%;min-width:560px;height:auto}
.chartbox .ax{font-size:12px;fill:#5f7473;font-family:inherit}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;margin-top:8px;color:var(--ink2)}.lgd i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}.lgd i.sq{height:12px;width:12px;border-radius:3px}
.mv{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13.5px}.mv:last-child{border-bottom:none}.mv>span:first-child{min-width:0}.mv .s{color:var(--mut);font-size:12px}.mv>:last-child{margin-left:auto;flex:none}.mv svg{display:block;width:90px;height:26px;flex:none}
h3.mini{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:12px 0 2px}
.none{font-size:13px;color:var(--mut);padding:4px 0;margin:0}
.xdet{flex-basis:100%;font-size:12.5px}.xdet summary{cursor:pointer;font-weight:600}.xdet div{padding:2px 0}.xdet div span{color:var(--mut)}
table.xt td{vertical-align:middle}table.xt td.sp svg{display:block;width:120px;height:30px;margin:auto}
.tag-deal{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;white-space:nowrap;color:#1e40af;background:#dbeafe}
table.cmp td{vertical-align:middle}table.cmp tr.us td{background:var(--teal-bg)}table.cmp .s,#tCmp .s{color:var(--mut);font-size:11.5px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let D=null;const DONE={};
const $=id=>document.getElementById(id);
function b64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function deriveKey(p,s){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decryptData(p){const k=await deriveKey(p,b64ToBytes(ENC_SALT));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},k,b64ToBytes(ENC_DATA));return JSON.parse(new TextDecoder().decode(pt));}

/* 12.11.2026 remember-me (brand dashboards): after one unlock, a brand-only AES key (shared salt, never the password) is kept for
   NS_REM.ttl_h hours in localStorage so Sales, Ads and Rank tracker open without asking again. Lock clears it on this browser. */
const NS_REM={"key": "ns_k_elevens_v3", "ttl_h": 24};
function nsB64(buf){let s='';new Uint8Array(buf).forEach(b=>{s+=String.fromCharCode(b);});return btoa(s);}
async function nsRemember(pw){if(!NS_REM)return;try{const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(ENC_SALT),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
 localStorage.setItem(NS_REM.key,JSON.stringify({k:nsB64(await crypto.subtle.exportKey('raw',k)),s:ENC_SALT,exp:Date.now()+NS_REM.ttl_h*3600000}));}catch(e){}}
async function nsStoredKey(){if(!NS_REM)return null;try{const r=JSON.parse(localStorage.getItem(NS_REM.key)||'null');if(!r)return null;
 if(Date.now()>r.exp){localStorage.removeItem(NS_REM.key);return null;}if(r.s!==ENC_SALT)return null;
 return await crypto.subtle.importKey('raw',b64ToBytes(r.k),{name:'AES-GCM'},false,['decrypt']);}catch(e){return null;}}
function nsLockAll(){try{if(NS_REM)localStorage.removeItem(NS_REM.key);sessionStorage.clear();}catch(e){}location.reload();}
async function nsAuto(){const k=await nsStoredKey();if(!k)return;try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},k,b64ToBytes(ENC_DATA));D=JSON.parse(new TextDecoder().decode(pt));}catch(e){return;}
 $('gate').hidden=true;$('app').hidden=false;try{renderAll();}catch(e){console.error(e);}}
async function unlock(){const pw=$('pw').value;$('gerr').textContent='';try{D=await decryptData(pw);}catch(e){$('gerr').textContent='Incorrect password. Please try again.';return;}
 nsRemember(pw);
 $('gate').hidden=true;$('app').hidden=false;try{renderAll();}catch(e){console.error(e);$('p-sum').insertAdjacentHTML('afterbegin','<div id="err">Something went wrong drawing the dashboard: '+esc(String(e.message||e))+'</div>');}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function chg(d,neutral){
 if(d===null||d===undefined)return '<span class="chip c-eq">new</span>';
 if(d===0)return '<span class="chip c-eq">● same</span>';
 const cls=neutral?'c-eq':(d>0?'c-up':'c-dn');
 return '<span class="chip '+cls+'">'+(d>0?'▲ ':'▼ ')+Math.abs(d).toLocaleString('en-IN')+'</span>';}
function nf(n){return Number(n).toLocaleString('en-IN');}
/* inline SVG sparkline. rank=true: lower value drawn higher (better) */
function spark(vals,labels,o){
 o=o||{};const w=o.w||130,h=o.h||34,px=5,py=5,rank=!!o.rank,fmt=o.fmt||(v=>String(v));
 const nums=vals.filter(v=>v!=null);if(!nums.length)return '<svg viewBox="0 0 '+w+' '+h+'"></svg>';
 let lo=Math.min.apply(null,nums),hi=Math.max.apply(null,nums);if(lo===hi){lo-=1;hi+=1;}
 const n=vals.length,X=i=>px+(n>1?i*(w-2*px)/(n-1):(w-2*px)/2),Y=v=>rank?py+(v-lo)/(hi-lo)*(h-2*py):py+(hi-v)/(hi-lo)*(h-2*py);
 let d='',pen=false;vals.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true;});
 let last=-1;vals.forEach((v,i)=>{if(v!=null)last=i;});
 const endc=o.endColor||'#0E7C79';
 let s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.aria||'trend')+'">';
 s+='<line x1="'+px+'" x2="'+(w-px)+'" y1="'+(h-1)+'" y2="'+(h-1)+'" stroke="#e3ebea" stroke-width="1"/>';
 s+='<path d="'+d+'" fill="none" stroke="#0E7C79" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
 vals.forEach((v,i)=>{if(v==null)return;const isL=i===last;
  s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(isL?3.6:2)+'" fill="'+(isL?endc:'#0E7C79')+'" stroke="#fff" stroke-width="'+(isL?1.5:0)+'"><title>'+esc(labels[i])+': '+esc(fmt(v))+'</title></circle>';});
 return s+'</svg>';}
function copyTable(id,btn){const ts=id.split(',').map(x=>$(x)).filter(Boolean);if(!ts.length)return;const t=ts[0];const tsv=ts.map((tb,j)=>[...tb.rows].filter(r=>j===0||r.parentNode.tagName!=='THEAD').map(r=>[...r.cells].map(c=>(c.innerText||c.textContent).replace(/\s+/g,' ').trim()).join('\t')).join('\n')).join('\n');
 const done=()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy table',1500);};
 const fb=()=>{const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected — press Ctrl+C';setTimeout(()=>btn.textContent='Copy table',2500);};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tsv).then(done,fb);}else fb();}
function showTab(t){['sum','day','prd','src','exc','cmp','dat'].forEach(k=>{$('p-'+k).hidden=(k!==t);$('t-'+k).setAttribute('aria-selected',k===t?'true':'false');});
 if(!DONE[t]){DONE[t]=1;({sum:rSum,day:rDay,prd:rPrd,src:rSrc,exc:rExc,cmp:rCmp,dat:rDat})[t]();}}
function renderAll(){
 $('hsub').textContent='Updated '+D.meta.updated+' · checked daily on Amazon.in';
 $('foot').textContent='Confidential — prepared by NorthSide for Elevens Coffee · Refreshed automatically after every scan · Built '+D.meta.generated;
 if(D.comp)$('t-cmp').hidden=false;if(D.offers)$('t-exc').hidden=false;
 DONE.sum=1;rSum();}

function rSum(){
 const G=D.glance,V=G.verdict;
 let h='<div class="verdict v-'+V.level+'"><span class="vpill">● '+esc(V.head)+'</span><div><div class="vline">'+esc(V.line)+'</div><div class="vsub">'+esc(V.sub)+'</div></div></div>';
 h+=stockStrip();h+='<div class="tiles">'+G.tiles.map(t=>{const s=t.series,d=s.length>1?s[s.length-1]-s[s.length-2]:null;
  if(t.kind==='rank')return '<div class="card tile"><div class="lbl">'+esc(t.label)+'</div><div class="row"><span class="big">#'+nf(t.value)+'</span>'+chg(t.d)+'</div><div class="who">'+esc(t.name)+'</div>'+
   spark(s,t.labels,{w:240,h:46,rank:true,aria:t.name+' Grocery & Gourmet Foods rank over time',fmt:v=>'#'+nf(v)})+'<div class="hint">'+esc(t.hint)+'</div></div>';
  const dd=t.pct?t.d:d;
  return '<div class="card tile"><div class="lbl">'+esc(t.label)+'</div><div class="row"><span class="big">'+t.value+' <small>of '+t.of+'</small></span>'+(dd==null?'':chg(dd,t.good==='neutral'))+'</div>'+
  spark(s,t.labels,{w:240,h:46,aria:t.label+' over time',fmt:t.pct?(v=>v+'% of searches'):(v=>v+' of '+t.of)})+'<div class="hint">'+esc(t.hint)+'</div></div>';}).join('')+'</div>';
 const ic={win:'✓',watch:'!',act:'→'},kn={win:'Win',watch:'Watch',act:'Action'};
 h+='<div class="card"><h2 class="sh">Today\'s 3 takeaways</h2>'+G.takeaways.map(t=>'<div class="tk k-'+t.kind+'"><span class="ic">'+ic[t.kind]+'</span><span class="kind">'+kn[t.kind]+'</span><span>'+esc(t.text)+'</span></div>').join('')+'</div>';
 const B=G.bands,S=G.search_today;
 const bar=(segs)=>'<div class="sbar">'+segs.filter(x=>x.n>0).map(x=>'<div style="flex:'+x.n+';background:'+x.c+'" title="'+esc(x.l)+': '+x.n+'"></div>').join('')+'</div>';
 const leg=(segs)=>'<div class="leg">'+segs.map(x=>'<div class="li"><span class="sw" style="background:'+x.c+'"></span>'+esc(x.l)+' <span class="d">'+esc(x.d)+'</span><b>'+x.n+'</b></div>').join('')+'</div>';
 const bs=[{l:'Leaders',d:'top 5 on their shelf',n:B.leaders,c:'var(--b1)'},{l:'Contenders',d:'rank 6–20',n:B.contenders,c:'var(--b2)'},{l:'Long tail',d:'rank 21+',n:B.tail,c:'var(--b3)'}];
 const ss=[{l:'Top 10, free',d:'',n:S.top10,c:'var(--good-s)'},{l:'Found lower, free',d:'rank 11+',n:S.found,c:'#86efac'},{l:'Only as an ad',d:'',n:S.ads_only,c:'var(--warn-s)'},{l:'Not found',d:'not on page 1',n:S.not_found,c:'#fdba74'}];
 const vol='<div class="card"><h2 class="sh">Top 5 by sales volume</h2><p class="sn">Best Grocery & Gourmet Foods rank = sells the most overall</p>'+
  G.top5_volume.map((x,i)=>'<div class="vol"><span class="ix">'+(i+1)+'</span><div class="nm"><b>'+esc(x.name)+'</b><span>Shelf #'+x.shelf+' · '+esc(x.sub)+'</span></div><span class="rk">#'+nf(x.main)+'</span>'+chg(x.d)+'</div>').join('')+'</div>';
 h+='<div class="three">'+vol+'<div class="card"><h2 class="sh">Where our '+G.n_products+' products rank on their shelf</h2><p class="sn">Rank against direct rivals on each product\'s own shelf</p>'+bar(bs)+leg(bs)+'</div>'+
    '<div class="card"><h2 class="sh">How shoppers find us in search</h2><p class="sn">'+G.n_keywords+' searches, page 1 of Amazon, latest scan</p>'+bar(ss)+leg(ss)+'</div></div>';
 if(G.loc_note)h+='<div class="note">'+esc(G.loc_note)+'</div>';
 $('p-sum').innerHTML=h;}
/* ---------- Products ---------- */
let pMode='shelf';
function setMode(m){pMode=m;rPrd();}
/* ---------- Stock (added 06.11.2026) ----------
   From the daily product-page check of every colour (the same check as exchange offers; latest reading of the day).
   A product is out of stock when no colour is in stock and at least one says "Currently unavailable".

const dkey=d=>{const p=d.split('.');return +p[2]*10000+ +p[1]*100+ +p[0];};

 if(G.loc_note)h+='<div class="note" style="margin-bottom:10px">'+esc(G.loc_note)+'</div>';
 if(G.ad_light_note)h+='<div class="note" style="margin-bottom:10px">'+esc(G.ad_light_note)+'</div>';
 h+='<div class="tscroll"><table class="hm"><thead><tr><th class="l">Search term</th>'+W.labels.map((l,i)=>'<th'+(W.footprint[i].ad_light?' class="al"':'')+' title="'+esc(W.footprint[i].loc)+(W.footprint[i].ad_light?' · few ads that day':'')+'">'+esc(l)+'</th>').join('')+'<th>Today</th></tr></thead><tbody>';
 W.groups.forEach(g=>{const ks=W.keywords.filter(k=>k.group===g);if(!ks.length)return;
  h+='<tr class="gh"><td class="l">'+esc(g)+'</td><td colspan="'+(W.labels.length+1)+'"></td></tr>';
  ks.forEach(k=>{h+='<tr><td class="l"><span class="kwn">'+esc(k.kw)+(k.new?'<span class="tag-new">NEW</span>':'')+'</span>'+watchOf(k.watch)+'</td>'+k.organic.map((o,i)=>'<td>'+cellOf(o,k.paid[i],k.tracked?k.tracked[i]:true,W.footprint[i].ad_light)+'</td>').join('')+'<td>'+stOf(k)+'</td></tr>';});});
 $('p-src').innerHTML=h+'</tbody></table></div></div>';
 const sc=document.querySelector('#p-src .tscroll');if(sc)requestAnimationFrame(()=>{sc.scrollLeft=sc.scrollWidth;});}
/* ---------- Data ---------- */
function secHead(title,note,tid){return '<div class="sechd"><div><h2 class="sh">'+esc(title)+'</h2>'+(note?'<p class="sn">'+esc(note)+'</p>':'')+'</div>'+(tid?'<button type="button" class="copy" onclick="copyTable(\''+tid+'\',this)">Copy table</button>':'')+'</div>';}
function rDat(){
 const B=D.bsr,W=D.kw,L=D.scanlog;
 let h='<div class="card"><h2 class="sh">How to read this</h2><dl class="how">'+D.how.map(x=>'<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>').join('')+'</dl></div>';
 const pd=x=>{const a=x.split('.');return new Date(+a[2],+a[1]-1,+a[0]);};
 const last=L.length?Math.max.apply(null,L.map(r=>+pd(r.date))):0,cut=last-6*864e5;
 const rec=L.filter(r=>+pd(r.date)>=cut),old=L.filter(r=>+pd(r.date)<cut);
 const sk=rec.filter(r=>r.skipped).length,hand=rec.filter(r=>/by hand/.test(r.how)).length;
 const lrow=r=>'<tr'+(r.skipped?' class="skip"':'')+'><td class="l">'+esc(r.date)+'</td><td>'+esc(r.time)+'</td><td class="l">'+esc(r.type)+'</td><td>'+(r.rows==null?'—':r.rows)+'</td><td class="l">'+esc(r.how)+'</td></tr>';
 const lhead='<thead><tr><th class="l">Date</th><th>Time (IST)</th><th class="l">Scan</th><th>Rows</th><th class="l">Status</th></tr></thead>';
 h+='<div class="card">'+secHead('Scan log','Last 7 days, newest first. Skipped runs read no pages.','tLog,tLogOld')+
  '<div class="health"><span class="chip '+(sk?'c-dn':'c-up')+'">'+(sk?'! ':'✓ ')+'Last 7 days: '+(rec.length-sk)+' of '+rec.length+' scans done</span><span class="chip c-eq">'+sk+' skipped</span><span class="chip c-eq">'+hand+' run by hand</span></div>'+
  '<div class="tscroll"><table id="tLog">'+lhead+'<tbody>'+rec.map(lrow).join('')+'</tbody></table></div>'+
  (old.length?'<details class="more" style="margin-top:10px"><summary>Older scans ('+old.length+')</summary><div class="tscroll"><table id="tLogOld">'+lhead+'<tbody>'+old.map(lrow).join('')+'</tbody></table></div></details>':'')+'</div>';
 h+='<details class="more"><summary>Shelf rank table</summary>'+secHead('Shelf rank by day','','tBsr')+'<div class="tscroll"><table id="tBsr"><thead><tr><th class="l">Product</th><th class="l">Shelf</th>'+B.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'<th>Change</th></tr></thead><tbody>'+
  B.products.map(p=>'<tr><td class="l">'+esc(p.name)+'</td><td class="l">'+esc(p.sub)+'</td>'+p.ranks.map(v=>'<td>'+(v==null?'—':v)+'</td>').join('')+'<td>'+(p.d_prev==null?'—':(p.d_prev>0?'+':'')+p.d_prev)+'</td></tr>').join('')+'</tbody></table></div></details>';
 h+='<details class="more"><summary>Grocery &amp; Gourmet Foods rank table</summary>'+secHead('Grocery & Gourmet Foods rank by day',B.ext_note||'','tDept')+'<div class="tscroll"><table id="tDept"><thead><tr><th class="l">Product</th>'+B.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'<th>Change</th></tr></thead><tbody>'+
  B.products.slice().sort((a,b)=>a.main_latest-b.main_latest).map(p=>'<tr><td class="l">'+esc(p.name)+'</td>'+p.main_ranks.map((v,i)=>'<td>'+(v==null?'—':nf(v)+(p.main_src&&p.main_src[i]?'*':''))+'</td>').join('')+'<td>'+(p.d_prev_main==null?'—':(p.d_prev_main>0?'+':'')+nf(p.d_prev_main))+'</td></tr>').join('')+'</tbody></table></div></details>';
 if(D.offers){const O=D.offers,cv=v=>v==null?'':(v.s!=='IN STOCK'?(v.s==='UNAVAILABLE'?'OOS':(v.s==='REDIRECTED'?'Other listing':'?')):(v.x?'₹'+nf(v.amt||0):'—'));
  h+='<details class="more"><summary>Exchange offers by colour</summary>'+secHead('Exchange offer by day','₹ = “up to” amount shown. — = no exchange offer. OOS = out of stock. Orange = offer dropped that day.','tOff')+'<div class="tscroll"><table id="tOff"><thead><tr><th class="l">Product</th><th class="l">Model / colour</th>'+O.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'</tr></thead><tbody>'+
  O.groups.map(g=>g.colours.map(c=>'<tr><td class="l">'+esc(g.name)+'</td><td class="l">'+esc(c.model)+'</td>'+c.seq.map((v,i)=>{let p=null;for(let j=i-1;j>=0;j--)if(c.seq[j]){p=c.seq[j];break;}return '<td'+(v&&p&&p.x&&!v.x?' class="xdrop"':'')+'>'+cv(v)+'</td>';}).join('')+'</tr>').join('')).join('')+'</tbody></table></div></details>';}
 h+='<details class="more"><summary>Full search rank table</summary>'+secHead('Search rank by day','Number = rank without ads. "Ad" = only a paid slot. "—" = not on page 1.','tKw')+'<div class="tscroll"><table id="tKw"><thead><tr><th class="l">Search term</th><th class="l">Group</th>'+W.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'</tr></thead><tbody>'+
  W.keywords.map(k=>'<tr><td class="l">'+esc(k.kw)+'</td><td class="l">'+esc(k.group)+'</td>'+k.organic.map((o,i)=>'<td>'+((k.tracked&&!k.tracked[i])?'':(o!=null?o:(k.paid[i]!=null?'Ad':'—')))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details>';
 $('p-dat').innerHTML=h;}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',nsAuto);else nsAuto();
</script>

</body></html>
