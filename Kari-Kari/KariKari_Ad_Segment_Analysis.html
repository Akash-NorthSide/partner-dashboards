<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kari-Kari · Ad Segment Analysis · Apr · May · Jun 2026</title>
<style>
:root{
--teal:#1CBFBB; --teal-d:#0E8E8B; --teal-l:#52BFBC; --teal-t:#E6FBFA;
--black:#020202; --ink:#1A1A1A; --grey:#7D7D7D; --grey-l:#F2F2F2; --grey-m:#9CA3AF; --grey-vl:#FAFBFC; --grey-warm:#E6E4E4;
--green:#22C55E; --green-l:#D1FAE5; --amber:#F59E0B; --amber-l:#FEF3C7; --red:#EF4444; --red-l:#FEE2E2;
--card:#FFFFFF; --bg:#F8FAFB;
--shadow-sm:0 1px 2px rgba(0,0,0,.04); --shadow-md:0 4px 12px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.04); --shadow-lg:0 12px 32px rgba(0,0,0,.08);
--proj-fill:#FFF7E5; --proj-border:#FCD34D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:'Inter','Metropolis',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;font-feature-settings:'cv02','cv03','cv04','cv11'}

.hero{background:linear-gradient(135deg,#000 0%,#0F0F0F 50%,#1A1A1A 100%);color:#fff;padding:32px 40px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-10%;width:60%;height:200%;background:radial-gradient(circle,rgba(28,191,187,.15) 0%,transparent 60%);pointer-events:none}
.hero-inner{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;flex-wrap:wrap;gap:20px}
.hero-text h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin-bottom:5px;font-family:Arial,sans-serif}
.hero-text .sub{font-size:.92rem;color:#9CA3AF}
.hero-brand{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
/* CRITICAL: no filter, full opacity, set explicit height for crispness */
.hero-brand img{height:48px;width:auto;display:block}
.hero-brand .conf{font-size:.7rem;color:#6B7280;letter-spacing:.2em;text-transform:uppercase}

.tab-wrap{background:#fff;border-bottom:1px solid var(--grey-l);padding:0 40px;position:sticky;top:0;z-index:10;box-shadow:var(--shadow-sm)}
.tabs{display:flex;gap:4px;max-width:1700px;margin:0 auto}
.tabs button{flex:1;padding:16px 12px;background:transparent;border:none;font-family:inherit;font-size:.92rem;font-weight:600;color:var(--grey);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tabs button:hover{color:var(--teal-d);background:var(--teal-t)}
.tabs button.active{color:var(--ink);border-bottom-color:var(--teal)}

.main{max-width:1700px;margin:0 auto;padding:28px 40px 60px}

.insight{background:linear-gradient(135deg,var(--teal-t) 0%,#fff 100%);border:1px solid var(--teal);border-radius:14px;padding:20px 26px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.insight::before{content:'🚀';font-size:2.2rem;position:absolute;right:24px;top:50%;transform:translateY(-50%);opacity:.18}
.insight-label{font-size:.7rem;font-weight:800;color:var(--teal-d);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.insight-text{font-size:1.05rem;color:var(--ink);font-weight:500;line-height:1.55}
.insight-text b{color:var(--teal-d);font-weight:800}
.insight-text .win{color:var(--green);font-weight:800}

.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;border:1px solid var(--grey-l);transition:transform .2s,box-shadow .2s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi-card::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--teal)}
.kpi-card.kpi-hero::before{background:linear-gradient(180deg,var(--green) 0%,var(--teal) 100%);width:5px}
.kpi-label{font-size:.7rem;font-weight:700;color:var(--grey);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.kpi-trajectory{display:flex;align-items:baseline;gap:7px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.kpi-trajectory .v{font-size:1.05rem;font-weight:700;color:var(--ink)}
.kpi-trajectory .v.current{font-size:1.6rem;font-weight:800;color:var(--teal-d)}
.kpi-trajectory .arr{font-size:.85rem;color:var(--grey-m);font-weight:600}
.kpi-value{font-size:1.85rem;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:.74rem;color:var(--grey);margin-top:6px;font-weight:500;line-height:1.4}
.kpi-delta{display:inline-flex;gap:3px;padding:2px 7px;border-radius:6px;font-size:.74rem;font-weight:700;margin-top:5px}
.kpi-delta.up{background:var(--green-l);color:var(--green)}
.kpi-delta.down{background:var(--red-l);color:var(--red)}
.kpi-delta.flat{background:var(--grey-l);color:var(--grey)}

.cons-card{background:var(--card);border-radius:14px;padding:22px 26px;margin-bottom:24px;box-shadow:var(--shadow-md);border:1px solid var(--grey-l)}
.cons-card h2{font-size:1.05rem;font-weight:800;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.cons-card h2 .icon{width:28px;height:28px;background:var(--teal);color:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.cons-table{width:100%;border-collapse:collapse;font-size:.9rem}
.cons-table th{background:var(--black);color:var(--teal);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 11px;text-align:right}
.cons-table th:first-child{text-align:left;padding-left:14px}
.cons-table th.proj{background:#3D2F0A;color:var(--proj-border)}
.cons-table td{padding:9px 11px;border-bottom:1px solid var(--grey-l);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cons-table td:first-child{text-align:left;padding-left:14px;font-weight:500}
.cons-table td.proj{background:var(--proj-fill);font-style:italic}
.cons-table tr:hover td{background:var(--grey-vl)}
.cons-table tr:hover td.proj{background:#FFF1D6}
.cons-table tr:last-child td{border-bottom:none}

.methodology{background:#FFFCF2;border-left:4px solid var(--proj-border);border-radius:8px;padding:14px 18px;margin-bottom:22px;font-size:.86rem;color:#5D4D2A;line-height:1.6}
.methodology b{color:#92400E}

.seg-section{margin-top:8px}
.seg-section-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.seg-section-header h2{font-size:1.05rem;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.seg-section-header h2 .icon{width:28px;height:28px;background:var(--teal);color:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.seg-section-header .note{font-size:.78rem;color:var(--grey);font-weight:500}

.seg-row{display:grid;grid-template-columns:240px 1fr 240px;gap:0;background:var(--card);border-radius:12px;box-shadow:var(--shadow-sm);border:1px solid var(--grey-l);margin-bottom:12px;overflow:hidden;transition:box-shadow .2s,transform .2s}
.seg-row:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.seg-row.s-hero{border-left:6px solid var(--green)}
.seg-row.s-scale{border-left:6px solid var(--teal)}
.seg-row.s-opt{border-left:6px solid var(--amber)}
.seg-row.s-pause{border-left:6px solid var(--red)}

.seg-identity{padding:18px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--grey-l);background:linear-gradient(135deg,var(--grey-vl) 0%,#fff 100%)}
.seg-rank-row{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.seg-rank{font-size:.72rem;font-weight:800;color:var(--grey);background:var(--grey-l);padding:2px 7px;border-radius:5px}
.seg-tag{padding:3px 9px;border-radius:20px;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.seg-tag.t-hero{background:var(--green-l);color:var(--green)}
.seg-tag.t-scale{background:var(--teal-t);color:var(--teal-d)}
.seg-tag.t-opt{background:var(--amber-l);color:#92400E}
.seg-tag.t-pause{background:var(--red-l);color:var(--red)}
.seg-name{font-size:1.05rem;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.2}
.seg-roas-block{margin-top:4px}
.seg-roas-block .big{font-size:2.15rem;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;display:block}
.seg-roas-block .big.r-hero{color:var(--green)}
.seg-roas-block .big.r-scale{color:var(--teal-d)}
.seg-roas-block .big.r-opt{color:var(--amber)}
.seg-roas-block .big.r-pause{color:var(--red)}
.seg-roas-block .label-row{display:flex;align-items:center;gap:6px;margin-top:3px}
.seg-roas-block .label{font-size:.62rem;color:var(--grey);font-weight:700;letter-spacing:.06em;text-transform:uppercase}

.seg-metrics{padding:14px 18px;border-right:1px solid var(--grey-l);display:flex;align-items:center;justify-content:center}
.seg-mtab{width:100%;border-collapse:collapse;font-size:.82rem}
.seg-mtab th{font-size:.62rem;font-weight:700;color:var(--grey);letter-spacing:.07em;text-transform:uppercase;padding:5px 6px;text-align:right;border-bottom:2px solid var(--grey-l)}
.seg-mtab th:first-child{text-align:left;padding-left:0;color:var(--ink)}
.seg-mtab th.proj{color:#92400E;background:var(--proj-fill);border-radius:4px 4px 0 0}
.seg-mtab td{padding:6px 6px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;border-bottom:1px dashed var(--grey-l)}
.seg-mtab td:first-child{text-align:left;font-size:.7rem;color:var(--grey);font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding-left:0}
.seg-mtab td.proj{background:var(--proj-fill);font-style:italic;color:#92400E}
.seg-mtab tr:last-child td{border-bottom:none}
.seg-mtab .roas-cell{font-weight:800}
.seg-mtab .roas-cell.r-hero{color:var(--green)}
.seg-mtab .roas-cell.r-scale{color:var(--teal-d)}
.seg-mtab .roas-cell.r-opt{color:var(--amber)}
.seg-mtab .roas-cell.r-pause{color:var(--red)}

.seg-story{padding:14px 16px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,var(--grey-vl) 0%,#fff 100%)}
.seg-story .stitle{font-size:.6rem;color:var(--teal-d);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.seg-story .stxt{font-size:.82rem;color:var(--ink);font-weight:500;line-height:1.5}
.seg-story .stxt b{color:var(--ink);font-weight:800}

.seg-row.total-row{background:linear-gradient(135deg,#000 0%,#1A1A1A 100%);color:#fff;border:none}
.seg-row.total-row .seg-identity,.seg-row.total-row .seg-story{background:transparent;border-color:rgba(255,255,255,.1)}
.seg-row.total-row .seg-name{color:#fff}
.seg-row.total-row .seg-rank{background:rgba(255,255,255,.12);color:#9CA3AF}
.seg-row.total-row .seg-roas-block .big{color:var(--teal)}
.seg-row.total-row .seg-mtab th{color:#9CA3AF}
.seg-row.total-row .seg-mtab th:first-child{color:#fff}
.seg-row.total-row .seg-mtab td{color:#fff}
.seg-row.total-row .seg-mtab td:first-child{color:#9CA3AF}
.seg-row.total-row .seg-mtab th.proj,.seg-row.total-row .seg-mtab td.proj{background:rgba(252,211,77,.08);color:var(--proj-border)}
.seg-row.total-row .seg-story .stxt,.seg-row.total-row .seg-story .stitle{color:#9CA3AF}
.seg-row.total-row .seg-story .stxt b,.seg-row.total-row .seg-story .stxt .win{color:#fff}
.seg-row.total-row .seg-story .stxt .win{color:var(--green)}

.footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--grey-l);font-size:.8rem;color:var(--grey);line-height:1.7}
.footer h4{font-size:.74rem;color:var(--teal-d);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.footer ul{padding-left:18px}
.footer li{margin-bottom:3px}
.footer b{color:var(--ink)}
.footer-ns{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--grey-l)}
.footer-ns img{height:28px;display:block}
.footer-ns .tagline{font-size:.78rem;color:var(--grey-m);font-style:italic}

.lock{max-width:420px;margin:140px auto;padding:36px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);text-align:center}
.lock-logo{margin-bottom:18px}
.lock-logo img{height:36px;display:inline-block}
.lock h2{margin-bottom:8px;color:var(--ink);font-weight:800;font-size:1.25rem}
.lock .lp{color:var(--grey);margin-bottom:24px;font-size:.9rem}
.lock input{width:100%;padding:14px 16px;border:2px solid var(--grey-l);border-radius:10px;font-size:1rem;margin-bottom:14px;font-family:inherit;transition:border-color .15s}
.lock input:focus{border-color:var(--teal);outline:none}
.lock button{width:100%;padding:14px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.lock button:hover{background:var(--teal-d)}
.err{color:var(--red);margin-top:12px;font-size:.85rem;font-weight:600}

@media (max-width:1200px){.seg-row{grid-template-columns:220px 1fr 200px}.kpi-strip{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.seg-row{grid-template-columns:1fr}.seg-identity,.seg-metrics,.seg-story{border-right:none;border-bottom:1px solid var(--grey-l)}.seg-story{border-bottom:none}.main,.tab-wrap,.hero{padding-left:20px;padding-right:20px}}
</style>
</head>

let D=null,currentTab='Portfolio';

function b64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}
async function deriveKey(pwd){const enc=new TextEncoder();const mat=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(ENC_SALT),iterations:100000,hash:'SHA-256'},mat,{name:'AES-GCM',length:256},false,['decrypt'])}
async function unlock(){
  const pwd=document.getElementById('pwd').value;
  try{const k=await deriveKey(pwd);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},k,b64ToBytes(ENC_DATA));D=JSON.parse(new TextDecoder().decode(pt));document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';buildTabs();renderTab('Portfolio')}
  catch(e){document.getElementById('err').textContent='Incorrect password — try NS@2026'}
}
document.getElementById('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});

function buildTabs(){
  const tabs=['Portfolio',...D.meta.platforms];
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${t===currentTab?'active':''}" onclick="renderTab('${t}')">${t==='Portfolio'?'📊':D.meta.platform_emoji[t]} ${t}</button>`).join('');
}
function fmtINR(v){if(v===null||v===undefined||isNaN(v))return '—';const n=Math.round(v);if(Math.abs(n)>=10000000)return '₹'+(n/10000000).toFixed(2)+'Cr';if(Math.abs(n)>=100000)return '₹'+(n/100000).toFixed(2)+'L';if(Math.abs(n)>=1000)return '₹'+(n/1000).toFixed(1)+'K';return '₹'+n.toLocaleString('en-IN')}
function fmtRoas(v){return v.toFixed(2)+'x'}
function fmtPct(v){return v.toFixed(1)+'%'}
function classifySeg(roas){if(roas>=5)return {tier:'hero',label:'HERO'};if(roas>=1.5)return {tier:'scale',label:'SCALE'};if(roas>=0.5)return {tier:'opt',label:'OPTIMIZE'};return {tier:'pause',label:'REVIEW'}}

function generatePositiveStory(d){
  const apr_broas=d.Apr.plat_spend>0?d.Apr.plat_rev/d.Apr.plat_spend:0;
  const may_broas=d.May.plat_spend>0?d.May.plat_rev/d.May.plat_spend:0;
  const jun_broas=d.Jun14.plat_spend>0?d.Jun14.plat_rev/d.Jun14.plat_spend:0;
  const top=d.May.segments.filter(s=>s.spend>0).sort((a,b)=>b.roas-a.roas)[0];
  const trajectory_up = jun_broas > may_broas && may_broas > apr_broas;
  let story = '';
  if (trajectory_up){
    story = `<span class="win">Continued momentum.</span> Ad-ROAS climbing every period — <b>${fmtRoas(apr_broas)} → ${fmtRoas(may_broas)} → ${fmtRoas(jun_broas)}</b>. `;
  } else {
    story = `<b>Sustained efficiency.</b> ROAS trajectory <b>${fmtRoas(apr_broas)} → ${fmtRoas(may_broas)} → ${fmtRoas(jun_broas)}</b>. `;
  }
  if (top){story += `<span class="win">${top.seg}</span> remains the efficiency hero at <b>${fmtRoas(top.roas)}</b>. `;}
  story += `Paid layer share of GMV strengthening — Organic share moderated from <b>${fmtPct(d.Apr.plat_organic_pct)} → ${fmtPct(d.Jun14.plat_organic_pct)}</b>, meaning ads are doing more of the heavy lifting.`;
  return story;
}

function autoInsight(seg, apr, may, jun14, junProj){
  const trajectory = jun14.roas > may.roas ? 'climbing' : (jun14.roas < may.roas ? 'consolidating' : 'holding');
  if (may.roas >= 5){return `<span class="win">Hero efficiency line.</span> ROAS sustained at <b>${fmtRoas(may.roas)}</b> in May; ${trajectory} to <b>${fmtRoas(jun14.roas)}</b> in Jun 1-14. <b>Continue scaling</b> with discipline on CPC.`}
  if (may.roas >= 1.5){return `<b>Working at scale.</b> Steady performer · May <b>${fmtRoas(may.roas)}</b> · Jun ${trajectory} at <b>${fmtRoas(jun14.roas)}</b>. Maintain pacing — solid contributor.`}
  if (may.roas >= 0.5){return `<b>Discovery tier · maturing.</b> ROAS <b>${fmtRoas(may.roas)} → ${fmtRoas(jun14.roas)}</b>. ${trajectory==='climbing'?'On the right track — keep refining keyword set.':'Tighten match types to lift efficiency next cycle.'}`}
  return `<b>Under refinement.</b> Sub-economic at <b>${fmtRoas(may.roas)}</b>; Jun 1-14 ${trajectory} to <b>${fmtRoas(jun14.roas)}</b>. ${trajectory==='climbing'?'Showing early signal — keep monitoring.':'Review vocab + add negatives next refresh.'}`
}

        <tr><td>% Spend Share</td><td>${apr.plat_spend>0?fmtPct(a.spend/apr.plat_spend*100):'—'}</td><td>${may.plat_spend>0?fmtPct(m.spend/may.plat_spend*100):'—'}</td><td>${jun14.plat_spend>0?fmtPct(j.spend/jun14.plat_spend*100):'—'}</td><td class="proj">${jproj.plat_spend>0?fmtPct(jp.spend/jproj.plat_spend*100):'—'}</td></tr>
      </tbody></table></div>
      <div class="seg-story"><div class="stitle">Trend Read</div><div class="stxt">${autoInsight(m.seg, a, m, j, jp)}</div></div>
    </div>`;
  });
  html+=`<div class="seg-row total-row"><div class="seg-identity"><div class="seg-rank-row"><span class="seg-rank">Σ</span><span class="seg-tag" style="background:rgba(28,191,187,.2);color:var(--teal)">TOTAL</span></div><div class="seg-name">${tab==='Portfolio'?'Portfolio':tab} Total</div>

      <tr><td>Ad-Spend</td><td>${fmtINR(apr.plat_spend)}</td><td>${fmtINR(may.plat_spend)}</td><td>${fmtINR(jun14.plat_spend)}</td><td class="proj">${fmtINR(jproj.plat_spend)}</td></tr>
      <tr><td>Ad-Revenue</td><td>${fmtINR(apr.plat_rev)}</td><td>${fmtINR(may.plat_rev)}</td><td>${fmtINR(jun14.plat_rev)}</td><td class="proj">${fmtINR(jproj.plat_rev)}</td></tr>
      <tr><td>Blended ROAS</td><td>${fmtRoas(apr_broas)}</td><td>${fmtRoas(may_broas)}</td><td>${fmtRoas(jun_broas)}</td><td class="proj">${fmtRoas(proj_broas)}</td></tr>
      <tr><td>Organic %</td><td>${fmtPct(apr.plat_organic_pct)}</td><td>${fmtPct(may.plat_organic_pct)}</td><td>${fmtPct(jun14.plat_organic_pct)}</td><td class="proj">${fmtPct(jproj.plat_organic_pct)}</td></tr>
    </tbody></table></div>
    <div class="seg-story"><div class="stitle">Portfolio Trajectory</div><div class="stxt">${generatePositiveStory(d)}</div></div>
  </div></div>`;
  html+=`<div class="footer"><h4>Methodology · 3-Period Trend</h4><ul>
    <li><b>Apr · May</b> = full-month actuals from Performance Tracking v5 dashboard (intent-based keyword classification)</li>
    <li><b>Jun 1-14</b> = mid-month bimonthly actuals from KK-15 raw source extraction</li>
    <li><b>Jun Projected (cream column)</b> = Weekend-weighted projection (×${(31.92/14.96).toFixed(4)} for Sales/Ad-Rev, ×${(31/14).toFixed(4)} linear for Ad-Spend)</li>
    <li><b>Keyword-level segmentation</b> applied retroactively across all periods · same intent vocabulary</li>
    <li><b>Action tags</b>: <span style="color:var(--green);font-weight:800">HERO (≥5x)</span> · <span style="color:var(--teal-d);font-weight:800">SCALE (1.5-5x)</span> · <span style="color:var(--amber);font-weight:800">OPTIMIZE (0.5-1.5x)</span> · <span style="color:var(--red);font-weight:800">REVIEW (&lt;0.5x)</span></li>
  </ul><div class="footer-ns"><img src="${LOGO_BLACK}" alt="NorthSide"><div class="tagline">We Incubate Ventures and Scale Brands in India · Confidential</div></div></div>`;
