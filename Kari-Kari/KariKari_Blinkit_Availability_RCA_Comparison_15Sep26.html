<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kari-Kari · Blinkit · Availability & RCA Comparison</title>
<style>
:root{
--teal:#1CBFBB; --teal-d:#0E8E8B; --teal-l:#52BFBC; --teal-t:#E6FBFA;
--black:#020202; --ink:#1A1A1A; --grey:#7D7D7D; --grey-l:#F2F2F2; --grey-m:#9CA3AF; --grey-vl:#FAFBFC;
--green:#22C55E; --green-l:#D1FAE5; --amber:#F59E0B; --amber-l:#FEF3C7; --red:#EF4444; --red-l:#FEE2E2;
--card:#FFFFFF; --bg:#F8FAFB;
--shadow-sm:0 1px 2px rgba(0,0,0,.04); --shadow-md:0 4px 12px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.04); --shadow-lg:0 12px 32px rgba(0,0,0,.08);
--mtd-fill:#FFF7E5; --mtd-border:#FCD34D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:'Inter','Metropolis',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}

.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#000 0%,#0F0F0F 50%,#1A1A1A 100%)}
.lock-card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);text-align:center}
.lock-card img{height:36px;margin-bottom:18px}
.lock-card h1{font-size:1.1rem;font-weight:800;margin-bottom:6px}
.lock-card p{font-size:.85rem;color:var(--grey);margin-bottom:22px}
.lock-card input{width:100%;padding:12px 14px;border:1.5px solid var(--grey-l);border-radius:9px;font-size:.95rem;margin-bottom:12px;font-family:inherit}
.lock-card input:focus{outline:none;border-color:var(--teal)}
.lock-card button{width:100%;padding:12px;background:var(--black);color:#fff;border:none;border-radius:9px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit}
.lock-card button:hover{background:var(--teal-d)}
.lock-err{color:var(--red);font-size:.78rem;margin-top:10px;min-height:14px}

.hero{background:linear-gradient(135deg,#000 0%,#0F0F0F 50%,#1A1A1A 100%);color:#fff;padding:28px 40px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-10%;width:60%;height:200%;background:radial-gradient(circle,rgba(28,191,187,.15) 0%,transparent 60%);pointer-events:none}
.hero-inner{max-width:1700px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;flex-wrap:wrap;gap:20px}
.hero-text h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.hero-text .sub{font-size:.88rem;color:#9CA3AF}
.hero-text .updated{font-size:.72rem;color:var(--teal-l);margin-top:6px;font-weight:600;letter-spacing:.02em}
.hero-brand{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hero-brand img{height:40px;width:auto;display:block}
.hero-brand .conf{font-size:.65rem;color:#6B7280;letter-spacing:.18em;text-transform:uppercase}

.filter-bar{background:#fff;border-bottom:1px solid var(--grey-l);padding:12px 40px;position:sticky;top:0;z-index:10;box-shadow:var(--shadow-sm)}
.filter-inner{max-width:1700px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.filter-label{font-size:.68rem;font-weight:800;color:var(--grey);letter-spacing:.12em;text-transform:uppercase}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:7px 14px;border-radius:20px;border:1.5px solid var(--grey-l);background:#fff;font-size:.78rem;font-weight:700;color:var(--grey-m);cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit}
.pill:hover{border-color:var(--teal-l)}
.pill.active{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.active.is-mtd{background:#92400E;border-color:#92400E}
.filter-hint{font-size:.7rem;color:var(--grey-m);margin-top:6px;width:100%;text-align:right}
.tabbar{display:flex;gap:6px;background:var(--grey-l);border-radius:10px;padding:4px}
.tabbtn{padding:7px 16px;border:none;background:transparent;border-radius:7px;font-size:.8rem;font-weight:700;color:var(--grey);cursor:pointer;font-family:inherit}
.tabbtn.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}

.main{max-width:1700px;margin:0 auto;padding:28px 40px 60px}

.insight{background:linear-gradient(135deg,var(--teal-t) 0%,#fff 100%);border:1px solid var(--teal);border-radius:14px;padding:20px 26px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.insight::before{content:'📡';font-size:2.2rem;position:absolute;right:24px;top:50%;transform:translateY(-50%);opacity:.18}
.insight-label{font-size:.7rem;font-weight:800;color:var(--teal-d);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.insight-text{font-size:1.05rem;color:var(--ink);font-weight:500;line-height:1.55}
.insight-text b{color:var(--teal-d);font-weight:800}
.insight-text .win{color:var(--green);font-weight:800}
.insight-text .warn{color:var(--red);font-weight:800}

.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;border:1px solid var(--grey-l);transition:transform .2s,box-shadow .2s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi-card::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--teal)}
.kpi-label{font-size:.7rem;font-weight:700;color:var(--grey);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.kpi-trajectory{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.kpi-trajectory .v{font-size:.98rem;font-weight:700;color:var(--ink)}
.kpi-trajectory .v.current{font-size:1.5rem;font-weight:800;color:var(--teal-d)}
.kpi-trajectory .arr{font-size:.8rem;color:var(--grey-m);font-weight:600}
.kpi-value{font-size:1.85rem;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:.74rem;color:var(--grey);margin-top:6px;font-weight:500;line-height:1.4}
.kpi-delta{display:inline-flex;gap:3px;padding:2px 7px;border-radius:6px;font-size:.74rem;font-weight:700;margin-top:5px}
.kpi-delta.up{background:var(--green-l);color:var(--green)}
.kpi-delta.down{background:var(--red-l);color:var(--red)}

.cons-card{background:var(--card);border-radius:14px;padding:22px 26px;margin-bottom:24px;box-shadow:var(--shadow-md);border:1px solid var(--grey-l)}
.cons-card h2{font-size:1.05rem;font-weight:800;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.cons-card h2 .icon{width:28px;height:28px;background:var(--teal);color:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.cons-note{font-size:.8rem;color:var(--grey);margin-bottom:14px}
.cons-table{width:100%;border-collapse:collapse;font-size:.85rem}
.cons-table th{background:var(--black);color:var(--teal);font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:9px 9px;text-align:right}
.cons-table th:first-child{text-align:left;padding-left:14px}
.cons-table th.mtd{background:#3D2F0A;color:var(--mtd-border)}
.cons-table td{padding:8px 9px;border-bottom:1px solid var(--grey-l);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cons-table td:first-child{text-align:left;padding-left:14px;font-weight:500}
.cons-table td.mtd{background:var(--mtd-fill);font-style:italic}
.cons-table td.na{color:var(--grey-m);font-style:italic;font-weight:400}
.cons-table tr:hover td{background:var(--grey-vl)}
.cons-table tr:hover td.mtd{background:#FFF1D6}
.cons-table tr:last-child td{border-bottom:none}
.cell-good{color:var(--green)!important}
.cell-warn{color:var(--amber)!important}
.cell-bad{color:var(--red)!important}

.chart-wrap{width:100%;overflow-x:auto}
.chart-legend{display:flex;gap:18px;margin-bottom:10px;flex-wrap:wrap}
.chart-legend span{display:flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;color:var(--grey)}
.chart-legend .sw{width:14px;height:3px;border-radius:2px;display:inline-block}

.methodology{background:#FFFCF2;border-left:4px solid var(--mtd-border);border-radius:8px;padding:14px 18px;margin-bottom:22px;font-size:.86rem;color:#5D4D2A;line-height:1.6}
.methodology b{color:#92400E}

.footer{margin-top:36px;padding-top:22px;border-top:1px solid var(--grey-l)}
.footer h4{font-size:.8rem;font-weight:800;color:var(--ink);margin-bottom:10px}
.footer ul{list-style:none;font-size:.78rem;color:var(--grey);line-height:1.9}
.footer-ns{display:flex;align-items:center;gap:14px;margin-top:20px;padding-top:16px;border-top:1px dashed var(--grey-l)}
.footer-ns img{height:22px;filter:grayscale(1) opacity(.7)}
.footer-ns .tagline{font-size:.7rem;color:var(--grey-m);letter-spacing:.02em}

@media(max-width:900px){
  .kpi-strip{grid-template-columns:1fr 1fr}
  .hero,.filter-bar,.main{padding-left:18px;padding-right:18px}
  .filter-inner{flex-direction:column;align-items:flex-start}
  .filter-pills{justify-content:flex-start}
}
</style></head>

<script>
function svgLineChart(series, opts){
  opts = opts || {};
  // series: [{name, color, points:[{x:dateStr, y:number}]}]
  const w = opts.w || 1200, h = opts.h || 260, padL=44, padR=16, padT=16, padB=28;
  const allX = series[0].points.map(p=>p.x);
  const allY = series.flatMap(s=>s.points.map(p=>p.y));
  const yMin = Math.min(...allY, 0), yMax = Math.max(...allY)*1.1;
  const n = allX.length;
  const xPos = i => padL + (i/(n-1))*(w-padL-padR);
  const yPos = v => (h-padB) - ((v-yMin)/(yMax-yMin||1))*(h-padT-padB);
  let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="none">`;
  // gridlines
  for(let g=0; g<=4; g++){
    const gy = padT + g*(h-padT-padB)/4;
    const val = yMax - g*(yMax-yMin)/4;
    svg += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#EEE" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${gy+3}" font-size="10" fill="#9CA3AF" text-anchor="end">${val.toFixed(0)}</text>`;
  }
  // x labels (sparse)
  const labelEvery = Math.ceil(n/8);
  allX.forEach((d,i)=>{
    if(i % labelEvery === 0 || i===n-1){
      svg += `<text x="${xPos(i)}" y="${h-8}" font-size="9" fill="#9CA3AF" text-anchor="middle">${d.slice(5)}</text>`;
    }
  });
  series.forEach(s=>{
    let path = s.points.map((p,i)=>`${i===0?'M':'L'}${xPos(i).toFixed(1)},${yPos(p.y).toFixed(1)}`).join(' ');
    svg += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  svg += `</svg>`;
  return svg;
}

function classify(v, good, ok){
  if(v>=good) return 'cell-good';
  if(v>=ok) return 'cell-warn';
  return 'cell-bad';
}

function renderAvailability(periods){

  const basePs = periods.filter(p=>p.type!=='mtd');

  } else {
  story = `<b>Listing %</b> (share of stores where the product is listed) has grown from <b>${fmtPct(o0.avg_listing)}</b> in ${first.label} to <b>${fmtPct(o1.avg_listing)}</b> in ${last.label} <span class="${dL>=0?'win':'warn'}">(${pp(dL)})</span>. `;

  const winSub = () => periods.map(p=> (lfOn && p.type!=='mtd' && sd[p.id]) ? sd[p.id].sub : p.sub.replace(', 2026','')).join(' \u00b7 ') + (lfOn ? ' \u2014 same days each month (fair)' : '');

  html += `<div class="kpi-strip">
    <div class="kpi-card"><div class="kpi-label">Avg. Listing % Trend</div><div class="kpi-trajectory">${chain('avg_listing',v=>fmtPct(v))}</div><div class="kpi-sub">${winSub()}</div></div>
    <div class="kpi-card"><div class="kpi-label">Avg. OSA % Trend</div><div class="kpi-trajectory">${chain('avg_osa',v=>fmtPct(v))}</div><div class="kpi-sub">On-shelf availability</div></div>
    <div class="kpi-card"><div class="kpi-label">Stores Tracked (${last.label})</div><div class="kpi-value">${o1.n_stores.toLocaleString('en-IN')}</div>${periods.length>1?`<span class="kpi-delta ${o1.n_stores>=o0.n_stores?'up':'down'}">${o1.n_stores>=o0.n_stores?'↑':'↓'} vs ${first.label} ${o0.n_stores.toLocaleString('en-IN')}</span>`:''}<div class="kpi-sub">${o1.n_cities} cities live</div></div>
    <div class="kpi-card"><div class="kpi-label">Avg. Weighted Discount (${last.label})</div><div class="kpi-value">${fmtPct(o1.avg_disc)}</div><div class="kpi-sub">Avg stock level: ${fmtNum(o1.avg_stock,2)} units/store</div></div>
  </div>`;

  // trend chart
  const daily = DATA.availability.daily_trend;
  const chartData = svgLineChart([
    {name:'Listing %', color:'#1CBFBB', points: daily.map(d=>({x:d.Date, y:d.listing}))},
    {name:'OSA %', color:'#F59E0B', points: daily.map(d=>({x:d.Date, y:d.osa}))},
  ]);
  html += `<div class="cons-card"><h2><span class="icon">📈</span>Daily Trend — Listing % vs OSA %</h2>
  <div class="cons-note">Jul 1 – Sep 14, 2026 · store-day average across all tracked Kari Kari SKUs</div>
  <div class="chart-legend"><span><i class="sw" style="background:#1CBFBB"></i>Listing %</span><span><i class="sw" style="background:#F59E0B"></i>OSA %</span></div>
  <div class="chart-wrap">${chartData}</div></div>`;

  // product table
  const prodTitles = DATA.availability.products[last.id].map(p=>p.Title);
  let th = periods.map(p=>`<th${p.type==='mtd'?' class="mtd"':''} colspan="2">${p.label}<div style="font-weight:500;font-size:.62rem;opacity:.75;letter-spacing:0">${p.sub}</div></th>`).join('');
  let subth = periods.map(()=>`<th style="text-align:right">Listing %</th><th style="text-align:right">OSA %</th>`).join('');
  html += `<div class="cons-card"><h2><span class="icon">🛍️</span>Product-Level Availability</h2>
  <div class="cons-note">All 6 tracked Kari Kari SKUs on Blinkit</div>
  <table class="cons-table"><thead><tr><th>Product</th>${th}</tr><tr><th></th>${subth}</tr></thead><tbody>`;
  prodTitles.forEach(title=>{
    let tds = periods.map(p=>{
      const item = DATA.availability.products[p.id].find(x=>x.Title===title);
      const mtdCls = p.type==='mtd' ? ' mtd' : '';
      if(!item) return `<td class="na${mtdCls}">—</td><td class="na${mtdCls}">—</td>`;
      return `<td class="${mtdCls} ${classify(item.listing,85,70)}">${fmtPct(item.listing)}</td><td class="${mtdCls} ${classify(item.osa,80,65)}">${fmtPct(item.osa)}</td>`;
    }).join('');
    const shortTitle = title.replace('Kari Kari ','');
    html += `<tr><td>${shortTitle}</td>${tds}</tr>`;
  });
  html += `</tbody></table></div>`;

  // city table
  let th2 = periods.map(p=>`<th${p.type==='mtd'?' class="mtd"':''} colspan="3">${p.label}<div style="font-weight:500;font-size:.62rem;opacity:.75;letter-spacing:0">${p.sub}</div></th>`).join('');
  let subth2 = periods.map(()=>`<th style="text-align:right">Listing %</th><th style="text-align:right">OSA %</th><th style="text-align:right">Stores</th>`).join('');
  html += `<div class="cons-card"><h2><span class="icon">🏙️</span>City-Level Availability — Top 15 by Sales Contribution</h2>
  <div class="cons-note">Ranked by ${last.label} OSA %, highest first</div>
  <table class="cons-table"><thead><tr><th>City</th>${th2}</tr><tr><th></th>${subth2}</tr></thead><tbody>`;
  const lastCities = [...DATA.availability.cities[last.id]].sort((a,b)=>b.osa-a.osa);
  lastCities.forEach(c=>{
    const city = c['Locality City'];
    let tds = periods.map(p=>{
      const item = DATA.availability.cities[p.id].find(x=>x['Locality City']===city);
      const mtdCls = p.type==='mtd' ? ' mtd' : '';
      if(!item || item.listing==null) return `<td class="na${mtdCls}">—</td><td class="na${mtdCls}">—</td><td class="na${mtdCls}">—</td>`;
      return `<td class="${mtdCls} ${classify(item.listing,85,70)}">${fmtPct(item.listing)}</td><td class="${mtdCls} ${classify(item.osa,80,65)}">${fmtPct(item.osa)}</td><td class="${mtdCls}">${fmtInt(item.stores)}</td>`;
    }).join('');
    html += `<tr><td style="text-transform:capitalize">${city}</td>${tds}</tr>`;
  });
  html += `</tbody></table></div>`;

  // Where to focus: the cities and SKUs that drive ~80% of sales
  const fc = DATA.availability.focus_cities;
  const fs = DATA.rca && DATA.rca.focus_skus;
  if(fc && fc.list && fc.list.length){
    const worst = [...fc.list].sort((a,b)=>a.osa-b.osa)[0];
    const strong = fc.list.filter(c=>c.osa>=80).length;
    let ftext = `Just <b>${fc.list.length} cities</b> deliver <b>${fmtPct(fc.covered,0)}</b> of Kari-Kari's Blinkit sales, so this is where full shelves matter most. <b>${strong} of ${fc.list.length}</b> already run at 80%+ OSA \u2014 a strong base. The single biggest sales unlock is <b>${cap(worst.city)}</b>: it brings <b>${fmtPct(worst.share)}</b> of sales, but the product is on shelf only <b>${fmtPct(worst.osa,0)}</b> of the time \u2014 every point of availability recovered here converts straight into sales.`;
    html += `<div class="cons-card"><h2><span class="icon">\ud83c\udfaf</span>Where to Focus \u2014 ${fc.list.length} Cities Drive ${fmtPct(fc.covered,0)} of Sales</h2>
    <div class="cons-note">Sales Share is measured across the full Jul\u2013Sep window \u00b7 Listing/OSA/Stores shown for ${fc.period} \u00b7 keeping shelves full in these cities is the fastest way to grow sales</div>
    <div class="insight"><div class="insight-label">The 80/20 View</div><div class="insight-text">${ftext}</div></div>
    <table class="cons-table"><thead><tr><th>City</th><th style="text-align:right">Sales Share</th><th style="text-align:right">Running Total</th><th style="text-align:right">Listing %</th><th style="text-align:right">OSA %</th><th style="text-align:right">Stores</th><th>Read</th></tr></thead><tbody>`;
    fc.list.forEach(c=>{
      const sig = c.osa>=80 ? '<span class="win">Shelf-ready</span>' : (c.osa>=70 ? 'Improving' : '<span class="warn">Priority fix</span>');
      html += `<tr><td>${cap(c.city)}</td><td style="text-align:right">${fmtPct(c.share)}</td><td style="text-align:right">${fmtPct(c.cum,0)}</td><td class="${classify(c.listing,85,70)}">${fmtPct(c.listing)}</td><td class="${classify(c.osa,80,65)}">${fmtPct(c.osa)}</td><td style="text-align:right">${fmtInt(c.stores)}</td><td>${sig}</td></tr>`;
    });
    html += `</tbody></table>`;
    if(fs && fs.list && fs.list.length){
      html += `<div class="cons-note" style="margin-top:16px">Same 80/20 lens on products \u2014 these ${fs.list.length} SKUs drive ${fmtPct(fs.covered,0)} of all units sold (${fs.period}). Keeping exactly these in stock protects most of the business:</div>
      <table class="cons-table"><thead><tr><th>SKU</th><th style="text-align:right">Units Share</th><th style="text-align:right">Listing %</th><th style="text-align:right">OSA %</th><th style="text-align:right">Ad SOV</th></tr></thead><tbody>`;
      fs.list.forEach(s=>{
        html += `<tr><td>${s.title.replace('Kari Kari ','')}</td><td style="text-align:right">${fmtPct(s.share)}</td><td class="${classify(s.listing,85,70)}">${fmtPct(s.listing)}</td><td class="${classify(s.osa,80,65)}">${fmtPct(s.osa)}</td><td style="text-align:right">${fmtPct(s.ad_sov,2)}</td></tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `</div>`;
  }

  return html;
}

function renderRca(periods){
  const overall = DATA.rca.overall;
  const first = periods[0], last = periods[periods.length-1];
  const o0 = overall[first.id], o1 = overall[last.id];
  let html = '';

  const ltd = overall.prev_ltd;
  const basePs = periods.filter(p=>p.type!=='mtd');
  const baseP = basePs.length ? basePs[basePs.length-1] : null;
  const sd = DATA.rca.same_days;
  const b = (last.type==='mtd' && baseP && sd) ? sd[baseP.id] : null;
  let story;
  if(periods.length===1){
    story = `In ${last.label} (${last.sub.replace(', 2026','')}), <b>Category Share</b> (of the full Savoury Snacks category, by value) is <b>${fmtPct(DATA.rca.market?DATA.rca.market.periods[last.id].share:null,3)}</b>, with <b>Organic SOV</b> at <b>${fmtPct(o1.organic_sov,2)}</b> and <b>Ad SOV</b> at <b>${fmtPct(o1.ad_sov,2)}</b>. Select another period above to compare. `;
  } else {
  const M = DATA.rca.market;
  const mpS = M ? M.periods[last.id] : null, mp0 = M ? M.periods[first.id] : null;
  story = mpS ? `<b>Category Share</b> (Kari-Kari's sales \u00f7 the FULL Savoury Snacks category, by value \u2014 a clearly defined base) is <b>${fmtPct(mpS.share,3)}</b> in ${last.label} (${last.sub.replace(', 2026','')}), vs <b>${fmtPct(mp0.share,3)}</b> in ${first.label} (${first.sub.replace(', 2026','')}). Comparing these windows is fair because share is a ratio \u2014 sales \u00f7 category size over the same days on both sides. ` : '';
  if(b){
    story += `<b>Fair comparison</b> (${last.label} is Sep 1\u201313, so we compare the SAME days of ${baseP.label}, ${b.sub}): <b>Ad SOV</b> (how often Kari-Kari appears in customer searches through ads) is running at <b>${fmtPct(o1.ad_sov,2)}</b> vs <b>${fmtPct(b.ad_sov,2)}</b> \u2014 bringing ad visibility back to ${baseP.label} levels is the quickest lever to lift category share. `;
    const dOrg = o1.organic_sov - b.organic_sov;
    story += dOrg>=0 ? `The bright spot: <b>Organic SOV</b> (free, non-ad visibility) has improved to <b>${fmtPct(o1.organic_sov,2)}</b> (${b.sub}: ${fmtPct(b.organic_sov,2)}) \u2014 the brand is earning visibility on its own. ` : `<b>Organic SOV</b> (free, non-ad visibility) is at <b>${fmtPct(o1.organic_sov,2)}</b> \u2014 a steady base to build on. `;
  } else {
    story += `<b>Overall SOV</b> (share of voice \u2014 how often the brand shows up in search) moved from <b>${fmtPct(o0.overall_sov,2)}</b> to <b>${fmtPct(o1.overall_sov,2)}</b>. `;
  }
  }
  if(DATA.rca.market && periods.length>1){
    const mpX=DATA.rca.market.periods[last.id], m0X=DATA.rca.market.periods[first.id];
    story += `The category itself is a <b>${fmtMoney(mpX.cat_day)}/day</b> market and growing (${fmtMoney(m0X.cat_day)}/day in ${first.label}) \u2014 a small slice today, huge headroom. See the Market View below. `;
  }

  html += `<div class="insight"><div class="insight-label">RCA / Share of Voice Story · ${first.label} → ${last.label}</div><div class="insight-text">${story}</div></div>`;

  const lfOn = last.type==='mtd' && sd;
  const lfVal = (p,key)=> (lfOn && p.type!=='mtd' && sd[p.id] && sd[p.id][key]!=null) ? sd[p.id][key] : overall[p.id][key];
  const winSub = () => periods.map(p=> (lfOn && p.type!=='mtd' && sd[p.id]) ? sd[p.id].sub : p.sub.replace(', 2026','')).join(' \u00b7 ') + (lfOn ? ' \u2014 same days each month (fair)' : '');
  const chain = (key,fmt) => periods.map((p,i)=>`<span class="v${i===periods.length-1?' current':''}">${fmt(lfVal(p,key))}</span>${i<periods.length-1?'<span class="arr">→</span>':''}`).join('');

  html += `<div class="kpi-strip">
    <div class="kpi-card"><div class="kpi-label">Category Share Trend</div><div class="kpi-trajectory">${periods.map((p,i)=>`<span class="v${i===periods.length-1?' current':''}">${fmtPct(DATA.rca.market?DATA.rca.market.periods[p.id].share:null,3)}</span>${i<periods.length-1?'<span class="arr">→</span>':''}`).join('')}</div><div class="kpi-sub">${periods.map(p=>p.sub.replace(', 2026','')).join(' \u00b7 ')}</div><div class="kpi-sub">Value share of the full Savoury Snacks category</div><div class="kpi-sub" style="margin-top:4px">Why windows differ: the monthly category report has no day-wise split \u2014 but a share is a ratio (sales \u00f7 category, same days on both sides), so a part-month compares fairly with a full month</div></div>
    <div class="kpi-card"><div class="kpi-label">Overall SOV Trend</div><div class="kpi-trajectory">${chain('overall_sov',v=>fmtPct(v,2))}</div><div class="kpi-sub">Organic + Ad combined</div><div class="kpi-sub">${winSub()}</div></div>
    <div class="kpi-card"><div class="kpi-label">Organic vs Ad SOV Trend</div><div class="kpi-sub" style="margin-bottom:2px"><b>Organic</b> (free visibility)</div><div class="kpi-trajectory" style="font-size:.95rem">${chain('organic_sov',v=>fmtPct(v,2))}</div><div class="kpi-sub" style="margin:6px 0 2px"><b>Ad-driven</b> (paid visibility)</div><div class="kpi-trajectory" style="font-size:.95rem">${chain('ad_sov',v=>fmtPct(v,2))}</div><div class="kpi-sub" style="margin-top:6px">${winSub()}</div></div>
    <div class="kpi-card"><div class="kpi-label">Units Sold (${last.label})</div><div class="kpi-value">${fmtInt(o1.units)}</div>${(periods.length>1&&last.type==='mtd'&&b)?`<span class="kpi-delta ${o1.units>=b.units?'up':'down'}">${o1.units>=b.units?'↑':'↓'} vs ${b.sub} (${fmtInt(b.units)})</span><div class="kpi-sub">Fair comparison \u2014 same days of ${baseP.label}</div>`:(periods.length>1?`<span class="kpi-delta ${o1.units>=o0.units?'up':'down'}">${o1.units>=o0.units?'↑':'↓'} vs ${first.label} ${fmtInt(o0.units)}</span><div class="kpi-sub">Full-month comparison</div>`:`<div class="kpi-sub">${last.sub.replace(', 2026','')}</div>`)}</div>
  </div>`;

  // Market View — full-category context from the monthly category report

    html += `<div class="cons-card"><h2><span class="icon">\ud83e\udded</span>Market View \u2014 Kari-Kari in the Full Savoury Snacks Category</h2>
    <div class="cons-note">From the monthly category report \u00b7 value (\u20b9 MRP) based \u00b7 share = Kari-Kari sales \u00f7 TOTAL Savoury Snacks category, both from GobbleCube's monthly category report \u00b7 Sep = 1\u201313</div>
    <div class="insight"><div class="insight-label">How big is Kari-Kari, really?</div><div class="insight-text">${mtxt}</div></div>
    <table class="cons-table"><thead><tr><th>Period</th><th style="text-align:right">Kari-Kari Sales</th><th style="text-align:right">Sales / day</th><th style="text-align:right">Category Size</th><th style="text-align:right">Category / day</th><th style="text-align:right">Share of Savoury Snacks</th></tr></thead><tbody>`;
    P.forEach(p=>{
      const m=MV.periods[p]; const lbl=p==='jul'?'July (1\u201331)':p==='aug'?'August (1\u201331)':'Sep (1\u201313)';
      const mtd=p==='sep_mtd'?' class="mtd"':'';
      html += `<tr><td${mtd}>${lbl}</td><td${mtd} style="text-align:right">${fmtMoney(m.offtake)}</td><td${mtd} style="text-align:right">${fmtMoney(m.off_day)}</td><td${mtd} style="text-align:right">${fmtMoney(m.cat_size)}</td><td${mtd} style="text-align:right">${fmtMoney(m.cat_day)}</td><td${mtd} style="text-align:right">${fmtPct(m.share,3)}</td></tr>`;
    });
    html += `</tbody></table>

    namedCities.forEach(c=>{
      const read = c.share!=null && avgShare!=null ? (c.share>=avgShare*1.5?'<span class="win">Stronghold</span>':(c.share<avgShare*0.7?'<span class="warn">Big headroom</span>':'On par')) : '\u2014';
      html += `<tr><td>${c.city}</td><td style="text-align:right">${fmtMoney(c.cat)}</td><td style="text-align:right">${fmtMoney(c.off)}</td><td style="text-align:right">${fmtPct(c.share,3)}</td><td>${read}</td></tr>`;
    });
    if(othersRow){
      html += `<tr><td>Others (all remaining cities)</td><td style="text-align:right">${fmtMoney(othersRow.cat)}</td><td style="text-align:right">${fmtMoney(othersRow.off)}</td><td style="text-align:right">${fmtPct(othersRow.share,3)}</td><td>\u2014</td></tr>`;

  html += `<div class="cons-card"><h2><span class="icon">📊</span>Daily Trend — SOV &amp; Category Share</h2>

  <div class="chart-legend"><span><i class="sw" style="background:#1CBFBB"></i>Organic SOV</span><span><i class="sw" style="background:#F59E0B"></i>Ad SOV</span></div>

  // product table

  let subth = periods.map(()=>`<th style="text-align:right">Organic SOV</th><th style="text-align:right">Ad SOV</th>`).join('');

  });
  html += `</tbody></table></div>`;

  // city table

  let subth2 = periods.map(()=>`<th style="text-align:right">Organic SOV</th><th style="text-align:right">Ad SOV</th>`).join('');
  html += `<div class="cons-card"><h2><span class="icon">🏙️</span>City-Level RCA</h2>

  lastCities.forEach(c=>{

      const item = DATA.rca.cities[p.id].find(x=>x.City===city);
      const mtdCls = p.type==='mtd' ? ' mtd' : '';
      if(!item) return `<td class="na${mtdCls}">—</td><td class="na${mtdCls}">—</td>`;
      return `<td class="${mtdCls}">${fmtPct(item.organic_sov,2)}</td><td class="${mtdCls}">${fmtPct(item.ad_sov,2)}</td>`;
    }).join('');
    html += `<tr><td>${city}</td>${tds}</tr>`;
  });
  html += `</tbody></table></div>`;

  return html;
}

function render(){
  const periods = activePeriods();
  if(!periods.length){ document.getElementById('content').innerHTML = '<p>Select at least one period.</p>'; return; }
  let html = currentView==='availability' ? renderAvailability(periods) : renderRca(periods);

  html += `<div class="cons-card"><h2><span class="icon">\ud83d\udcd6</span>Glossary \u2014 Every Number Explained</h2>
  <div class="cons-note">Plain-English definitions and the exact formula behind each metric, so anyone can verify the maths</div>
  <table class="cons-table"><thead><tr><th style="width:180px">Metric</th><th>What it means</th><th>How it is calculated</th></tr></thead><tbody>
  <tr><td><b>Listing %</b></td><td>Out of all Blinkit stores tracked, how many have the product listed (available to order).</td><td>Average of the daily store-level Listing % values across every store \u00d7 SKU \u00d7 day in the period.</td></tr>
  <tr><td><b>OSA %</b></td><td>On-Shelf Availability \u2014 how often the product is actually in stock when a customer looks.</td><td>Average of the daily store-level OSA % values across every store \u00d7 SKU \u00d7 day in the period.</td></tr>
  <tr><td><b>Wt. Discount %</b></td><td>Average discount customers see off MRP.</td><td>Average of daily discount values; days with no listing are skipped.</td></tr>
  <tr><td><b>Overall SOV</b></td><td>Share of Voice \u2014 out of all products a customer sees when browsing/searching the category, how often Kari-Kari appears.</td><td>Average of the daily city \u00d7 SKU SOV readings from the platform, blanks skipped. Organic SOV = free visibility; Ad SOV = visibility bought through ads.</td></tr>
  <tr><td><b>Category Share (value)</b></td><td>Kari-Kari vs the ENTIRE Savoury Snacks category \u2014 namkeen, chips, everything. A small % is expected for a niche brand: watch the trend and the \u20b9 headroom.</td><td>Kari-Kari sales (\u20b9 MRP) \u00f7 total estimated category size, both from GobbleCube's monthly category report. Fair across part-months because both sides cover the same days.</td></tr>
  <tr><td><b>Why no sub-category share?</b></td><td>GobbleCube's daily export also carries a per-SKU "Category Share" against its own sub-category grouping (Rice Crackers / Japanese-Oriental Snacks). Blinkit's own shelves don't use these names (its tags are Namkeen Snacks and Chips &amp; Crisps), so the exact competitor set behind that number is not defined for us.</td><td>Excluded from this dashboard until GobbleCube confirms the definition. Only clearly defined shares are shown.</td></tr>
  <tr><td><b>Units Sold</b></td><td>Total packs sold in the period.</td><td>Straight sum of daily units from the platform's RCA export.</td></tr>
  <tr><td><b>Fair comparison (like-for-like)</b></td><td>A part-month is never judged against a full month.</td><td>Sep 1\u201314 (Availability) / Sep 1\u201313 (RCA) is compared with the SAME days of the selected full month, e.g. Aug 1\u201314.</td></tr>
  <tr><td><b>Where to Focus (80/20)</b></td><td>The few cities/SKUs that create most of the sales.</td><td>Cities ranked by their share of total sales contribution across the full Jul\u2013Sep data window; the list stops once the running total crosses 80%. Availability columns show the latest MTD period. Same method for SKUs, using MTD units sold.</td></tr>
  <tr><td><b>Colour bands</b></td><td>Quick health read on tables.</td><td>Listing %: green \u2265 85, amber 70\u201385, red &lt; 70. OSA %: green \u2265 80, amber 65\u201380, red &lt; 65.</td></tr>
  <tr><td><b>Data sources</b></td><td>Where the numbers come from.</td><td>GobbleCube exports in Data Files/: blinkit-availability-data (store \u00d7 SKU \u00d7 day), blinkit-rca-download (city \u00d7 SKU \u00d7 day) and blinkit-category-rca-download (city \u00d7 month, full-category \u20b9 sizes). No numbers are typed in by hand.</td></tr>
  </tbody></table></div>
<div class="methodology"><b>Methodology:</b> Availability metrics (Listing %, OSA %, Stock Levels) are store-day averages across all tracked Kari Kari SKUs on Blinkit, sourced from the platform's availability export. RCA metrics (Category Share, Overall/Organic/Ad SOV) are city-product-day averages from the platform's RCA export, covering Jul 1 – Sep 13, 2026. "MTD" periods are partial months (Sep 1\u201314 for Availability, Sep 1\u201313 for RCA). For a fair read, the story boxes compare MTD with the SAME days of the previous month (like-for-like), never a part-month against a full month without normalizing for days elapsed.</div>`;
