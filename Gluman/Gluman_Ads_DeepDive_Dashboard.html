<title>Gluman — Amazon Ads Deep-Dive (May–June 2026)</title>

<style>
:root{--teal:#1CBFBB;--teal-d:#18A6A3;--teal-t:#E6FAF9;--bg:#f8f9fa;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--green:#15803d;--amber:#d97706;--red:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#020202,#1a1a1a);display:flex;align-items:center;justify-content:center;z-index:9999}
#gate .box{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:40px;width:340px;text-align:center}
#gate img{height:34px;margin-bottom:22px}#gate h2{color:#fff;font-size:15px;font-weight:500;margin-bottom:6px}
#gate p{color:#7D7D7D;font-size:13px;margin-bottom:20px}
#gate input{width:100%;padding:11px 14px;border:1px solid #333;border-radius:8px;background:#1c1c1c;color:#fff;font-size:14px;margin-bottom:12px}
#gate button{width:100%;padding:11px;border:none;border-radius:8px;background:var(--teal);color:#04342C;font-weight:600;font-size:14px;cursor:pointer}
#gate .err{color:#dc2626;font-size:12px;margin-top:10px;min-height:16px}
#app{display:none;max-width:1180px;margin:0 auto;padding:0 18px 60px}
header{background:linear-gradient(135deg,#020202,#1a1a1a);color:#fff;margin:0 -18px 0;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header .l{display:flex;align-items:center;gap:14px}header img{height:30px}header h1{font-size:18px;font-weight:500}
header .sub{font-size:12px;color:#9ca3af;margin-top:2px}header .meta{font-size:11px;color:#9ca3af;text-align:right}
.banner{background:linear-gradient(135deg,var(--teal-t),#fff);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:14px 18px;margin:18px 0;font-size:13.5px;color:#0b4a48}
.banner b{color:var(--teal-d)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 18px}
.tabs button{border:none;background:none;padding:9px 14px;font-size:13.5px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--teal-d);border-bottom-color:var(--teal);font-weight:600}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.kpi .lab{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:24px;font-weight:600;margin:5px 0 2px}.kpi .pl{font-size:11.5px;color:var(--mut)}
h3.sec{font-size:14px;font-weight:600;margin:22px 0 10px;color:#111}
.stories{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 0}
.stories div{padding:10px 18px;border-bottom:1px solid #f1f3f5;font-size:13px;display:flex;gap:10px}.stories div:last-child{border-bottom:none}
.stories .n{color:var(--teal-d);font-weight:600;min-width:18px}
.sowhat{background:var(--teal-t);border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:12px 16px;margin-top:14px;font-size:13px;color:#0b4a48}.sowhat b{color:var(--teal-d)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid #f1f3f5}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;background:#fafbfc;cursor:pointer}
td:first-child,th:first-child{text-align:left}tr.tot td{font-weight:700;border-top:2px solid var(--line);background:#fafbfc}
.csv{float:right;font-size:11px;color:var(--teal-d);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
.note{font-size:11px;color:var(--mut);margin-top:8px;font-style:italic}
.chartbox{position:relative;height:280px}canvas{max-height:300px}
.pill{font-weight:600;padding:1px 7px;border-radius:6px}
</style></head>

let D=null,M=null,tab="overview",charts=[];
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(){const pw=document.getElementById('pw').value,err=document.getElementById('err');
 try{const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC_SALT),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC_IV)},key,b64(ENC_DATA));
 D=JSON.parse(new TextDecoder().decode(pt));document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';init();
 }catch(e){err.textContent='Incorrect password.';}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('app').style.display!=='block')unlock();});
function inr(n){n=Math.round(n);const a=Math.abs(n);if(a>=1e7)return '₹'+(n/1e7).toFixed(2)+' Cr';if(a>=1e5)return '₹'+(n/1e5).toFixed(2)+' L';if(a>=1e3)return '₹'+(n/1e3).toFixed(1)+'K';return '₹'+n;}
function num(n){return Math.round(n).toLocaleString('en-IN');}
function rc(r){return r>=3?'var(--green)':(r>=1?'var(--amber)':'var(--red)');}
function rpill(r){return `<span class="pill" style="background:${r>=3?'#dcfce7':(r>=1?'#fef3c7':'#fee2e2')};color:${rc(r)}">${r.toFixed(2)}x</span>`;}
function cur(){return D.data[M];}
function buildMbar(){document.getElementById('mbar').innerHTML='<span style="font-size:12px;color:var(--mut)">Month:</span>'+D.months.map(m=>`<button onclick="setMonth('${m}')" style="border:1px solid var(--line);background:${m===M?'var(--teal)':'#fff'};color:${m===M?'#04342C':'var(--mut)'};font-weight:${m===M?600:400};border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer">${m}</button>`).join('')+'<button onclick="render()" title="Redraw if charts hang" style="margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--teal-d);font-weight:600;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer">↻ Refresh</button>';}
function setMonth(m){M=m;buildMbar();document.getElementById('hsub').textContent=D.seller+'  ·  '+M+' · true ad-ROAS (14-day attributed)';render();}
function init(){M=D.default||D.months[D.months.length-1];buildMbar();document.getElementById('hsub').textContent=D.seller+'  ·  '+M+' · true ad-ROAS (14-day attributed)';
 document.getElementById('hmeta').innerHTML='🔒 Encrypted · NorthSide<br>Ad-attributed basis';
 const T=[['overview','Overview'],['segment','By segment'],['asin','By ASIN'],['targeting','Targeting & keywords']].concat(D.trend?[['trend','Monthly trend (Jan 2025 →)']]:[]).concat([['method','Methodology']]);
 document.getElementById('tabs').innerHTML=T.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
 render();}
function setTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}
let _draw=()=>{};
function render(){charts.forEach(c=>c.destroy());charts=[];document.getElementById('banner').innerHTML=tab==='trend'?trendBanner():bannerText();
 document.getElementById('mbar').style.display=tab==='trend'?'none':'flex';
 const p=document.getElementById('panel');p.innerHTML={overview:tplOv,segment:tplSeg,asin:tplAsin,targeting:tplTgt,trend:tplTrend,method:tplMethod}[tab]();_draw();}
function bannerText(){const o=cur().overview;const sp=o.by_type.find(t=>t.type==='SP');
 return `<b>${M} ad performance:</b> ${inr(o.spend)} ad-spend drove ${inr(o.sales)} in attributed sales — a true ad-ROAS of <b>${o.roas.toFixed(2)}x</b> (ACOS ${o.acos}%). Sponsored Products carries ${(sp.spend/o.spend*100).toFixed(0)}% of spend at ${sp.roas.toFixed(2)}x. This is the ad-attributed lens for optimisation — distinct from the blended ROAS in the main tracker.`;}
function kpi(lab,val,sub,color){return `<div class="kpi"><div class="lab">${lab}</div><div class="val" ${color?`style="color:${color}"`:''}>${val}</div><div class="pl">${sub}</div></div>`;}

function tplOv(){const o=cur().overview;
 _draw=()=>{const c=document.getElementById('cDaily');if(c)charts.push(new Chart(c,{data:{labels:cur().daily.map(d=>d.date.slice(8)),datasets:[
   {type:'bar',label:'Ad-spend',data:cur().daily.map(d=>d.spend),backgroundColor:'#1CBFBB',borderRadius:3,yAxisID:'y'},
   {type:'line',label:'Ad-sales',data:cur().daily.map(d=>d.sales),borderColor:'#18A6A3',borderWidth:2,pointRadius:0,yAxisID:'y1'}]},
   options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,font:{size:11}}}},scales:{y:{position:'left',ticks:{callback:v=>inr(v),font:{size:10}}},y1:{position:'right',grid:{display:false},ticks:{callback:v=>inr(v),font:{size:10}}},x:{ticks:{font:{size:9},maxTicksLimit:16}}}}}));
   const s=document.getElementById('cType');if(s)charts.push(new Chart(s,{type:'bar',data:{labels:o.by_type.map(t=>t.type),datasets:[{data:o.by_type.map(t=>t.spend),backgroundColor:['#1CBFBB','#F0997B','#9ca3af'],borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>inr(c.parsed.y)}}},scales:{y:{ticks:{callback:v=>inr(v),font:{size:10}}}}}}));};
