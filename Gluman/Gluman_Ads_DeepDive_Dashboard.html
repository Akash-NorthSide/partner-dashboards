<title>Gluman — Amazon Ads Deep-Dive (May–June 2026)</title>

<style>
:root{--teal:#1CBFBB;--teal-d:#18A6A3;--teal-t:#E6FAF9;--bg:#f8f9fa;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--green:#15803d;--amber:#d97706;--red:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#020202,#1a1a1a);display:flex;align-items:center;justify-content:center;z-index:9999}
#gate .box{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:40px;width:340px;text-align:center}
#gate img{height:34px;margin-bottom:22px}#gate h2{color:#fff;font-size:15px;font-weight:500;margin-bottom:6px}
#gate p{color:#7D7D7D;font-size:13px;margin-bottom:20px}
#gate input{width:100%;padding:11px 14px;border:1px solid #333;border-radius:8px;background:#1c1c1c;color:#fff;font-size:14px;margin-bottom:12px}
#gate button{width:100%;padding:11px;border:none;border-radius:8px;background:var(--teal);color:#04342C;font-weight:600;font-size:14px;cursor:pointer}
#gate .err{color:#dc2626;font-size:12px;margin-top:10px;min-height:16px}
#app{display:none;max-width:1180px;margin:0 auto;padding:0 18px 60px}
header{background:linear-gradient(135deg,#020202,#1a1a1a);color:#fff;margin:0 -18px 0;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header .l{display:flex;align-items:center;gap:14px}header img{height:30px}header h1{font-size:18px;font-weight:500}
header .sub{font-size:12px;color:#9ca3af;margin-top:2px}header .meta{font-size:11px;color:#9ca3af;text-align:right}
.banner{background:linear-gradient(135deg,var(--teal-t),#fff);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:14px 18px;margin:18px 0;font-size:13.5px;color:#0b4a48}
.banner b{color:var(--teal-d)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 18px}
.tabs button{border:none;background:none;padding:9px 14px;font-size:13.5px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--teal-d);border-bottom-color:var(--teal);font-weight:600}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.kpi .lab{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:24px;font-weight:600;margin:5px 0 2px}.kpi .pl{font-size:11.5px;color:var(--mut)}
h3.sec{font-size:14px;font-weight:600;margin:22px 0 10px;color:#111}
.stories{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 0}
.stories div{padding:10px 18px;border-bottom:1px solid #f1f3f5;font-size:13px;display:flex;gap:10px}.stories div:last-child{border-bottom:none}
.stories .n{color:var(--teal-d);font-weight:600;min-width:18px}
.sowhat{background:var(--teal-t);border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:12px 16px;margin-top:14px;font-size:13px;color:#0b4a48}.sowhat b{color:var(--teal-d)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid #f1f3f5}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;background:#fafbfc;cursor:pointer}
td:first-child,th:first-child{text-align:left}tr.tot td{font-weight:700;border-top:2px solid var(--line);background:#fafbfc}
.csv{float:right;font-size:11px;color:var(--teal-d);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
.note{font-size:11px;color:var(--mut);margin-top:8px;font-style:italic}
.chartbox{position:relative;height:280px}canvas{max-height:300px}
.pill{font-weight:600;padding:1px 7px;border-radius:6px}
</style></head>

let D=null,M=null,tab="overview",charts=[];
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(){const pw=document.getElementById('pw').value,err=document.getElementById('err');
 try{const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC_SALT),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC_IV)},key,b64(ENC_DATA));
 D=JSON.parse(new TextDecoder().decode(pt));document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';init();
 }catch(e){err.textContent='Incorrect password.';}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('app').style.display!=='block')unlock();});
function inr(n){n=Math.round(n);const a=Math.abs(n);if(a>=1e7)return '₹'+(n/1e7).toFixed(2)+' Cr';if(a>=1e5)return '₹'+(n/1e5).toFixed(2)+' L';if(a>=1e3)return '₹'+(n/1e3).toFixed(1)+'K';return '₹'+n;}
function num(n){return Math.round(n).toLocaleString('en-IN');}
function rc(r){return r>=3?'var(--green)':(r>=1?'var(--amber)':'var(--red)');}
function rpill(r){return `<span class="pill" style="background:${r>=3?'#dcfce7':(r>=1?'#fef3c7':'#fee2e2')};color:${rc(r)}">${r.toFixed(2)}x</span>`;}
function cur(){return D.data[M];}
function buildMbar(){document.getElementById('mbar').innerHTML='<span style="font-size:12px;color:var(--mut)">Month:</span>'+D.months.map(m=>`<button onclick="setMonth('${m}')" style="border:1px solid var(--line);background:${m===M?'var(--teal)':'#fff'};color:${m===M?'#04342C':'var(--mut)'};font-weight:${m===M?600:400};border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer">${m}</button>`).join('')+'<button onclick="render()" title="Redraw if charts hang" style="margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--teal-d);font-weight:600;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer">↻ Refresh</button>';}
function setMonth(m){M=m;buildMbar();document.getElementById('hsub').textContent=D.seller+'  ·  '+M+' · true ad-ROAS (14-day attributed)';render();}
function init(){M=D.default||D.months[D.months.length-1];buildMbar();document.getElementById('hsub').textContent=D.seller+'  ·  '+M+' · true ad-ROAS (14-day attributed)';
 document.getElementById('hmeta').innerHTML='🔒 Encrypted · NorthSide<br>Ad-attributed basis';
 const T=[['overview','Overview'],['segment','By segment'],['asin','By ASIN'],['targeting','Targeting & keywords'],['method','Methodology']];
 document.getElementById('tabs').innerHTML=T.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
 render();}
function setTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}
let _draw=()=>{};
function render(){charts.forEach(c=>c.destroy());charts=[];document.getElementById('banner').innerHTML=bannerText();
 const p=document.getElementById('panel');p.innerHTML={overview:tplOv,segment:tplSeg,asin:tplAsin,targeting:tplTgt,method:tplMethod}[tab]();_draw();}
function bannerText(){const o=cur().overview;const sp=o.by_type.find(t=>t.type==='SP');
 return `<b>${M} ad performance:</b> ${inr(o.spend)} ad-spend drove ${inr(o.sales)} in attributed sales — a true ad-ROAS of <b>${o.roas.toFixed(2)}x</b> (ACOS ${o.acos}%). Sponsored Products carries ${(sp.spend/o.spend*100).toFixed(0)}% of spend at ${sp.roas.toFixed(2)}x. This is the ad-attributed lens for optimisation — distinct from the blended ROAS in the main tracker.`;}
function kpi(lab,val,sub,color){return `<div class="kpi"><div class="lab">${lab}</div><div class="val" ${color?`style="color:${color}"`:''}>${val}</div><div class="pl">${sub}</div></div>`;}

function tplOv(){const o=cur().overview;
 _draw=()=>{const c=document.getElementById('cDaily');if(c)charts.push(new Chart(c,{data:{labels:cur().daily.map(d=>d.date.slice(8)),datasets:[
   {type:'bar',label:'Ad-spend',data:cur().daily.map(d=>d.spend),backgroundColor:'#1CBFBB',borderRadius:3,yAxisID:'y'},
   {type:'line',label:'Ad-sales',data:cur().daily.map(d=>d.sales),borderColor:'#18A6A3',borderWidth:2,pointRadius:0,yAxisID:'y1'}]},
   options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,font:{size:11}}}},scales:{y:{position:'left',ticks:{callback:v=>inr(v),font:{size:10}}},y1:{position:'right',grid:{display:false},ticks:{callback:v=>inr(v),font:{size:10}}},x:{ticks:{font:{size:9},maxTicksLimit:16}}}}}));
   const s=document.getElementById('cType');if(s)charts.push(new Chart(s,{type:'bar',data:{labels:o.by_type.map(t=>t.type),datasets:[{data:o.by_type.map(t=>t.spend),backgroundColor:['#1CBFBB','#F0997B','#9ca3af'],borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>inr(c.parsed.y)}}},scales:{y:{ticks:{callback:v=>inr(v),font:{size:10}}}}}}));};
 const tr=o.by_type.map(t=>`<tr><td>${t.type}</td><td>${inr(t.spend)}</td><td>${inr(t.sales)}</td><td>${t.roas?rpill(t.roas):'—'}</td><td>${(t.spend/o.spend*100).toFixed(1)}%</td></tr>`).join('');
 return `
 <div class="grid g4">
  ${kpi('Ad-spend · '+M.split(' ')[0],inr(o.spend),'across SP · SD · SB')}
  ${kpi('Attributed ad-sales',inr(o.sales),num(o.orders)+' orders · '+num(o.units)+' units')}
  ${kpi('True ad-ROAS',o.roas.toFixed(2)+'x','ACOS '+o.acos+'%',rc(o.roas))}
  ${kpi('Clicks · CTR',num(o.clicks),(o.clicks/o.impr*100).toFixed(2)+'% CTR · CPC ₹'+(o.spend/o.clicks).toFixed(1))}
 </div>
 <h3 class="sec">🚀 Top 5 stories</h3>
 <div class="stories">
  <div><span class="n">1</span><span>${inr(o.spend)} of ad-spend returned ${inr(o.sales)} attributed sales — true ad-ROAS ${o.roas.toFixed(2)}x for ${M}.</span></div>
  <div><span class="n">2</span><span>Sponsored Products is the engine: ${(o.by_type[0].spend/o.spend*100).toFixed(0)}% of spend at ${o.by_type[0].roas.toFixed(2)}x. SD is small (${inr(o.by_type[1].spend)}, ${o.by_type[1].roas.toFixed(2)}x); SB negligible (${inr(o.by_type[2].spend)}).</span></div>
  <div><span class="n">3</span><span>${cur().by_segment[0].segment} is the biggest ad bet (${inr(cur().by_segment[0].spend)}, ${cur().by_segment[0].roas.toFixed(2)}x); the efficiency leaders sit above 4x.</span></div>
  <div><span class="n">4</span><span>${(()=>{const w=cur().by_segment.filter(s=>s.spend>15000).sort((a,b)=>a.roas-b.roas)[0];return w.segment+' is the drag — '+inr(w.spend)+' at '+w.roas.toFixed(2)+'x, below the '+o.roas.toFixed(1)+'x average.';})()}</span></div>
  <div><span class="n">5</span><span>${cur().targeting.count} targets ran; pruning the weakest keywords (see Targeting tab) is the fastest ROAS lever.</span></div>
 </div>
 <div class="grid g2" style="margin-top:6px">
  <div class="card"><h3 class="sec" style="margin-top:0">Daily ad-spend vs attributed sales</h3><div class="chartbox"><canvas id="cDaily"></canvas></div></div>
  <div class="card"><h3 class="sec" style="margin-top:0">Spend by ad type</h3><div class="chartbox"><canvas id="cType"></canvas></div>
   <table style="margin-top:8px"><thead><tr><th>Type</th><th>Spend</th><th>Ad-sales</th><th>ROAS</th><th>% spend</th></tr></thead><tbody>${tr}</tbody></table></div>
 </div>
 <div class="sowhat"><b>So what?</b> Ad efficiency is solid at ${o.roas.toFixed(2)}x true ad-ROAS on a lean ad budget. The win is concentrated in SP — SD and SB add little. The optimisation path is mix-shift toward the 4x+ segments and pruning sub-1x targets, not adding spend.</div>`;}

function tplSeg(){const S=cur().by_segment,g={spend:S.reduce((a,s)=>a+s.spend,0),sales:S.reduce((a,s)=>a+s.sales,0)};
 _draw=()=>{const c=document.getElementById('cSeg');if(c)charts.push(new Chart(c,{type:'bar',data:{labels:S.slice(0,10).map(s=>s.segment),datasets:[{data:S.slice(0,10).map(s=>s.spend),backgroundColor:S.slice(0,10).map(s=>rc(s.roas)),borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>inr(c.parsed.x)}}},scales:{x:{ticks:{callback:v=>inr(v),font:{size:10}}},y:{ticks:{font:{size:10}}}}}}));};
 const rows=S.map(s=>`<tr><td>${s.segment}</td><td>${inr(s.spend)}</td><td>${inr(s.sales)}</td><td>${rpill(s.roas)}</td><td>${s.acos!=null?s.acos+'%':'—'}</td><td>${num(s.clicks)}</td><td>${num(s.units)}</td><td>${(s.spend/g.spend*100).toFixed(1)}%</td></tr>`).join('');
 return `<h3 class="sec">Ad-spend by internal category <span style="font-size:11px;color:var(--mut)">(bar colour = ROAS health)</span></h3>
 <div class="card"><div class="chartbox"><canvas id="cSeg"></canvas></div></div>
 <h3 class="sec">Category performance <button class="csv" onclick="dl('segment')">⬇ CSV</button></h3>
 <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Segment</th><th>Spend</th><th>Ad-sales</th><th>ROAS</th><th>ACOS</th><th>Clicks</th><th>Units</th><th>% spend</th></tr></thead><tbody>${rows}<tr class="tot"><td>Total (SP+SD)</td><td>${inr(g.spend)}</td><td>${inr(g.sales)}</td><td>${(g.sales/g.spend).toFixed(2)}x</td><td>${(g.spend/g.sales*100).toFixed(1)}%</td><td></td><td></td><td>100%</td></tr></tbody></table></div>
 <div class="note">Segment view covers SP + SD (ASIN-attributable spend, ${inr(g.spend)}); SB (₹${num(cur().sb.spend)}) has no ASIN/segment attribution and sits only in the Overview total (${inr(cur().overview.spend)}).</div>
 <div class="sowhat"><b>So what?</b> ${(()=>{const top=[...S].filter(s=>s.spend>8000).sort((a,b)=>b.roas-a.roas)[0];const bot=[...S].filter(s=>s.spend>15000).sort((a,b)=>a.roas-b.roas)[0];return top.segment+' ('+top.roas.toFixed(2)+'x) earns more budget; '+bot.segment+' ('+bot.roas.toFixed(2)+'x on '+inr(bot.spend)+') needs bid/targeting tightening before it earns more.';})()} Shift budget up the ROAS curve.</div>`;}

function tplAsin(){const A=cur().by_asin;window._A=A.slice();
 const big=A.filter(a=>a.spend>=500);const worst=[...big].sort((x,y)=>x.roas-y.roas).slice(0,12);
 const rowsT=A.slice(0,50).map(a=>`<tr><td style="text-align:left">${a.name||a.asin}</td><td style="text-align:left">${a.segment}</td><td>${inr(a.spend)}</td><td>${inr(a.sales)}</td><td>${rpill(a.roas)}</td><td>${num(a.orders)}</td><td>${num(a.units)}</td></tr>`).join('');
 const rowsW=worst.map(a=>`<tr><td style="text-align:left">${a.name||a.asin}</td><td style="text-align:left">${a.segment}</td><td>${inr(a.spend)}</td><td>${inr(a.sales)}</td><td>${rpill(a.roas)}</td></tr>`).join('');
 return `<h3 class="sec">Top 50 advertised ASINs by spend <button class="csv" onclick="dl('asin')">⬇ CSV (all ${A.length})</button></h3>
 <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Product</th><th>Category</th><th>Spend</th><th>Ad-sales</th><th>ROAS</th><th>Orders</th><th>Units</th></tr></thead><tbody>${rowsT}</tbody></table></div>
 <div class="note">SP + SD advertised-product reports combined. ${A.length} ASINs with ad activity.</div>
 <h3 class="sec">⚠ Lowest-ROAS ASINs (spend ≥ ₹500) — optimisation candidates</h3>
 <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Product</th><th>Category</th><th>Spend</th><th>Ad-sales</th><th>ROAS</th></tr></thead><tbody>${rowsW}</tbody></table></div>
 <div class="sowhat"><b>So what?</b> The lowest-ROAS ASINs above are where spend is leaking — reduce bids or pause until listing/price is fixed, and redeploy toward the 4x+ ASINs in the high-ROAS segments. Granular bid actions run in the weekly amazon-ads-optimizer cycle.</div>`;}

function tplTgt(){const T=cur().targeting;
 const rs=l=>l.map(t=>`<tr><td style="text-align:left">${t.target}</td><td>${t.match||'—'}</td><td>${inr(t.spend)}</td><td>${inr(t.sales)}</td><td>${rpill(t.roas)}</td></tr>`).join('');
 const sb=cur().sb.keywords.map(k=>`<tr><td style="text-align:left">${k.kw}</td><td>${inr(k.spend)}</td><td>${inr(k.sales)}</td></tr>`).join('')||'<tr><td colspan="3">No SB keyword spend</td></tr>';
 return `<div class="grid g2">
  <div class="card" style="padding:0;overflow:hidden"><h3 class="sec" style="margin:14px 18px 6px">Top targets by spend</h3><table><thead><tr><th>Target</th><th>Match</th><th>Spend</th><th>Sales</th><th>ROAS</th></tr></thead><tbody>${rs(T.top_spend.slice(0,20))}</tbody></table></div>
  <div class="card" style="padding:0;overflow:hidden"><h3 class="sec" style="margin:14px 18px 6px">⚠ Worst ROAS (spend ≥ ₹300)</h3><table><thead><tr><th>Target</th><th>Match</th><th>Spend</th><th>Sales</th><th>ROAS</th></tr></thead><tbody>${rs(T.worst)}</tbody></table></div>
 </div>
 <h3 class="sec">★ Best ROAS targets (spend ≥ ₹300) — scale candidates</h3>
 <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Target</th><th>Match</th><th>Spend</th><th>Sales</th><th>ROAS</th></tr></thead><tbody>${rs(T.best)}</tbody></table></div>
 <h3 class="sec">Sponsored Brands keywords <span style="font-size:11px;color:var(--mut)">(₹${num(cur().sb.spend)} total spend — small this month)</span></h3>
 <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Keyword</th><th>Spend</th><th>Sales</th></tr></thead><tbody>${sb}</tbody></table></div>
 <div class="sowhat"><b>So what?</b> ${T.count} targets ran in ${M}. The worst-ROAS, meaningful-spend targets are the immediate pruning list; the best-ROAS targets are where to add budget. This is the keyword-level worklist for the weekly optimisation cycle.</div>`;}

function tplMethod(){const o=cur().overview;
 return `<div class="card"><h3 class="sec" style="margin-top:0">How to read this dashboard</h3>
 <p style="font-size:13px;color:var(--ink);line-height:1.7">${D.note_basis}</p>
 <ul style="font-size:13px;color:var(--ink);line-height:1.8;margin:10px 0 0 18px">
  <li><b>True ad-ROAS</b> (${o.roas.toFixed(2)}x) = 14-day attributed ad-sales ÷ ad-spend. The main tracker shows <b>blended ROAS</b> (total sales ÷ ad-spend), which is higher because it includes organic sales.</li>
  <li><b>Segment</b> = Product-Type from the master ASIN mapping sheet, rolled up from Advertised ASIN — aligned with the main dashboard's category tab.</li>
  <li><b>SP & SD</b> have ASIN-level detail (advertised-product reports). <b>SB</b> is shown at keyword level only (₹${num(cur().sb.spend)} spend; the SB purchased-ASIN report is minimal).</li>
  <li><b>Spend reconciles</b> to ${inr(o.spend)}, matching the ${M} ad-spend in the main Plan-vs-Actual dashboard (Δ &lt; 0.2%).</li>
 </ul></div>
 <div class="sowhat"><b>Source:</b> Amazon Sponsored Ads reports (${M}) — SP/SD advertised-product + targeting, SB keyword. Granular bid/budget actions run via the project-local amazon-ads-optimizer skill (03 Amazon Ads/).</div>`;}

function dl(kind){let rows;
 if(kind==='segment'){rows=[['Segment','Spend','Ad-sales','ROAS','ACOS%','Clicks','Orders','Units']].concat(cur().by_segment.map(s=>[s.segment,s.spend,s.sales,s.roas,s.acos,s.clicks,s.orders,s.units]));}
 else{rows=[['ASIN','Product','Category','Spend','Ad-sales','ROAS','Orders','Units']].concat(cur().by_asin.map(a=>[a.asin,a.name||'',a.segment,a.spend,a.sales,a.roas,a.orders,a.units]));}
 const csv=rows.map(r=>r.map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(',')).join('\n');
 const el=document.createElement('a');el.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));el.download='gluman_ads_'+kind+'_'+M.replace(/ /g,'').toLowerCase()+'.csv';el.click();}
</script></body></html>
