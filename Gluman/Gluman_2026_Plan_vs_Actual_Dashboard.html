<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gluman — 2026 Plan vs Actual</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--teal:#1CBFBB;--teal-d:#18A6A3;--teal-t:#E6FAF9;--dark:#1a1a1a;--bg:#f8f9fa;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--green:#15803d;--amber:#d97706;--red:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#020202,#1a1a1a);display:flex;align-items:center;justify-content:center;z-index:9999}
#gate .box{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:40px;width:340px;text-align:center}
#gate img{height:34px;margin-bottom:22px}
#gate h2{color:#fff;font-size:16px;font-weight:500;margin-bottom:6px}
#gate p{color:#7D7D7D;font-size:13px;margin-bottom:20px}
#gate input{width:100%;padding:11px 14px;border:1px solid #333;border-radius:8px;background:#1c1c1c;color:#fff;font-size:14px;margin-bottom:12px}
#gate button{width:100%;padding:11px;border:none;border-radius:8px;background:var(--teal);color:#04342C;font-weight:600;font-size:14px;cursor:pointer}
#gate .err{color:#dc2626;font-size:12px;margin-top:10px;min-height:16px}
#app{display:none;max-width:1180px;margin:0 auto;padding:0 18px 60px}
header{background:linear-gradient(135deg,#020202,#1a1a1a);color:#fff;margin:0 -18px 0;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header .l{display:flex;align-items:center;gap:14px}
header img{height:30px}
header h1{font-size:18px;font-weight:500}
header .sub{font-size:12px;color:#9ca3af;margin-top:2px}
header .meta{font-size:11px;color:#9ca3af;text-align:right}
.banner{background:linear-gradient(135deg,var(--teal-t),#fff);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:14px 18px;margin:18px 0;font-size:13.5px;color:#0b4a48}
.banner b{color:var(--teal-d)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.toggle{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:none;background:#fff;padding:7px 14px;font-size:12.5px;color:var(--mut);cursor:pointer}
.toggle button.on{background:var(--teal);color:#04342C;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 18px}
.tabs button{border:none;background:none;padding:9px 14px;font-size:13.5px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--teal-d);border-bottom-color:var(--teal);font-weight:600}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.kpi .lab{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:24px;font-weight:600;margin:5px 0 2px}
.kpi .pl{font-size:11.5px;color:var(--mut)}
.kpi .badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:7px}
.up{background:#dcfce7;color:var(--green)} .dn{background:#fee2e2;color:var(--red)} .fl{background:#fef3c7;color:var(--amber)}
h3.sec{font-size:14px;font-weight:600;margin:22px 0 10px;color:#111}
.stories{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 0}
.stories div{padding:10px 18px;border-bottom:1px solid #f1f3f5;font-size:13px;display:flex;gap:10px}
.stories div:last-child{border-bottom:none}
.stories .n{color:var(--teal-d);font-weight:600;min-width:18px}
.sowhat{background:var(--teal-t);border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:12px 16px;margin-top:14px;font-size:13px;color:#0b4a48}
.sowhat b{color:var(--teal-d)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid #f1f3f5}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.02em;background:#fafbfc}
td:first-child,th:first-child{text-align:left}
tr.tot td{font-weight:700;border-top:2px solid var(--line);background:#fafbfc}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.risk{background:#fee2e2;color:var(--red)} .ontrack{background:#dcfce7;color:var(--green)}
.csv{float:right;font-size:11px;color:var(--teal-d);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
.note{font-size:11px;color:var(--mut);margin-top:8px;font-style:italic}
canvas{max-height:280px}
.chartbox{position:relative;height:280px}
</style>
</head>

async function unlock(){

    const salt=b64(ENC_SALT),iv=b64(ENC_IV),ct=b64(ENC_DATA);

    document.getElementById('app').style.display='block';
    init();
  }catch(e){err.textContent='Incorrect password.';}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('app').style.display!=='block')unlock();});

function inr(n){n=Math.round(n);const a=Math.abs(n);if(a>=1e7)return '₹'+(n/1e7).toFixed(2)+' Cr';if(a>=1e5)return '₹'+(n/1e5).toFixed(2)+' L';if(a>=1e3)return '₹'+(n/1e3).toFixed(1)+'K';return '₹'+n;}
function num(n){return Math.round(n).toLocaleString('en-IN');}
function pct(n){return (n>=0?'+':'')+(n*100).toFixed(1)+'%';}
function badge(v,inv){if(v===0)return '';const c=inv?(v<0?'up':'dn'):(v>0?'up':'dn');const ar=v>0?'▲':'▼';return `<span class="badge ${c}">${ar} ${pct(v)}</span>`;}

// run-rate FY projection from Q1 attainment
function proj(actArr,planArr){let aS=0,nn=0;for(let i=0;i<planArr.length;i++){if(actArr[i]!=null){aS+=actArr[i];nn++;}}const pS=planArr.slice(0,nn).reduce((x,y)=>x+y,0);const att=pS?aS/pS:1;const rest=planArr.slice(nn).reduce((x,y)=>x+y,0);return {fy:aS+att*rest,att,n:nn};}

function init(){
  document.getElementById('hsub').textContent=D.seller+'  ·  '+D.period;
  document.getElementById('hmeta').innerHTML='Actuals through '+D.data_through+'<br>🔒 Encrypted · NorthSide';
  const tabsEl=document.getElementById('tabs');
  const T=[['summary','Summary · CEO'],['category','Category & product'],['bigbets','Big Bets'],['ads','Ads efficiency'],['geo','Geography']];
  tabsEl.innerHTML=T.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
  render();
}
function setView(v){view=v;document.querySelectorAll('#vtoggle button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();}
function setTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}

function render(){
  destroyCharts();
  document.getElementById('banner').innerHTML=bannerText();
  const p=document.getElementById('panel');
  if(tab==='summary')p.innerHTML=tplSummary();
  else if(tab==='category')p.innerHTML=tplCategory();
  else if(tab==='bigbets')p.innerHTML=tplBigBets();
  else if(tab==='ads')p.innerHTML=tplAds();
  else if(tab==='geo')p.innerHTML=tplGeo();
  drawCharts();
}

function bannerText(){
  const y=D.ytd, uv=(y.actual.units-y.plan.units)/y.plan.units, rv=(y.actual.rev-y.ly.rev)/y.ly.rev, uy=(y.actual.units-y.ly.units)/y.ly.units, ry=(y.actual.roas-y.ly.roas)/y.ly.roas;
  const pj=proj(D.actual.units,D.plan.units);
  return `<b>Where we stand (${y.label}):</b> ${num(y.actual.units)} units (${inr(y.actual.rev)}), ${pct(uv)} to plan but ${pct(uy)} vs last year on units. Revenue is ${pct(rv)} YoY as ASP softens, while ad-spend was cut ${pct((y.actual.spend-y.ly.spend)/y.ly.spend)} YoY — lifting blended ROAS to ${y.actual.roas.toFixed(2)}x (${pct(ry)} vs 2025). Run-rate projects ~${num(pj.fy)} units vs the ${num(D.plan.fy.units)} plan; defending revenue/ASP while protecting the efficiency gain is the focus.`;
}

function planActualChart(id,planArr,actArr,fmt,lyArr){
  const ctx=document.getElementById(id);if(!ctx)return;
  const act=planArr.map((_,i)=> (actArr[i]===null||actArr[i]===undefined)?null:actArr[i]);
  const ds=[
    {type:'bar',label:'Actual',data:act,backgroundColor:act.map((v,i)=> (v!=null&&v<planArr[i])?'#f0997b':'#1CBFBB'),borderRadius:4,order:3},
    {type:'line',label:'Plan',data:planArr,borderColor:'#18A6A3',borderDash:[6,4],borderWidth:2,pointRadius:0,fill:false,order:1}
  ];
  if(lyArr)ds.push({type:'line',label:'2025',data:lyArr,borderColor:'#9ca3af',borderWidth:1.5,pointRadius:0,fill:false,order:2});
  charts.push(new Chart(ctx,{data:{labels:MN,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.y==null?'—':fmt(c.parsed.y))}}},scales:{y:{ticks:{callback:v=>fmt(v),font:{size:10}}},x:{ticks:{font:{size:10}}}}}}));
}
function barChart(id,labels,vals,horizontal){
  const ctx=document.getElementById(id);if(!ctx)return;
  charts.push(new Chart(ctx,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:'#1CBFBB',borderRadius:4}]},options:{indexAxis:horizontal?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>inr(horizontal?c.parsed.x:c.parsed.y)}}},scales:{[horizontal?'x':'y']:{ticks:{callback:v=>inr(v),font:{size:10}}},[horizontal?'y':'x']:{ticks:{font:{size:10}}}}}}));
}
let _draw=()=>{};
function drawCharts(){_draw();}

function kpi(lab,val,plan,v,inv,yoy){const y=(yoy!==undefined&&yoy!==null)?`<div class="pl" style="margin-top:3px">vs LY <span style="color:${yoy>=0?'var(--green)':'var(--red)'};font-weight:600">${pct(yoy)}</span></div>`:'';return `<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div><div class="pl">${plan}</div>${badge(v,inv)}${y}</div>`;}

function tplSummary(){
  const y=D.ytd;
  const uv=(y.actual.units-y.plan.units)/y.plan.units, rv=(y.actual.rev-y.plan.rev)/y.plan.rev, sv=(y.actual.spend-y.plan.spend)/y.plan.spend;
  const roasA=y.actual.roas, roasP=y.plan.roas, aspA=y.actual.rev/y.actual.units, aspLY=y.ly.rev/y.ly.units;
  const pjU=proj(D.actual.units,D.plan.units), pjR=proj(D.actual.revenue,D.plan.revenue);
  _draw=()=>{planActualChart('cU',D.plan.units,D.actual.units,v=>num(v),D.ly_2025.units);planActualChart('cR',D.plan.revenue,D.actual.revenue,v=>inr(v),D.ly_2025.revenue);planActualChart('cRoas',D.plan.roas,D.actual.roas,v=>v.toFixed(1)+'x',D.ly_2025.roas);};
  const fba=y.fba_mix,fbaT=(fba.AFN||0)+(fba.MFN||0),fbaPct=fbaT?((fba.AFN||0)/fbaT*100).toFixed(1):'—';
  const gYTD=`<div class="grid g4">
    ${kpi('Units · '+y.label,num(y.actual.units),'Plan '+num(y.plan.units),uv,false,(y.actual.units-y.ly.units)/y.ly.units)}
    ${kpi('Revenue · '+y.label,inr(y.actual.rev),'Plan '+inr(y.plan.rev),rv,false,(y.actual.rev-y.ly.rev)/y.ly.rev)}
    ${kpi('Ad-Spend · '+y.label,inr(y.actual.spend),'Budget '+inr(y.plan.spend),sv,false,(y.actual.spend-y.ly.spend)/y.ly.spend)}
    ${kpi('Blended ROAS · '+y.label,roasA.toFixed(2)+'x','Plan '+roasP.toFixed(2)+'x',(roasA-roasP)/roasP,false,(roasA-y.ly.roas)/y.ly.roas)}
  </div>`;
  const gFY=`<div class="grid g4">
    ${kpi('FY units (run-rate)',num(pjU.fy),'Plan '+num(D.plan.fy.units),(pjU.fy-D.plan.fy.units)/D.plan.fy.units,false)}
    ${kpi('FY revenue (run-rate)',inr(pjR.fy),'Plan '+inr(D.plan.fy.rev),(pjR.fy-D.plan.fy.rev)/D.plan.fy.rev,false)}
    ${kpi('ASP · '+y.label,'₹'+Math.round(aspA),'Plan ₹'+Math.round(D.plan.fy.asp),(aspA-D.plan.fy.asp)/D.plan.fy.asp,false,(aspA-aspLY)/aspLY)}
    ${kpi('FBA mix · '+y.label,fbaPct+'%','MFN '+num(fba.MFN||0)+' units',0,false)}
  </div>`;
  return `
  <div style="font-size:11px;color:var(--mut);margin-bottom:6px">${view==='fy'?'Full-year run-rate projection ('+y.label+' pace applied to plan)':y.label+' actual vs plan vs 2025'}</div>
  ${view==='fy'?gFY:gYTD}
  <div style="margin-top:12px">${view==='fy'?gYTD:gFY}</div>
  <h3 class="sec">🚀 Top 5 stories</h3>
  <div class="stories">
    <div><span class="n">1</span><span>Volume keeps growing — ${y.label} units ${pct((y.actual.units-y.ly.units)/y.ly.units)} vs last year (${num(y.actual.units)} vs ${num(y.ly.units)}).</span></div>
    <div><span class="n">2</span><span>Ad efficiency is the standout: blended ROAS ${roasA.toFixed(2)}x, ${pct((roasA-y.ly.roas)/y.ly.roas)} vs 2025, on ad-spend ${pct((y.actual.spend-y.ly.spend)/y.ly.spend)} YoY.</span></div>
    <div><span class="n">3</span><span>April–May spend was tightened to ${inr(D.actual.spend[3])} / ${inr(D.actual.spend[4])}, lifting blended ROAS to ${D.actual.roas[3].toFixed(1)}x / ${D.actual.roas[4].toFixed(1)}x.</span></div>
    <div><span class="n">4</span><span>Revenue is the watch area — ${pct((y.actual.rev-y.ly.rev)/y.ly.rev)} vs 2025 as ASP eases to ₹${Math.round(aspA)} (LY ₹${Math.round(aspLY)}).</span></div>
    <div><span class="n">5</span><span>Against an ambitious plan, units track ${pct(uv)} — the gap sits in February and the summer ramp, not in demand direction.</span></div>
  </div>
  <h3 class="sec">Monthly units — actual vs plan vs 2025</h3>
  <div class="card"><div class="chartbox"><canvas id="cU"></canvas></div><div class="note">Dashed = plan · bars = actual (Jan–May) · grey = 2025. Coral bar = below plan.</div></div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3 class="sec" style="margin-top:0">Monthly revenue — actual vs plan vs 2025</h3><div class="chartbox"><canvas id="cR"></canvas></div></div>
    <div class="card"><h3 class="sec" style="margin-top:0">Blended ROAS — actual vs plan vs 2025</h3><div class="chartbox"><canvas id="cRoas"></canvas></div></div>
  </div>
  <div class="sowhat"><b>So what?</b> Through ${y.label}: healthy volume (${pct((y.actual.units-y.ly.units)/y.ly.units)} YoY) and much stronger ad efficiency (blended ROAS ${pct((roasA-y.ly.roas)/y.ly.roas)} YoY) — profit is protected as spend is cut. The watch item is revenue/ASP vs last year; defending price realisation and the summer SKUs re-closes the gap to an aggressive plan.</div>`;
}

function table(cols,rows,totalRow,id){
  let h='<table><thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';
  h+=rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
  if(totalRow)h+='<tr class="tot">'+totalRow.map(c=>`<td>${c}</td>`).join('')+'</tr>';
  h+='</tbody></table>';
  return h;
}

function tplCategory(){
  const pts=D.category.product_types,g=D.category.grand;
  _draw=()=>{barChart('cCat',pts.slice(0,10).map(p=>p.name),pts.slice(0,10).map(p=>p.revenue),true);};
  const yoyc=x=>{const c=x>=0?'var(--green)':'var(--red)';return `<span style="color:${c};font-weight:600">${pct(x)}</span>`;};
  const rows=pts.map(p=>[p.name,num(p.units),(p.units/g.units*100).toFixed(1)+'%',inr(p.revenue),(p.revenue/g.revenue*100).toFixed(1)+'%',num(p.ly_units),p.ly_units?yoyc(p.units/p.ly_units-1):'—']);
  const top=pts[0];
  return `
  <h3 class="sec">Jan–May revenue by product type</h3>
  <div class="card"><div class="chartbox"><canvas id="cCat"></canvas></div></div>
  <h3 class="sec">Product-type performance <button class="csv" onclick="exportCat()">⬇ CSV</button></h3>
  <div class="card" style="padding:0;overflow:hidden">
  ${table(['Product type','Units','% units','Revenue','% rev','2025 Q1','YoY'],rows,['Total',num(g.units),'100%',inr(g.revenue),'100%',num(g.ly_units),yoyc(g.units/g.ly_units-1)])}
  </div>
  <div class="note">MTR shipment basis (B2B+B2C), attributes mapped from master by ASIN. 2025 = same Jan–May window last year. Total ${num(g.units)} units vs the reconciled headline ${num(D.ytd.actual.units)} differs ~1% (order-date vs reconciled, mainly Apr–May).</div>
  <div class="sowhat"><b>So what?</b> ${top.name} leads at ${(top.revenue/g.revenue*100).toFixed(0)}% of Jan–May revenue. The mix is healthy and seasonal — summer lines should carry Q2–Q3; protect their stock cover now.</div>`;
}

function tplBigBets(){
  const bb=D.big_bets.all.filter(b=>b.selected);
  const rows=bb.map(b=>[b.rank,b.asin,b.product_type,b.abc,num(b.q1_units),inr(b.q1_revenue),num(b.fy_units),`<span class="chip ${b.status==='At Risk'?'risk':'ontrack'}">${b.status}</span>`]);
  const tu=bb.reduce((x,b)=>x+b.q1_units,0),tr=bb.reduce((x,b)=>x+b.q1_revenue,0);
  const atRisk=bb.filter(b=>b.status==='At Risk').length;
  return `
  <h3 class="sec">Big Bet SKUs — the 10 selected (80/20 focus)</h3>
  <div class="grid g4">
    ${kpi('Selected Big Bets',D.big_bets.selected_count,'of '+D.big_bets.all.length+' shortlisted',0,false)}
    ${kpi('Big Bet Q1 units',num(tu),inr(tr)+' revenue',0,false)}
    ${kpi('At-risk vs FY pace',atRisk+' of '+bb.length,'need Q2 acceleration',0,false)}
    ${kpi('FY units target (BB)',num(bb.reduce((x,b)=>x+b.fy_units,0)),'vs '+num(bb.reduce((x,b)=>x+b.units_2025,0))+' in 2025',0,false)}
  </div>
  <h3 class="sec">Selected Big Bets <button class="csv" onclick="exportBB()">⬇ CSV</button></h3>
  <div class="card" style="padding:0;overflow:hidden">
  ${table(['#','ASIN','Product type','ABC','Q1 units','Q1 rev','FY target','Status'],rows,['','','','Total',num(tu),inr(tr),num(bb.reduce((x,b)=>x+b.fy_units,0)),''])}
  </div>
  <div class="note">Status compares Q1 run-rate against the full-year projection. "At Risk" = needs Q2 acceleration to hit FY target.</div>
  <div class="sowhat"><b>So what?</b> ${atRisk} of ${bb.length} Big Bets are behind their FY pace after a soft Feb — concentrate the 80/20 ad budget and FBA cover here in Q2 to convert the shortlist into the year's growth engine.</div>`;
}

function tplAds(){
  _draw=()=>{planActualChart('aS',D.plan.spend,D.actual.spend,v=>inr(v),D.ly_2025.spend);planActualChart('aR',D.plan.roas,D.actual.roas,v=>v.toFixed(1)+'x',D.ly_2025.roas);};
  const y=D.ytd,sv=(y.actual.spend-y.plan.spend)/y.plan.spend,roasA=y.actual.roas;
  return `
  <div class="grid g4">
    ${kpi('Ad-Spend · '+y.label,inr(y.actual.spend),'Budget '+inr(y.plan.spend),sv,false,(y.actual.spend-y.ly.spend)/y.ly.spend)}
    ${kpi('FY ad-budget',inr(D.plan.fy.spend),'−22% vs 2025',0,false)}
    ${kpi('Blended ROAS · '+y.label,roasA.toFixed(2)+'x','Plan '+y.plan.roas.toFixed(2)+'x',(roasA-y.plan.roas)/y.plan.roas,false,(roasA-y.ly.roas)/y.ly.roas)}
    ${kpi('Latest-month ROAS',D.actual.roas[4].toFixed(1)+'x','May · Apr '+D.actual.roas[3].toFixed(1)+'x',0,false)}
  </div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3 class="sec" style="margin-top:0">Monthly ad-spend — actual vs budget vs 2025</h3><div class="chartbox"><canvas id="aS"></canvas></div></div>
    <div class="card"><h3 class="sec" style="margin-top:0">Blended ROAS — actual vs plan vs 2025</h3><div class="chartbox"><canvas id="aR"></canvas></div></div>
  </div>
  <div class="sowhat"><b>So what?</b> The leaner-ad-year plan (₹38.1L, −22%) is being beaten on efficiency — ${y.label} ad-spend ${pct((y.actual.spend-y.ly.spend)/y.ly.spend)} vs 2025 at blended ROAS ${roasA.toFixed(2)}x (${pct((roasA-y.ly.roas)/y.ly.roas)} YoY). The opportunity: redeploy part of that saving into the at-risk Big-Bet SKUs to defend revenue — granular SP/SB/SD targeting decisions run in the weekly cycle.</div>
  ${D.ads_may?`<h3 class="sec">May — true ad-ROAS by segment <span style="font-size:11px;color:var(--mut)">(ad-attributed · from Ads Deep-Dive)</span></h3>
  <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Segment</th><th>Ad-spend</th><th>Ad-sales</th><th>True ad-ROAS</th></tr></thead><tbody>${D.ads_may.segments.map(x=>`<tr><td>${x.segment}</td><td>${inr(x.spend)}</td><td>${inr(x.sales)}</td><td><span style="font-weight:600;color:${x.roas>=3?'var(--green)':(x.roas>=1?'var(--amber)':'var(--red)')}">${x.roas.toFixed(2)}x</span></td></tr>`).join('')}<tr class="tot"><td>Total (SP+SD+SB)</td><td>${inr(D.ads_may.overview.spend)}</td><td>${inr(D.ads_may.overview.sales)}</td><td>${D.ads_may.overview.roas.toFixed(2)}x</td></tr></tbody></table></div>
  <div class="note">True ad-ROAS = 14-day attributed ad-sales ÷ ad-spend (May ${D.ads_may.overview.roas.toFixed(2)}x) — distinct from the blended ROAS above. Full ASIN/keyword detail in <b>Gluman_Ads_DeepDive_Dashboard.html</b>.</div>`:''}
  <div class="note">ROAS here is blended (total sales ÷ ad-spend), matching the plan's ROAS basis. Granular campaign/keyword/ASIN optimization runs via the project-local <b>amazon-ads-optimizer</b> skill (03 Amazon Ads/).</div>`;
}

function tplGeo(){
  const z=D.geography.zones,zg=D.geography.zones_grand,s=D.geography.states,sg=D.geography.states_grand,c=D.geography.cities,cg=D.geography.cities_grand;
  _draw=()=>{barChart('cZone',z.map(x=>x.name),z.map(x=>x.revenue),false);};
  const zr=z.map(x=>[x.name,num(x.units),inr(x.revenue),(x.revenue/zg.revenue*100).toFixed(1)+'%']);
  const sr=s.map(x=>[x.name,num(x.units),inr(x.revenue),(x.revenue/sg.revenue*100).toFixed(1)+'%']);
  const cr=c.map(x=>[x.name,num(x.units),inr(x.revenue),(x.revenue/cg.revenue*100).toFixed(1)+'%']);
  return `
  <h3 class="sec">Q1 revenue by zone</h3>
  <div class="card"><div class="chartbox"><canvas id="cZone"></canvas></div></div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card" style="padding:0;overflow:hidden"><h3 class="sec" style="margin:14px 18px 0">Top states <button class="csv" onclick="exportGeo('states')">⬇</button></h3>${table(['State','Units','Revenue','% rev'],sr,['Total',num(sg.units),inr(sg.revenue),'100%'])}</div>
    <div class="card" style="padding:0;overflow:hidden"><h3 class="sec" style="margin:14px 18px 0">Top cities <button class="csv" onclick="exportGeo('cities')">⬇</button></h3>${table(['City','Units','Revenue','% rev'],cr,['Total',num(cg.units),inr(cg.revenue),'100%'])}</div>
  </div>
  <div class="note">MTR shipment basis · top ${s.length} states / ${c.length} cities shown; totals reflect all.</div>
  <div class="sowhat"><b>So what?</b> Demand concentrates in a handful of metros and states — a focused regional FBA placement and city-level ad emphasis there protects fulfillment speed where the volume actually is.</div>`;
}

function dl(name,rows){const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();}
function exportCat(){const g=D.category.grand;dl('gluman_category_q1.csv',[['Product type','Units','% units','Revenue','% rev'],...D.category.product_types.map(p=>[p.name,p.units,(p.units/g.units*100).toFixed(1),p.revenue,(p.revenue/g.revenue*100).toFixed(1)])]);}
function exportBB(){dl('gluman_bigbets.csv',[['Rank','ASIN','Type','ABC','Q1 units','Q1 rev','FY target','Status'],...D.big_bets.all.filter(b=>b.selected).map(b=>[b.rank,b.asin,b.product_type,b.abc,b.q1_units,b.q1_revenue,b.fy_units,b.status])]);}
function exportGeo(k){const d=D.geography[k];dl('gluman_'+k+'.csv',[['Name','Units','Revenue'],...d.map(x=>[x.name,x.units,x.revenue])]);}
</script>
