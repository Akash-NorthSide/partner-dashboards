<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

<title>Gluman — 2026 Plan vs Actual</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--teal:#1CBFBB;--teal-d:#18A6A3;--teal-t:#E6FAF9;--dark:#1a1a1a;--bg:#f8f9fa;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--green:#15803d;--amber:#d97706;--red:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#020202,#1a1a1a);display:flex;align-items:center;justify-content:center;z-index:9999}
#gate .box{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:40px;width:340px;text-align:center}
#gate img{height:34px;margin-bottom:22px}
#gate h2{color:#fff;font-size:16px;font-weight:500;margin-bottom:6px}
#gate p{color:#7D7D7D;font-size:13px;margin-bottom:20px}
#gate input{width:100%;padding:11px 14px;border:1px solid #333;border-radius:8px;background:#1c1c1c;color:#fff;font-size:14px;margin-bottom:12px}
#gate button{width:100%;padding:11px;border:none;border-radius:8px;background:var(--teal);color:#04342C;font-weight:600;font-size:14px;cursor:pointer}
#gate .err{color:#dc2626;font-size:12px;margin-top:10px;min-height:16px}
#app{display:none;max-width:1180px;margin:0 auto;padding:0 18px 60px}
header{background:linear-gradient(135deg,#020202,#1a1a1a);color:#fff;margin:0 -18px 0;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header .l{display:flex;align-items:center;gap:14px}
header img{height:30px}
header h1{font-size:18px;font-weight:500}
header .sub{font-size:12px;color:#9ca3af;margin-top:2px}
header .meta{font-size:11px;color:#9ca3af;text-align:right}
.banner{background:linear-gradient(135deg,var(--teal-t),#fff);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:14px 18px;margin:18px 0;font-size:13.5px;color:#0b4a48}
.banner b{color:var(--teal-d)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.toggle{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:none;background:#fff;padding:7px 14px;font-size:12.5px;color:var(--mut);cursor:pointer}
.toggle button.on{background:var(--teal);color:#04342C;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 18px}
.tabs button{border:none;background:none;padding:9px 14px;font-size:13.5px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--teal-d);border-bottom-color:var(--teal);font-weight:600}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.kpi .lab{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:24px;font-weight:600;margin:5px 0 2px}
.kpi .pl{font-size:11.5px;color:var(--mut)}
.kpi .badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:7px}
.up{background:#dcfce7;color:var(--green)} .dn{background:#fee2e2;color:var(--red)} .fl{background:#fef3c7;color:var(--amber)}
h3.sec{font-size:14px;font-weight:600;margin:22px 0 10px;color:#111}
.stories{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 0}
.stories div{padding:10px 18px;border-bottom:1px solid #f1f3f5;font-size:13px;display:flex;gap:10px}
.stories div:last-child{border-bottom:none}
.stories .n{color:var(--teal-d);font-weight:600;min-width:18px}
.sowhat{background:var(--teal-t);border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:12px 16px;margin-top:14px;font-size:13px;color:#0b4a48}
.sowhat b{color:var(--teal-d)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid #f1f3f5}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.02em;background:#fafbfc}
td:first-child,th:first-child{text-align:left}
tr.tot td{font-weight:700;border-top:2px solid var(--line);background:#fafbfc}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.risk{background:#fee2e2;color:var(--red)} .ontrack{background:#dcfce7;color:var(--green)}
tr.bbsel td{background:#e4f8f0}
tr.bbsel td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.csv{float:right;font-size:11px;color:var(--teal-d);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
.note{font-size:11px;color:var(--mut);margin-top:8px;font-style:italic}
canvas{max-height:280px}
.chartbox{position:relative;height:280px}
</style>
</head>

let D=null,view="ytd",tab="summary",charts=[];
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  try{
    const salt=b64(ENC_SALT),iv=b64(ENC_IV),ct=b64(ENC_DATA);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    D=JSON.parse(new TextDecoder().decode(pt));
    {const b=document.getElementById('ytdbtn'); if(b&&D.ytd_lbl) b.textContent='YTD ('+D.ytd_lbl+')';}
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  }catch(e){err.textContent='Incorrect password.';}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('app').style.display!=='block')unlock();});

function inr(n){n=Math.round(n);const a=Math.abs(n);if(a>=1e7)return '₹'+(n/1e7).toFixed(2)+' Cr';if(a>=1e5)return '₹'+(n/1e5).toFixed(2)+' L';if(a>=1e3)return '₹'+(n/1e3).toFixed(1)+'K';return '₹'+n;}
function num(n){return Math.round(n).toLocaleString('en-IN');}
function pct(n){return (n>=0?'+':'')+(n*100).toFixed(1)+'%';}
function badge(v,inv){if(v===0)return '';const c=inv?(v<0?'up':'dn'):(v>0?'up':'dn');const ar=v>0?'▲':'▼';return `<span class="badge ${c}">${ar} ${pct(v)}</span>`;}

// run-rate FY projection from actuals-to-date attainment
function proj(actArr,planArr,fullArr){let aS=0,nn=0;for(let i=0;i<planArr.length;i++){if(actArr[i]!=null){aS+=actArr[i];nn++;}}const pS=planArr.slice(0,nn).reduce((x,y)=>x+y,0);const att=pS?aS/pS:1;const F=fullArr||planArr;const rest=F.slice(nn).reduce((x,y)=>x+y,0)+(nn>0?(F[nn-1]-planArr[nn-1]):0);return {fy:aS+att*rest,att,n:nn};}

function init(){
  document.getElementById('hsub').textContent=D.seller+'  ·  '+D.period;
  document.getElementById('hmeta').innerHTML='Actuals through '+D.data_through+'<br>🔒 Encrypted · NorthSide';
  const tabsEl=document.getElementById('tabs');
  const T=[['summary','Summary · CEO'],['category','Category & product'],['bigbets','Big Bets'],['ads','Ads efficiency'],['geo','Geography']];
  tabsEl.innerHTML=T.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
  render();
}
function setView(v){view=v;document.querySelectorAll('#vtoggle button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();}
function setTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}

function render(){
  destroyCharts();
  document.getElementById('banner').innerHTML=bannerText();
  const p=document.getElementById('panel');
  if(tab==='summary')p.innerHTML=tplSummary();
  else if(tab==='category')p.innerHTML=tplCategory();
  else if(tab==='bigbets')p.innerHTML=tplBigBets();
  else if(tab==='ads')p.innerHTML=tplAds();
  else if(tab==='geo')p.innerHTML=tplGeo();
  drawCharts();
}

function bannerText(){
  if(D.hero) return `<b>Headline:</b> ${D.hero.headline}`;
  const y=D.ytd; return `<b>Where we stand (${y.label}):</b> ${num(y.actual.units)} units (${inr(y.actual.rev)}), blended ROAS ${y.actual.roas.toFixed(2)}x.`;
}
function planActualChart(id,planArr,actArr,fmt,lyArr,goodLow){
  const ctx=document.getElementById(id);if(!ctx)return;
  const act=planArr.map((_,i)=> (actArr[i]===null||actArr[i]===undefined)?null:actArr[i]);
  const ds=[
    {type:'bar',label:'Actual',data:act,backgroundColor:act.map((v,i)=> (v!=null&&(goodLow? v>planArr[i] : v<planArr[i]))?'#f0997b':'#1CBFBB'),borderRadius:4,order:3},
    {type:'line',label:'Plan',data:planArr,borderColor:'#18A6A3',borderDash:[6,4],borderWidth:2,pointRadius:0,fill:false,order:1}
  ];
  if(lyArr)ds.push({type:'line',label:'2025',data:lyArr,borderColor:'#9ca3af',borderWidth:1.5,pointRadius:0,fill:false,order:2});
  charts.push(new Chart(ctx,{data:{labels:MN,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.y==null?'—':fmt(c.parsed.y))}}},scales:{y:{ticks:{callback:v=>fmt(v),font:{size:10}}},x:{ticks:{font:{size:10}}}}}}));
}
function barChart(id,labels,vals,horizontal){
  const ctx=document.getElementById(id);if(!ctx)return;
  charts.push(new Chart(ctx,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:'#1CBFBB',borderRadius:4}]},options:{indexAxis:horizontal?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>inr(horizontal?c.parsed.x:c.parsed.y)}}},scales:{[horizontal?'x':'y']:{ticks:{callback:v=>inr(v),font:{size:10}}},[horizontal?'y':'x']:{ticks:{font:{size:10}}}}}}));
}
let _draw=()=>{};
function drawCharts(){_draw();}

function kpi(lab,val,plan,v,inv,yoy,yoyInv){const good=yoyInv?(yoy<=0):(yoy>=0);const y=(yoy!==undefined&&yoy!==null)?`<div class="pl" style="margin-top:3px">vs LY <span style="color:${good?'var(--green)':'var(--red)'};font-weight:600">${pct(yoy)}</span></div>`:'';return `<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div><div class="pl">${plan}</div>${badge(v,inv)}${y}</div>`;}

function tplSummary(){
  const y=D.ytd;
  const uv=(y.actual.units-y.plan.units)/y.plan.units, rv=(y.actual.rev-y.plan.rev)/y.plan.rev, sv=(y.actual.spend-y.plan.spend)/y.plan.spend;
  const roasA=y.actual.roas, roasP=y.plan.roas, aspA=y.actual.rev/y.actual.units, aspLY=y.ly.rev/y.ly.units;
  const pjU=proj(D.actual.units,D.plan.units,(D.plan_full||{}).units), pjR=proj(D.actual.revenue,D.plan.revenue,(D.plan_full||{}).revenue);
  _draw=()=>{planActualChart('cU',D.plan.units,D.actual.units,v=>num(v),D.ly_2025.units);planActualChart('cR',D.plan.revenue,D.actual.revenue,v=>inr(v),D.ly_2025.revenue);planActualChart('cRoas',D.plan.roas,D.actual.roas,v=>v.toFixed(1)+'x',D.ly_2025.roas);};
  const fba=y.fba_mix,fbaT=(fba.AFN||0)+(fba.MFN||0),fbaPct=fbaT?((fba.AFN||0)/fbaT*100).toFixed(1):'—';
  const gYTD=`<div class="grid g4">
    ${kpi('Units · '+y.label,num(y.actual.units),'Plan '+num(y.plan.units),uv,false,(y.actual.units-y.ly.units)/y.ly.units)}
    ${kpi('Revenue · '+y.label,inr(y.actual.rev),'Plan '+inr(y.plan.rev),rv,false,(y.actual.rev-y.ly.rev)/y.ly.rev)}
    ${kpi('Ad-Spend · '+y.label,inr(y.actual.spend),'Budget '+inr(y.plan.spend),sv,true,(y.actual.spend-y.ly.spend)/y.ly.spend,true)}
    ${kpi('Blended ROAS · '+y.label,roasA.toFixed(2)+'x','Plan '+roasP.toFixed(2)+'x',(roasA-roasP)/roasP,false,(roasA-y.ly.roas)/y.ly.roas)}
  </div>`;
  const gFY=`<div class="grid g4">
    ${kpi('FY units (run-rate)',num(pjU.fy),'Plan '+num(D.plan.fy.units),(pjU.fy-D.plan.fy.units)/D.plan.fy.units,false)}
    ${kpi('FY revenue (run-rate)',inr(pjR.fy),'Plan '+inr(D.plan.fy.rev),(pjR.fy-D.plan.fy.rev)/D.plan.fy.rev,false)}
    ${kpi('ASP · '+y.label,'₹'+Math.round(aspA),'Plan ₹'+Math.round(y.plan.rev/y.plan.units),(aspA-y.plan.rev/y.plan.units)/(y.plan.rev/y.plan.units),false,(aspA-aspLY)/aspLY)}
    ${kpi('FBA mix · '+y.label,fbaPct+'%','MFN '+num(fba.MFN||0)+' units',0,false)}
  </div>`;
  return `
  ${D.hero?`<div class="card" style="background:linear-gradient(135deg,#04342C,#0F6E56);color:#fff;border:none;margin-bottom:14px">
    <div style="font-size:13px;font-weight:600;color:#9FE1CB;margin-bottom:10px">★ Headline story — record ad efficiency</div>
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">${D.hero.pts.map((p,i)=>`${i?'<span style="color:#5DCAA5">→</span>':''}<span style="font-size:12px;color:#9FE1CB">${p[0]}</span><span style="font-size:26px;font-weight:700">${p[1].toFixed(2)}x</span>`).join('')}<span style="font-size:12px;color:#9FE1CB;margin-left:8px">blended ROAS</span></div>
    <div style="font-size:12.5px;color:#E1F5EE;margin-top:10px;line-height:1.6">${D.hero.sub}</div>
  </div>`:''}
  <div style="font-size:11px;color:var(--mut);margin-bottom:6px">${view==='fy'?'Full-year run-rate projection ('+y.label+' pace applied to plan)':y.label+' actual vs plan vs 2025'}</div>
  ${view==='fy'?gFY:gYTD}
  <div style="margin-top:12px">${view==='fy'?gYTD:gFY}</div>
  <h3 class="sec">2026 YTD trends — vs plan &amp; vs 2025</h3>
  <div class="card" style="padding:0;overflow:hidden">${trendsTbl()}</div>
  <div class="note">YTD = ${D.ytd_lbl} 2026 (tax-report basis${D.prov_note?'; '+D.prov_note:''}). “% achieved” = actual vs plan; “vs 2025” = same months last year. For ad-spend, spending under budget / under last year is favourable (shown green).</div>
  <h3 class="sec">🚀 Top 5 stories</h3>
  <div class="stories">
    <div><span class="n">1</span><span>Volume keeps growing — ${y.label} units ${pct((y.actual.units-y.ly.units)/y.ly.units)} vs last year (${num(y.actual.units)} vs ${num(y.ly.units)}).</span></div>
    <div><span class="n">2</span><span>Ad efficiency is the standout: blended ROAS ${roasA.toFixed(2)}x, ${pct((roasA-y.ly.roas)/y.ly.roas)} vs 2025, on ad-spend ${pct((y.actual.spend-y.ly.spend)/y.ly.spend)} YoY.</span></div>
    <div><span class="n">3</span><span>${D.months[D.n_done-2]}–${D.months[D.n_done-1]} ad-spend was ${inr(D.actual.spend[D.n_done-2])} / ${inr(D.actual.spend[D.n_done-1])}, for blended ROAS of ${D.actual.roas[D.n_done-2].toFixed(2)}x / ${D.actual.roas[D.n_done-1].toFixed(2)}x.</span></div>
    <div><span class="n">4</span><span>Revenue is the watch area — ${pct((y.actual.rev-y.ly.rev)/y.ly.rev)} vs 2025 as ASP eases to ₹${Math.round(aspA)} (LY ₹${Math.round(aspLY)}).</span></div>
    <div><span class="n">5</span><span>${(()=>{const g=D.actual.units.slice(0,D.n_done).map((a,i)=>[i,a/D.plan.units[i]-1]).sort((x,z)=>x[1]-z[1])[0];return `Against an ambitious plan, units track ${pct(uv)} year to date; the biggest gap is ${D.months[g[0]]} (${pct(g[1])} vs plan${(D.part_month&&D.part_month.idx===g[0])?', month in progress':''}).`})()}</span></div>
  </div>
  <h3 class="sec">Monthly units — actual vs plan vs 2025</h3>
  <div class="card"><div class="chartbox"><canvas id="cU"></canvas></div><div class="note">Dashed = plan · bars = actual (${D.ytd_lbl}${D.prov_note?'; latest month on fulfilment basis':''}) · grey = 2025. Coral bar = below plan.</div></div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3 class="sec" style="margin-top:0">Monthly revenue — actual vs plan vs 2025</h3><div class="chartbox"><canvas id="cR"></canvas></div></div>
    <div class="card"><h3 class="sec" style="margin-top:0">Blended ROAS — actual vs plan vs 2025</h3><div class="chartbox"><canvas id="cRoas"></canvas></div></div>
  </div>
  <div class="sowhat"><b>So what?</b> Through ${y.label}: healthy volume (${pct((y.actual.units-y.ly.units)/y.ly.units)} YoY) and much stronger ad efficiency (blended ROAS ${pct((roasA-y.ly.roas)/y.ly.roas)} YoY) — profit is protected as spend is cut. The watch item is revenue/ASP vs last year; defending price realisation and the summer SKUs re-closes the gap to an aggressive plan.</div>`;
}

function table(cols,rows,totalRow,id){
  let h='<table><thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';
  h+=rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
  if(totalRow)h+='<tr class="tot">'+totalRow.map(c=>`<td>${c}</td>`).join('')+'</tr>';
  h+='</tbody></table>';
  return h;
}

function trendsTbl(){
  const y=D.ytd;
  const aspA=y.actual.rev/y.actual.units, aspP=y.plan.rev/y.plan.units, aspLY=y.ly.rev/y.ly.units;
  const clr=(v,inv)=>{const good=inv?(v<=0):(v>=0);return `<span style="color:${good?'var(--green)':'var(--red)'};font-weight:600">${pct(v)}</span>`;};
  const R=[
    ['Units',num(y.actual.units),num(y.plan.units),y.actual.units/y.plan.units-1,num(y.ly.units),y.actual.units/y.ly.units-1,false],
    ['Revenue',inr(y.actual.rev),inr(y.plan.rev),y.actual.rev/y.plan.rev-1,inr(y.ly.rev),y.actual.rev/y.ly.rev-1,false],
    ['Ad-Spend',inr(y.actual.spend),inr(y.plan.spend),y.actual.spend/y.plan.spend-1,inr(y.ly.spend),y.actual.spend/y.ly.spend-1,true],
    ['Blended ROAS',y.actual.roas.toFixed(2)+'x',y.plan.roas.toFixed(2)+'x',y.actual.roas/y.plan.roas-1,y.ly.roas.toFixed(2)+'x',y.actual.roas/y.ly.roas-1,false],
    ['ASP','₹'+Math.round(aspA),'₹'+Math.round(aspP),aspA/aspP-1,'₹'+Math.round(aspLY),aspA/aspLY-1,false]
  ];
  let h='<table><thead><tr><th>Metric</th><th>2026 YTD</th><th>Plan (YTD)</th><th>% achieved</th><th>2025 YTD</th><th>vs 2025</th></tr></thead><tbody>';
  h+=R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${clr(r[3],r[6])}</td><td>${r[4]}</td><td>${clr(r[5],r[6])}</td></tr>`).join('');
  h+='</tbody></table>';
  return h;
}

function tplCategory(){
  const C=D.category_int,A=C.active,g=C.grand;
  _draw=()=>{barChart('cCat',A.map(p=>p.segment),A.map(p=>p.revenue),true);};
  const yoyc=x=>{const c=x>=0?'var(--green)':'var(--red)';return `<span style="color:${c};font-weight:600">${pct(x)}</span>`;};
  const rows=A.map(p=>[p.segment,num(p.units),(p.units/g.units*100).toFixed(1)+'%',inr(p.revenue),(p.revenue/g.revenue*100).toFixed(1)+'%',num(p.ly_units),p.ly_units?yoyc(p.units/p.ly_units-1):'—']);
  const top=A[0];
  return `
  <h3 class="sec">${C.window} revenue by internal category</h3>
  <div class="card"><div class="chartbox"><canvas id="cCat"></canvas></div></div>
  <h3 class="sec">Category performance — active business</h3>
  <div class="card" style="padding:0;overflow:hidden">
  ${table(['Internal category','Units','% units','Revenue','% rev','2025','YoY'],rows,['Total (active)',num(g.units),'100%',inr(g.revenue),'100%',num(g.ly_units),yoyc(g.units/g.ly_units-1)])}
  </div>
  <div class="note">Internal segmentation (catalog), active business only — Discontinued (${C.excluded.Discontinued||0} units) & gifting excluded; dual categories rolled to dominant parent. Same MTR basis as the headline (latest month: order report).</div>
  <div class="sowhat"><b>So what?</b> ${top.segment} leads at ${(top.revenue/g.revenue*100).toFixed(0)}% of active category revenue. ${A[0].segment}${A[1]?' and '+A[1].segment:''} anchor the portfolio; align Big-Bet and stock focus to the categories with strongest YoY momentum.</div>`;
}
function tplBigBets(){
  const bb=D.big_bets_focus, sel=bb.filter(b=>b.sel);
  const s25=sel.reduce((x,b)=>x+b.h1_2025,0),s26=sel.reduce((x,b)=>x+b.h1_2026,0);
  const sjul=sel.reduce((x,b)=>x+b.jul,0),saug=sel.reduce((x,b)=>x+b.aug,0),sfy=sel.reduce((x,b)=>x+b.fy,0);
  const t25=bb.reduce((x,b)=>x+b.h1_2025,0),t26=bb.reduce((x,b)=>x+b.h1_2026,0),tjul=bb.reduce((x,b)=>x+b.jul,0),taug=bb.reduce((x,b)=>x+b.aug,0),tfy=bb.reduce((x,b)=>x+b.fy,0);
  const yoyc=x=>(x===null||x===undefined)?'—':`<span style="color:${x>=0?'var(--green)':'var(--red)'};font-weight:600">${pct(x)}</span>`;
  const rowsHtml=bb.map(b=>`<tr class="${b.sel?'bbsel':''}"><td>${b.rank}</td><td style="text-align:left;font-family:ui-monospace,monospace;font-size:11px">${b.asin}</td><td style="text-align:left">${b.color}</td><td style="text-align:left">${b.sub}</td><td>${num(b.h1_2025)}</td><td>${num(b.h1_2026)}</td><td>${yoyc(b.yoy)}</td><td>${num(b.fy)}</td><td>${num(b.jul)}</td><td>${num(b.aug)}</td><td><span class="chip ${b.status==='At Risk'?'risk':'ontrack'}">${b.status}</span></td></tr>`).join('');
  return `
  <div class="grid g4">
    ${kpi('Selected Big Bets',sel.length,'of '+bb.length+' shortlisted (green)',0,false)}
    ${kpi('Selected 2026 YTD units',num(s26),'2025 YTD '+num(s25),0,false,s25?(s26/s25-1):0)}
    ${kpi('Selected FY target',num(sfy),'full-year plan units',0,false)}
    ${kpi((D.rec_lbl||['Next','Next+1']).join(' + ')+' rec. stock',num(sjul+saug),'selected · per sales plan',0,false)}
  </div>
  <div class="sowhat" style="margin-top:14px"><b>The stock angle:</b> the 10 selected Big Bets (green) carry ${s25?pct(s26/s25-1):'—'} ${D.ytd_lbl} volume vs last year. The recommended <b>${num(sjul+saug)} units of ${(D.rec_lbl||['next month','the month after']).join(' + ')} FBA stock</b> (per the 2026 sales plan) convert efficiency into volume where it counts most.</div>
  <h3 class="sec">Top 30 Big-Bet shortlist — ASIN &amp; colour level, ${D.ytd_lbl} <span style="font-size:11px;color:var(--mut)">(green = Top 10 selected per the big-bet plan)</span> <button class="csv" onclick="exportBB()">⬇ CSV</button></h3>
  <div class="card" style="padding:0;overflow-x:auto">
  <table><thead><tr><th>#</th><th>ASIN</th><th>Colour</th><th>Product</th><th>2025 ${D.ytd_lbl}</th><th>2026 ${D.ytd_lbl}</th><th>YoY</th><th>FY target</th><th>${(D.rec_lbl||['Next'])[0]} rec.</th><th>${(D.rec_lbl||['','Next+1'])[1]} rec.</th><th>Status</th></tr></thead><tbody>
  ${rowsHtml}
  <tr class="tot"><td></td><td style="text-align:left">Total — all 30</td><td></td><td></td><td>${num(t25)}</td><td>${num(t26)}</td><td>${yoyc(t25?(t26/t25-1):null)}</td><td>${num(tfy)}</td><td>${num(tjul)}</td><td>${num(taug)}</td><td></td></tr>
  </tbody></table></div>
  <div class="note">ASIN / colour level, all 30 shortlisted Big Bets; <b>green rows = the Top 10 selected</b> per the big-bet plan (BB Score). <b>2025 / 2026 = actual ${D.ytd_lbl} shipments</b> (2026: MTR basis${D.prov_note?', latest month fulfilment report':''}). FY target = full-year plan units; <b>${(D.rec_lbl||['Next','Next+1']).join(' / ')} rec. = units recommended per the 2026 sales plan</b> (FBA cover). Ranks, selection &amp; FY targets tie to the Big Bets Focus plan sheet.</div>`;
}

function tplAds(){
  _draw=()=>{planActualChart('aS',D.plan.spend,D.actual.spend,v=>inr(v),D.ly_2025.spend,true);planActualChart('aR',D.plan.roas,D.actual.roas,v=>v.toFixed(1)+'x',D.ly_2025.roas);};
  const y=D.ytd,sv=(y.actual.spend-y.plan.spend)/y.plan.spend,roasA=y.actual.roas;
  return `
  <div class="grid g4">
    ${kpi('Ad-Spend · '+y.label,inr(y.actual.spend),'Budget '+inr(y.plan.spend),sv,true,(y.actual.spend-y.ly.spend)/y.ly.spend,true)}
    ${kpi('FY ad-budget',inr(D.plan.fy.spend),'−22% vs 2025',0,false)}
    ${kpi('Blended ROAS · '+y.label,roasA.toFixed(2)+'x','Plan '+y.plan.roas.toFixed(2)+'x',(roasA-y.plan.roas)/y.plan.roas,false,(roasA-y.ly.roas)/y.ly.roas)}
    ${kpi('Latest-month ROAS',D.actual.roas[D.n_done-1].toFixed(2)+'x',D.months[D.n_done-1]+' · '+D.months[D.n_done-2]+' '+D.actual.roas[D.n_done-2].toFixed(2)+'x',0,false)}
  </div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3 class="sec" style="margin-top:0">Monthly ad-spend — actual vs budget vs 2025</h3><div class="chartbox"><canvas id="aS"></canvas></div><div class="note">Teal = at or under budget (efficient spend); coral = over budget. Lower spend at healthy ROAS is favourable.</div></div>
    <div class="card"><h3 class="sec" style="margin-top:0">Blended ROAS — actual vs plan vs 2025</h3><div class="chartbox"><canvas id="aR"></canvas></div></div>
  </div>
  <div class="sowhat"><b>So what?</b> The leaner-ad-year plan (₹38.1L, −22%) is being beaten on efficiency — ${y.label} ad-spend ${pct((y.actual.spend-y.ly.spend)/y.ly.spend)} vs 2025 at blended ROAS ${roasA.toFixed(2)}x (${pct((roasA-y.ly.roas)/y.ly.roas)} YoY). The opportunity: redeploy part of that saving into the at-risk Big-Bet SKUs to defend revenue — granular SP/SB/SD targeting decisions run in the weekly cycle.</div>
  ${D.ads_june?`<h3 class="sec">${D.ads_june.month.split(' ')[0]} — true ad-ROAS by internal category <span style="font-size:11px;color:var(--mut)">(ad-attributed · from Ads Deep-Dive)</span><a href="${D.ads_june.url}" target="_blank" rel="noopener" style="float:right;font-size:12px;font-weight:600;color:#04342C;background:var(--teal);border-radius:8px;padding:5px 12px;text-decoration:none">Open Ads Deep-Dive ↗</a></h3>
  <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Category</th><th>Ad-spend</th><th>Ad-sales</th><th>True ad-ROAS</th></tr></thead><tbody>${D.ads_june.segments.map(x=>`<tr><td>${x.segment}</td><td>${inr(x.spend)}</td><td>${inr(x.sales)}</td><td><span style="font-weight:600;color:${x.roas>=3?'var(--green)':(x.roas>=1?'var(--amber)':'var(--red)')}">${x.roas.toFixed(2)}x</span></td></tr>`).join('')}<tr class="tot"><td>Total — all ${D.ads_june.seg_count} categories (SP+SD+SB)</td><td>${inr(D.ads_june.overview.spend)}</td><td>${inr(D.ads_june.overview.sales)}</td><td>${D.ads_june.overview.roas.toFixed(2)}x</td></tr></tbody></table></div>
  <div class="note">Top 8 of ${D.ads_june.seg_count} categories by ad-spend; total reflects all SP+SD+SB. ${D.ads_june.note} True ad-ROAS = 14-day attributed ad-sales ÷ ad-spend (${D.ads_june.overview.roas.toFixed(2)}x) — distinct from the blended ROAS above. Full ASIN/keyword detail → <a href="${D.ads_june.url}" target="_blank" rel="noopener" style="color:var(--teal-d);font-weight:600">Ads Deep-Dive dashboard</a>.</div>`:''}
  ${D.ads_may?`<h3 class="sec">May — true ad-ROAS by segment <span style="font-size:11px;color:var(--mut)">(ad-attributed · from Ads Deep-Dive)</span>${D.ads_may.url?`<a href="${D.ads_may.url}" target="_blank" rel="noopener" style="float:right;font-size:12px;font-weight:600;color:#04342C;background:var(--teal);border-radius:8px;padding:5px 12px;text-decoration:none">Open Ads Deep-Dive ↗</a>`:''}</h3>
  <div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>Segment</th><th>Ad-spend</th><th>Ad-sales</th><th>True ad-ROAS</th></tr></thead><tbody>${D.ads_may.segments.map(x=>`<tr><td>${x.segment}</td><td>${inr(x.spend)}</td><td>${inr(x.sales)}</td><td><span style="font-weight:600;color:${x.roas>=3?'var(--green)':(x.roas>=1?'var(--amber)':'var(--red)')}">${x.roas.toFixed(2)}x</span></td></tr>`).join('')}<tr class="tot"><td>Total — all ${D.ads_may.seg_count} segments (SP+SD+SB)</td><td>${inr(D.ads_may.overview.spend)}</td><td>${inr(D.ads_may.overview.sales)}</td><td>${D.ads_may.overview.roas.toFixed(2)}x</td></tr></tbody></table></div>

}

function tplGeo(){
  const z=D.geography.zones,zg=D.geography.zones_grand,s=D.geography.states,sg=D.geography.states_grand,c=D.geography.cities,cg=D.geography.cities_grand;
  _draw=()=>{barChart('cZone',z.map(x=>x.name),z.map(x=>x.revenue),false);};
  const zr=z.map(x=>[x.name,num(x.units),inr(x.revenue),(x.revenue/zg.revenue*100).toFixed(1)+'%']);
  const sr=s.map(x=>[x.name,num(x.units),inr(x.revenue),(x.revenue/sg.revenue*100).toFixed(1)+'%']);
  const cr=c.map(x=>[x.name,num(x.units),inr(x.revenue),(x.revenue/cg.revenue*100).toFixed(1)+'%']);
  return `
  <h3 class="sec">YTD 2026 (${D.ytd_lbl}) revenue by zone</h3>
  <div class="card"><div class="chartbox"><canvas id="cZone"></canvas></div></div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card" style="padding:0;overflow:hidden"><h3 class="sec" style="margin:14px 18px 0">Top states <button class="csv" onclick="exportGeo('states')">⬇</button></h3>${table(['State','Units','Revenue','% rev'],sr,['Total',num(sg.units),inr(sg.revenue),'100%'])}</div>
    <div class="card" style="padding:0;overflow:hidden"><h3 class="sec" style="margin:14px 18px 0">Top cities <button class="csv" onclick="exportGeo('cities')">⬇</button></h3>${table(['City','Units','Revenue','% rev'],cr,['Total',num(cg.units),inr(cg.revenue),'100%'])}</div>
  </div>
  <div class="note">MTR shipment basis · top ${s.length} states / ${c.length} cities shown; totals reflect all.</div>
  <div class="sowhat"><b>So what?</b> Demand concentrates in a handful of metros and states — a focused regional FBA placement and city-level ad emphasis there protects fulfillment speed where the volume actually is.</div>`;
}

function dl(name,rows){const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();}
function exportCat(){const g=D.category.grand;dl('gluman_category_q1.csv',[['Product type','Units','% units','Revenue','% rev'],...D.category.product_types.map(p=>[p.name,p.units,(p.units/g.units*100).toFixed(1),p.revenue,(p.revenue/g.revenue*100).toFixed(1)])]);}
function exportBB(){dl('gluman_bigbets_top30.csv',[['Rank','ASIN','Colour','Product','2025 '+D.ytd_lbl,'2026 '+D.ytd_lbl,'FY target',(D.rec_lbl||['Next'])[0]+' rec stock',(D.rec_lbl||['','Next+1'])[1]+' rec stock','Selected','Status'],...D.big_bets_focus.map(b=>[b.rank,b.asin,b.color,b.sub,b.h1_2025,b.h1_2026,b.fy,b.jul,b.aug,(b.sel?'YES':'NO'),b.status])]);}
function exportGeo(k){const d=D.geography[k];dl('gluman_'+k+'.csv',[['Name','Units','Revenue'],...d.map(x=>[x.name,x.units,x.revenue])]);}
</script>
