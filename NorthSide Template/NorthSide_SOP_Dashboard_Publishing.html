<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Metropolis,Arial,Helvetica,sans-serif;background:#020202;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.gate{text-align:center;padding:40px;max-width:400px;width:100%}
.gate img{height:40px;margin-bottom:28px}
.gate h1{font-size:18px;font-weight:700;margin-bottom:6px}

.gate input:focus{border-color:#1CBFBB}
.gate button{margin-top:12px;width:100%;padding:12px;border:none;border-radius:10px;background:#1CBFBB;color:#020202;font-weight:700;font-size:14px;cursor:pointer}
.gate .err{color:#E2635C;font-size:12.5px;margin-top:10px;min-height:16px}
.gate .foot{color:#5f6469;font-size:11px;margin-top:26px}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC_SALT),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC_IV)},key,b64(ENC_DATA));
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(e){err.textContent='Incorrect password — try again.';}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
