const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryDecrypt(pw){
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC_SALT),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC_IV)},key,b64(ENC_DATA));
    return new TextDecoder().decode(plain);
  }catch(e){return null;}
}
function remember(pw){try{sessionStorage.setItem('nsTeamPass',pw);}catch(e){}}
function recall(){try{return sessionStorage.getItem('nsTeamPass');}catch(e){return null;}}
function forget(){try{sessionStorage.removeItem('nsTeamPass');}catch(e){}}
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='';
  const html=await tryDecrypt(pw);
  if(html){remember(pw);document.open();document.write(html);document.close();}
  else{err.textContent='Incorrect password — try again.';}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
(async()=>{
  const saved=recall();
  if(!saved)return;
  const err=document.getElementById('err');
  err.textContent='Opening from your session…';
  const html=await tryDecrypt(saved);
  if(html){document.open();document.write(html);document.close();}
  else{forget();err.textContent='';}
})();
</script>
