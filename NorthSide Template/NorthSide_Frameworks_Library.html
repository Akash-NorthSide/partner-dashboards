.gate{text-align:center;padding:40px;max-width:400px;width:100%}

.gate .err{color:#E2635C;font-size:12.5px;margin-top:10px;min-height:16px}
.gate .foot{color:#5f6469;font-size:11px;margin-top:26px}

async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

}
