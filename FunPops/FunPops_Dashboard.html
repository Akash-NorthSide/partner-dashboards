<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta http-equiv="X-Robots-Tag" content="noindex, nofollow">
<title>FunPops — All Platforms Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ns-teal:#1CBFBB;--ns-teal-dark:#18A6A3;--ns-teal-bg:#E6FAF9;--ns-dark:#1a1a1a;--ns-gray:#6b6b6b;--ns-bg:#f8f9fa;--ns-border:#e5e7eb;--blinkit:#F5C518;--instamart:#FC8019;--amazon:#FF9900;--bigbasket:#8BC34A;--zepto:#6C2DC7;--infino-zero:#16A34A;--roas-green:#15803d;--roas-amber:#d97706;--roas-red:#dc2626;--na-bg:#fafafa;--na-text:#9ca3af;--up:#15803d;--down:#dc2626;--flat:#6b7280}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--ns-bg);color:var(--ns-dark);line-height:1.5}
.header{background:linear-gradient(135deg,#020202 0%,#1a1a1a 100%);color:#fff;padding:20px 30px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:20px}
.header img{height:42px}
.header h1{font-size:22px;font-weight:600}
.header .subtitle{color:#b3b3b3;font-size:13px;margin-top:4px}
.container{max-width:1400px;margin:0 auto;padding:24px 30px}
.filter-bar{background:#fff;padding:14px 18px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;border:1px solid var(--ns-border)}
.filter-bar label{font-size:13px;font-weight:500;color:var(--ns-gray);margin-right:6px}
.filter-bar select{padding:7px 12px;border:1px solid var(--ns-border);border-radius:6px;font-size:13px;background:#fff;cursor:pointer}
.filter-bar select:focus{outline:2px solid var(--ns-teal)}
.period-toggle{display:inline-flex;background:#f3f4f6;border:1px solid var(--ns-border);border-radius:8px;padding:3px;gap:2px}
.period-btn{padding:6px 14px;background:none;border:none;font-size:12px;font-weight:500;color:var(--ns-gray);cursor:pointer;border-radius:6px;white-space:nowrap}
.period-btn:hover{color:var(--ns-dark)}
.period-btn.active{background:var(--ns-teal);color:#fff}
.reset-btn{background:#f3f4f6;border:1px solid var(--ns-border);padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--ns-gray)}
.reset-btn:hover{background:#e5e7eb}
.date-text{font-size:12px;color:var(--ns-gray);margin-left:auto}
.tab-nav{display:flex;gap:4px;border-bottom:2px solid var(--ns-border);margin-bottom:24px;overflow-x:auto}
.tab-btn{padding:12px 20px;background:none;border:none;font-size:14px;font-weight:500;color:var(--ns-gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab-btn:hover{color:var(--ns-dark)}
.tab-btn.active{color:var(--ns-teal);border-bottom-color:var(--ns-teal)}
.tab-btn.iz-tab.active{color:var(--infino-zero);border-bottom-color:var(--infino-zero)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* HEADLINE INSIGHT BANNER */
.insight-banner{background:linear-gradient(95deg,var(--ns-teal-bg) 0%,#fff 100%);border-left:5px solid var(--ns-teal);padding:14px 18px 14px 22px;border-radius:8px;margin-bottom:22px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.insight-icon{font-size:24px;line-height:1}
.insight-text{flex:1;font-size:14px;color:var(--ns-dark);line-height:1.55}
.insight-text strong{color:var(--ns-teal-dark);font-weight:700}

/* KPI CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.kpi-card{background:#fff;padding:14px 16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid var(--ns-teal);min-height:96px;display:flex;flex-direction:column;justify-content:center;position:relative}
.kpi-card.blinkit{border-left-color:var(--blinkit)}
.kpi-card.instamart{border-left-color:var(--instamart)}
.kpi-card.amazon{border-left-color:var(--amazon)}
.kpi-card.bigbasket{border-left-color:var(--bigbasket)}
.kpi-card.zepto{border-left-color:var(--zepto)}
.kpi-card.infino-zero{border-left-color:var(--infino-zero)}
.kpi-card.unavailable{background:var(--na-bg);border-left-color:var(--na-text)}
.kpi-card.unavailable .kpi-value{color:var(--na-text);font-size:22px;font-weight:500}
.kpi-label{font-size:10.5px;color:var(--ns-gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.kpi-value{font-size:22px;font-weight:700;color:var(--ns-dark)}
.kpi-sub{font-size:11px;color:var(--ns-gray);margin-top:3px}

/* MoM badges */
.mom-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.2px;vertical-align:middle;line-height:1.4}
.mom-badge.up{background:#DCFCE7;color:var(--up)}
.mom-badge.down{background:#FEE2E2;color:var(--down)}
.mom-badge.flat{background:#F3F4F6;color:var(--flat)}
.mom-badge.new{background:var(--ns-teal-bg);color:var(--ns-teal-dark)}

.roas-green{color:var(--roas-green);font-weight:600}
.roas-amber{color:var(--roas-amber);font-weight:600}
.roas-red{color:var(--roas-red);font-weight:600}

.section-title{font-size:16px;font-weight:600;margin:28px 0 12px;color:var(--ns-dark);display:flex;align-items:center;gap:8px}
.section-title::before{content:'';display:inline-block;width:4px;height:18px;background:var(--ns-teal);border-radius:2px}

.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:#fff;padding:18px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--ns-dark)}
.chart-card .chart-sub{font-size:11px;color:var(--ns-gray);margin-bottom:8px;font-style:italic}
.chart-container{position:relative;height:280px}

.table-card{background:#fff;padding:18px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:18px;overflow-x:auto}
.table-card h3{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.table-card .csv-btn{background:var(--ns-teal);color:#fff;border:none;padding:5px 12px;border-radius:4px;font-size:11px;cursor:pointer}
.table-card .csv-btn:hover{background:var(--ns-teal-dark)}
.table-card .table-note{font-size:11px;color:var(--ns-gray);margin-bottom:10px;font-style:italic}
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{text-align:center;padding:9px 8px}
table th{background:#f9fafb;border-bottom:2px solid var(--ns-border);font-weight:600;color:var(--ns-gray);text-transform:uppercase;font-size:11px;letter-spacing:.3px}
table td{border-bottom:1px solid #f3f4f6}
table td.left,table th.left{text-align:left}
table tr:hover td{background:#f9fafb}
table tr.total-row{background:#F0FDFA;font-weight:600;border-top:2px solid var(--ns-teal)}
table tr.total-row td{border-bottom:none;color:var(--ns-dark);padding:11px 8px}
table tr.total-row td:first-child{color:var(--ns-teal-dark);font-weight:700}

.empty-state{text-align:center;padding:40px 20px;color:var(--ns-gray);font-size:13px;background:#fafafa;border-radius:6px;border:1px dashed var(--ns-border)}
.data-note{background:#EFF8FE;border-left:4px solid #0284c7;padding:12px 16px;border-radius:6px;font-size:13px;color:#075985;margin:16px 0}
.data-note strong{color:#0c4a6e}

/* TOP 5 STORIES STRIP */
.stories-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}
.story-card{background:#fff;padding:14px 14px 16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-top:3px solid var(--ns-teal);position:relative;display:flex;flex-direction:column;gap:6px}
.story-card.win{border-top-color:var(--up)}
.story-card.opp{border-top-color:#0284c7}
.story-card.launch{border-top-color:var(--infino-zero)}
.story-card.geo{border-top-color:var(--ns-teal)}
.story-card.metric{border-top-color:var(--blinkit)}
.story-icon{font-size:22px;line-height:1}
.story-title{font-size:12px;font-weight:700;color:var(--ns-gray);text-transform:uppercase;letter-spacing:.5px}
.story-body{font-size:13px;color:var(--ns-dark);line-height:1.5;font-weight:500}
.story-body strong{color:var(--ns-teal-dark)}

.footer{text-align:center;padding:28px;color:var(--ns-gray);font-size:12px;background:#fff;border-top:1px solid var(--ns-border);margin-top:40px}
.platform-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.platform-card{background:#fff;padding:18px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-top:4px solid var(--ns-teal)}
.platform-card.blinkit{border-top-color:var(--blinkit)}
.platform-card.instamart{border-top-color:var(--instamart)}
.platform-card.amazon{border-top-color:var(--amazon)}
.platform-card.bigbasket{border-top-color:var(--bigbasket)}
.platform-card.zepto{border-top-color:var(--zepto)}
.platform-card.infino-zero{border-top-color:var(--infino-zero)}
.platform-card h4{font-size:13px;font-weight:600;color:var(--ns-gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.platform-card .big-num{font-size:26px;font-weight:700;color:var(--ns-dark)}
.platform-card .sub-line{font-size:12px;color:var(--ns-gray);margin-top:6px}

.password-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#020202 0%,#1a1a1a 100%);display:flex;align-items:center;justify-content:center;z-index:10000}
.password-box{background:#fff;padding:36px 40px;border-radius:10px;text-align:center;max-width:380px}
.password-box img{height:50px;margin-bottom:18px;filter:invert(1)}
.password-box h2{font-size:18px;margin-bottom:8px;color:var(--ns-dark)}
.password-box p{font-size:13px;color:var(--ns-gray);margin-bottom:18px}
.password-box input{width:100%;padding:11px 14px;border:2px solid var(--ns-border);border-radius:6px;font-size:14px;margin-bottom:12px}
.password-box input:focus{outline:none;border-color:var(--ns-teal)}
.password-box button{width:100%;padding:11px;background:var(--ns-teal);color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600}
.password-box button:hover{background:var(--ns-teal-dark)}
.password-error{color:var(--roas-red);font-size:12px;margin-top:8px;display:none}
.platform-pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;letter-spacing:.3px;color:#fff}
.platform-pill.platform-blinkit{background:var(--blinkit);color:#1a1a1a}
.platform-pill.platform-instamart{background:var(--instamart)}
.platform-pill.platform-amazon{background:var(--amazon);color:#1a1a1a}
.platform-pill.platform-bigbasket{background:var(--bigbasket);color:#1a1a1a}
.platform-pill.platform-zepto{background:var(--zepto)}

@media (max-width:1200px){.stories-strip{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1000px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.charts-row,.platform-summary{grid-template-columns:1fr}.stories-strip{grid-template-columns:1fr}}
</style>
</head>

function b64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function deriveKey(p,s){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decryptData(p){
  const k=await deriveKey(p,b64ToBytes(ENC_SALT));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},k,b64ToBytes(ENC_DATA));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryDecrypt(){
  const pwField=document.getElementById('pwdInput');
  const pw=pwField.value.trim();
  if(!pw){document.getElementById('pwdError').style.display='block';return;}
  try{
    D=await decryptData(pw);
    pwField.value='';
    document.getElementById('passwordOverlay').style.display='none';
    document.getElementById('dashboard').style.display='block';
    initDashboard();
  }catch(e){
    D=null;
    document.getElementById('pwdError').style.display='block';
    pwField.value='';pwField.focus();
  }
}

// ===== FORMATTING =====
function fmtINR(v){if(v===null||v===undefined||!isFinite(v)||isNaN(v))return'—';if(v===0)return'₹0';const s=v<0?'-₹':'₹';v=Math.abs(v);if(v>=10000000)return s+(v/10000000).toFixed(2)+'Cr';if(v>=100000)return s+(v/100000).toFixed(2)+'L';if(v>=1000)return s+(v/1000).toFixed(1)+'K';return s+Math.round(v).toLocaleString('en-IN');}
function fmtNum(v){if(v===null||v===undefined||!isFinite(v)||isNaN(v))return'—';return Math.round(v).toLocaleString('en-IN');}
function fmtPct(v){if(v===null||v===undefined||!isFinite(v)||isNaN(v))return'—';return v.toFixed(1)+'%';}
function safeDiv(a,b){return b>0?a/b:0;}
function fmtRoas(v){if(v===null||v===undefined||!isFinite(v)||isNaN(v))return'<span class="roas-red">—</span>';const t=v.toFixed(2)+'x';if(v===0)return'<span class="roas-red">0x</span>';if(v>=3)return'<span class="roas-green">'+t+'</span>';if(v>=1)return'<span class="roas-amber">'+t+'</span>';return'<span class="roas-red">'+t+'</span>';}
function cleanCSV(t){return String(t).replace(/[₹,]/g,'').replace(/Cr/g,'0000000').replace(/L/g,'00000').replace(/K/g,'000').replace(/x/g,'').replace(/<[^>]+>/g,'');}
function exportCSV(tableId){
  const t=document.getElementById(tableId);if(!t)return;
  const rows=[];
  t.querySelectorAll('tr').forEach(r=>{const cells=[];r.querySelectorAll('th,td').forEach(c=>cells.push('"'+cleanCSV(c.textContent).replace(/"/g,'""')+'"'));rows.push(cells.join(','));});
  const blob=new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=tableId+'.csv';link.click();
}

// ===== MoM BADGE =====
function fmtMoM(monthly, key, invert){
  // Returns a small badge showing MoM% — for "invert" metrics (cpc, cpm), lower is better
  if(!monthly||monthly.length<2)return '';
  // Find last 2 NON-ZERO months for fairer comparison
  const nonZero = monthly.filter(m => (m[key]||0) > 0);
  if(nonZero.length<2) return '<span class="mom-badge new" title="Insufficient prior data">NEW</span>';
  const cur = nonZero[nonZero.length-1][key];
  const prev = nonZero[nonZero.length-2][key];
  if(prev===0) return '<span class="mom-badge new">NEW</span>';
  const delta = ((cur-prev)/prev)*100;
  if(Math.abs(delta)<0.5) return '<span class="mom-badge flat">FLAT</span>';
  const isUp = delta>0;
  const cls = invert ? (isUp?'down':'up') : (isUp?'up':'down');
  const arrow = isUp?'↑':'↓';
  return '<span class="mom-badge '+cls+'" title="vs prior month">'+arrow+Math.abs(delta).toFixed(0)+'%</span>';
}

function getPeriodMonths(){
  if(currentPeriod==='apr_may') return ['2026-07','2026-08'];
  if(currentPeriod==='this_month') return ['2026-08'];
  return null; // ytd / all
}
function filterMonthly(arr){
  if(currentMonth!=='all') return arr.filter(m=>m.month===currentMonth);
  const allowed=getPeriodMonths();
  return allowed?arr.filter(m=>allowed.includes(m.month)):arr;
}
function setPeriod(p, btn){
  currentPeriod=p;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // Reset month sub-filter when period changes (avoid stale combos)
  document.getElementById('monthFilter').selectedIndex=0;
  currentMonth='all';
  renderAll();
}

function recompute(block){
  const am=filterMonthly(block.ads.monthly||[]);
  const sm=filterMonthly(block.sales.monthly||[]);
  const gmv=sm.reduce((s,m)=>s+(m.gmv||0),0);
  const units=sm.reduce((s,m)=>s+(m.units||0),0);
  const spend=am.reduce((s,m)=>s+(m.spend||0),0);
  const revenue=am.reduce((s,m)=>s+(m.revenue||0),0);
  const impressions=am.reduce((s,m)=>s+(m.impressions||0),0);
  const clicks=am.reduce((s,m)=>s+(m.clicks||0),0);
  const atc=am.reduce((s,m)=>s+(m.atc||0),0);
  const orders=am.reduce((s,m)=>s+(m.orders||0),0);
  return{gmv,units,spend,revenue,impressions,clicks,atc,orders,sm,am,
    roas:safeDiv(revenue,spend),cpm:safeDiv(spend*1000,impressions),
    cpc:clicks>0?safeDiv(spend,clicks):null,broas:safeDiv(gmv,spend),
    smRaw:block.sales.monthly||[], amRaw:block.ads.monthly||[]};
}

function switchTab(id,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}
function applyFilters(){currentMonth=document.getElementById('monthFilter').value;renderAll();}
function resetFilters(){document.getElementById('monthFilter').selectedIndex=0;currentMonth='all';currentPeriod='ytd';document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));document.querySelector('.period-btn[data-period="ytd"]').classList.add('active');renderAll();}

// ===== KPI GRID w/ MoM badges =====
function kpiGrid(r,platform,naFor,smRaw,amRaw){
  naFor=naFor||[];const isNA=k=>naFor.indexOf(k)>=0;
  // MoM uses raw (unfiltered) monthly to compare any period selection cleanly
  const mom=(k,inv)=>fmtMoM(k.indexOf('ad_')===0||k==='revenue'||k==='spend'||k==='impressions'||k==='clicks'||k==='atc'||k==='orders'?amRaw:smRaw,k.replace('ad_',''),inv);
  const card=(cls,label,value,sub,momHtml)=>'<div class="kpi-card '+cls+'"><div class="kpi-label"><span>'+label+'</span>'+(momHtml||'')+'</div><div class="kpi-value">'+value+'</div>'+(sub?'<div class="kpi-sub">'+sub+'</div>':'')+'</div>';
  const naCard=(label)=>'<div class="kpi-card unavailable"><div class="kpi-label">'+label+'</div><div class="kpi-value">—</div><div class="kpi-sub">Not tracked by '+platform+'</div></div>';
  return '<div class="kpi-grid">'+
    card(platform.toLowerCase(),'Sales (MRP GMV)',fmtINR(r.gmv),fmtNum(r.units)+' units sold',fmtMoM(smRaw,'gmv'))+
    card('','Ad-Spend',r.spend>0?fmtINR(r.spend):'—','',fmtMoM(amRaw,'spend',true))+
    card('','Ad-Revenue',r.revenue>0?fmtINR(r.revenue):'—','',fmtMoM(amRaw,'revenue'))+
    card('','Ad-ROAS',r.spend>0?fmtRoas(r.roas):'—','','')+
    card('','Blended ROAS',r.spend>0?fmtRoas(r.broas):'—','All sales \u00f7 ad-spend','')+
    card('','Ad-Impressions',r.impressions>0?fmtNum(r.impressions):'—','',fmtMoM(amRaw,'impressions'))+
    card('','Ad-CPM',r.impressions>0?fmtINR(r.cpm):'—','','')+
    (isNA('clicks')?naCard('Ad-Clicks'):card('','Ad-Clicks',r.clicks>0?fmtNum(r.clicks):'—','',fmtMoM(amRaw,'clicks')))+
    (isNA('cpc')?naCard('Ad-CPC'):card('','Ad-CPC',(r.clicks>0&&r.cpc!==null)?fmtINR(r.cpc):'—','',''))+
    (isNA('atc')?naCard('Ad-ATC'):card('','Ad-ATC',r.atc>0?fmtNum(r.atc):'—','',fmtMoM(amRaw,'atc')))+
    (isNA('orders')?naCard('Ad-Orders'):card('','Ad-Orders',r.orders>0?fmtNum(r.orders):'—','',fmtMoM(amRaw,'orders')))+
    card('','Units Sold',r.units>0?fmtNum(r.units):'—','from Sales',fmtMoM(smRaw,'units'))+
    '</div>';
}

// ===== HEADLINE INSIGHT GENERATORS =====
function pName(p){return (D&&D.platforms[p]&&D.platforms[p].meta&&D.platforms[p].meta.platform)||p.charAt(0).toUpperCase()+p.slice(1);}

function periodLabel(){if(currentMonth!=='all'){const o=document.querySelector('#monthFilter option[value="'+currentMonth+'"]');if(o)return o.textContent;}return currentPeriod==='ytd'?'Jan 1 – Aug 13':(currentPeriod==='apr_may'?'Jul 1 – Aug 13':'Aug 1–13');}
function buildSummaryInsight(){
  const platforms=['amazon','blinkit','zepto','bigbasket'];
  const res=platforms.map(p=>({p,r:recompute(D.platforms[p])}));
  const totalGmv=res.reduce((s,o)=>s+o.r.gmv,0);
  const totalSpend=res.reduce((s,o)=>s+o.r.spend,0);
  const totalRev=res.reduce((s,o)=>s+o.r.revenue,0);
  const roas=safeDiv(totalRev,totalSpend);
  const broas=safeDiv(totalGmv,totalSpend);
  // Top platform by GMV
  const topGmv=res.slice().sort((a,b)=>b.r.gmv-a.r.gmv)[0];
  const topGmvShare=safeDiv(topGmv.r.gmv,totalGmv)*100;
  // Top platform by ROAS
  const withSpend=res.filter(o=>o.r.spend>0);
  const topRoas=withSpend.slice().sort((a,b)=>b.r.roas-a.r.roas)[0];

  let sentences=[];
  sentences.push(BRAND_LABEL+' sold <strong>'+fmtINR(totalGmv)+'</strong> ('+periodLabel()+')'+(totalSpend>0?', earning <strong>'+roas.toFixed(2)+'x back on every rupee of ad-spend</strong> ('+broas.toFixed(1)+'x counting all sales)':'')+'.');
  if(topGmv){
    sentences.push('<strong>'+pName(topGmv.p)+'</strong> brings in <strong>'+topGmvShare.toFixed(0)+'% of sales</strong>'+(topRoas&&topRoas.p!==topGmv.p?'; <strong>'+pName(topRoas.p)+'</strong> delivers the strongest ROI at '+topRoas.r.roas.toFixed(2)+'x':'')+'.');
  }
  // Infino Zero callout (positive launch framing)
  if(D.infino_zero){
    const iz=recompute(D.infino_zero.block);
    if(iz.spend>0||iz.gmv>0){
      sentences.push('<strong>Infino Zero</strong> live on Zepto from May 10 — early-stage pilot with '+fmtINR(iz.spend)+' invested across the launch window.');
    }
  }
  return sentences.join(' ');
}
function buildPlatformInsight(p, isIZ){
  const block=isIZ?D.infino_zero.block:D.platforms[p];
  const r=recompute(block);
  const label=isIZ?'Infino Zero on Zepto':pName(p);
  let s=label+' '+(r.gmv>0?'sold <strong>'+fmtINR(r.gmv)+'</strong>':'')+(r.gmv>0&&r.spend>0?' and returned ':'')+(r.spend>0?'<strong>'+r.roas.toFixed(2)+'x on ad-spend</strong> ('+r.broas.toFixed(1)+'x counting all sales)':'')+' in '+periodLabel()+'.';
  // Top product
  if(block.sales&&block.sales.products&&block.sales.products.length){
    const tp=block.sales.products[0];
    const share=safeDiv(tp.gmv,block.sales.products_grand.gmv)*100;
    s+=' Best seller: <strong>'+tp.product+'</strong>, '+share.toFixed(0)+'% of this platform\u2019s sales.';
  }
  // Best ROAS month (positive framing)
  if(r.amRaw&&r.amRaw.length){
    const monthsWithSpend=r.amRaw.filter(m=>m.spend>0);
    if(monthsWithSpend.length){
      const bestRoasMonth=monthsWithSpend.slice().sort((a,b)=>(b.revenue/b.spend)-(a.revenue/a.spend))[0];
      const br=safeDiv(bestRoasMonth.revenue,bestRoasMonth.spend);
      if(br>=1) s+=' Best month for ad efficiency was <strong>'+bestRoasMonth.label+'</strong> at '+br.toFixed(2)+'x.';
    }
  }
  return s;
}
function insightBanner(text){return '<div class="insight-banner"><span class="insight-icon">💡</span><div class="insight-text">'+text+'</div></div>';}

// ===== TOP 5 STORIES (Summary tab) =====
function buildStories(){
  const stories=[];
  const platforms=['amazon','blinkit','zepto','bigbasket'];
  const res=platforms.map(p=>({p,r:recompute(D.platforms[p])}));
  const totalGmv=res.reduce((s,o)=>s+o.r.gmv,0);
  const totalSpend=res.reduce((s,o)=>s+o.r.spend,0);

  // STORY 1: Top platform by GMV
  const topGmv=res.slice().sort((a,b)=>b.r.gmv-a.r.gmv)[0];
  if(topGmv){
    const share=safeDiv(topGmv.r.gmv,totalGmv)*100;
    stories.push({cls:'win',icon:'🚀',title:'Leading Channel',body:'<strong>'+pName(topGmv.p)+'</strong> brings <strong>'+share.toFixed(0)+'%</strong> of all sales \u2014 '+fmtINR(topGmv.r.gmv)+(topGmv.r.spend>0?' at '+topGmv.r.roas.toFixed(2)+'x on ad-spend':'')+'.'});
  }
  // STORY 2: Best ROI platform
  const withSpend=res.filter(o=>o.r.spend>0);
  if(withSpend.length){
    const topRoas=withSpend.slice().sort((a,b)=>b.r.roas-a.r.roas)[0];
    stories.push({cls:'metric',icon:'💎',title:'Top ROI',body:'<strong>'+pName(topRoas.p)+'</strong> gives the best return: <strong>'+topRoas.r.roas.toFixed(2)+'x</strong> on every rupee spent.'});
  }
  // STORY 3: Top product (any platform)
  let bestProd=null;
  platforms.forEach(p=>{
    const ps=D.platforms[p].sales.products;
    if(ps&&ps.length&&(!bestProd||ps[0].gmv>bestProd.gmv)){bestProd={...ps[0],platform:p};}
  });
  if(bestProd){
    stories.push({cls:'metric',icon:'🏆',title:'Hero SKU',body:'<strong>'+bestProd.product+'</strong> on '+pName(bestProd.platform)+' \u2014 '+fmtINR(bestProd.gmv)+' from '+fmtNum(bestProd.units)+' packs.'});
  }
  // STORY 4: Top city (any platform, by GMV)
  let bestCity=null;
  platforms.forEach(p=>{
    const cs=D.platforms[p].sales.cities;
    if(cs&&cs.length&&(!bestCity||cs[0].gmv>bestCity.gmv)){bestCity={...cs[0],platform:p,grand:D.platforms[p].sales.cities_grand.gmv};}
  });
  if(bestCity){
    const share=safeDiv(bestCity.gmv,bestCity.grand)*100;
    stories.push({cls:'geo',icon:'🏙️',title:'Top City',body:'<strong>'+bestCity.city+'</strong> is the biggest market on '+pName(bestCity.platform)+' \u2014 '+fmtINR(bestCity.gmv)+', '+share.toFixed(0)+'% of its sales.'});
  }
  // STORY 5: Best keyword (cross-platform top 50)
  if(D.ads_apr_may&&D.ads_apr_may.top_keywords_cross_platform){
    const kws=D.ads_apr_may.top_keywords_cross_platform.data;
    const spends=kws.map(k=>k.spend).sort((a,b)=>b-a);
    const minSpend=spends.length?spends[Math.min(spends.length-1,Math.floor(spends.length*0.25))]:0;
    const profitable=kws.filter(k=>k.roas>=2&&k.spend>=minSpend).sort((a,b)=>b.roas-a.roas);
    const k=profitable.length?profitable[0]:kws[0];
    if(k){
      stories.push({cls:'opp',icon:'🎯',title:'Top Keyword',body:'<strong>'+k.keyword+'</strong> on '+k.platform+' returns <strong>'+k.roas.toFixed(2)+'x</strong> on '+fmtINR(k.spend)+' spent ('+D.ads_apr_may.period+').'});
    }
  }
  // STORY 6 (only if Infino Zero): Launch story
  if(D.infino_zero){
    const iz=recompute(D.infino_zero.block);
    stories.push({cls:'launch',icon:'🌱',title:'New Launch',body:'<strong>Infino Zero</strong> live on Zepto from May 10 — '+(iz.spend>0?fmtINR(iz.spend)+' invested across 4-SKU pilot':'4-SKU launch pilot')+'.'});
  }
  return stories.slice(0,5);
}

// ===== CHART HELPER w/ optional target line plugin =====
const targetLinePlugin = {
  id: 'targetLine',
  afterDraw(chart, args, opts){
    if(!opts || !opts.value) return;
    const {ctx, chartArea, scales} = chart;
    const y = scales.y.getPixelForValue(opts.value);
    if(y < chartArea.top || y > chartArea.bottom) return;
    ctx.save();
    ctx.strokeStyle = opts.color || '#16A34A';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(chartArea.left, y);
    ctx.lineTo(chartArea.right, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = opts.color || '#16A34A';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(opts.label || '', chartArea.right - 6, y - 4);
    ctx.restore();
  }
};
Chart.register(targetLinePlugin);
Chart.defaults.maintainAspectRatio=false;
Chart.defaults.responsive=true;

      if(!mg[id])mg[id]={keyword:k.keyword,plats:[],spend:0,rev:0,revT:false,impr:0,clk:0,clkT:false,tip:[]};
      const m=mg[id];
      m.plats.push(k.platform);m.spend+=k.spend;m.impr+=(k.impressions||0);
      if(k.clicks!=null&&k.clicks>0){m.clk+=k.clicks;m.clkT=true;}
      if(k.revenue!=null){m.rev+=k.revenue;m.revT=true;}
      m.tip.push(k.platform+': '+fmtINR(k.spend)+(k.revenue!=null&&k.spend>0?' @ '+(k.revenue/k.spend).toFixed(2)+'x':''));
    });
    const list=Object.values(mg).sort((a,b)=>b.spend-a.spend).slice(0,50);
    const uniq=Object.keys(mg).length;
    let rows='';
    list.forEach((m,i)=>{
      const sp=safeDiv(m.spend,g.spend)*100;
      const pills=m.plats.map(pl=>'<span class="platform-pill platform-'+pl.toLowerCase()+'" title="'+m.tip.join(' \u00b7 ')+'">'+pl+'</span>').join(' ');
      rows+=tableRow([i+1,m.keyword,pills,
        fmtINR(m.spend),fmtPct(sp),fmtNum(m.impr),
        m.impr>0?fmtINR(m.spend*1000/m.impr):'—',
        m.clkT?fmtNum(m.clk):'—',
        m.clkT&&m.clk>0?fmtINR(m.spend/m.clk):'—',
        m.revT?fmtINR(m.rev):'—',
        m.revT&&m.spend>0?fmtRoas(m.rev/m.spend):'—']);
    });
    const t=totalRow(['—','Total ('+uniq+' unique keywords)','—',fmtINR(g.spend),'100.0%','—','—','—','—',fmtINR(g.revenue),fmtRoas(safeDiv(g.revenue,g.spend))]);
    html+=partialNote();
    html+=filterNotice();
    html+='<div class="section-title">Top 50 Keywords — Cross-Platform ('+xk.period+')</div>'+
      '<div class="data-note">One row per keyword — terms running on multiple platforms are combined; hover the platform pills for the per-platform split. Ranked by total ad-spend. BigBasket spend is included but it does not report keyword-level revenue, so Combined Ad-ROAS uses revenue from tracking platforms. Total reflects ALL '+uniq+' unique keywords in window.</div>'+
      '<div class="table-card"><h3>Top 50 Keywords by Ad-Spend '+perBadge(xk.period)+'<button class="csv-btn" onclick="exportCSV(\'summaryTopKwTable\')">CSV</button></h3>'+
      '<table id="summaryTopKwTable">'+
      '<thead><tr><th class="left">#</th><th class="left">Keyword</th><th>Platforms</th><th>Ad-Spend</th><th>% of Spend</th><th>Ad-Impressions</th><th>Ad-CPM</th><th>Ad-Clicks</th><th>Ad-CPC</th><th>Ad-Revenue</th><th>Combined Ad-ROAS</th></tr></thead>'+
      '<tbody>'+rows+t+'</tbody></table></div>';
  }

  html+='<div class="section-title">What the words mean</div>'+
    '<div class="table-card" style="font-size:12.5px;line-height:1.8">'+
    '<div style="margin-bottom:8px"><strong>Ad-ROAS colour code:</strong> <span class="roas-green">≥ 3x Strong</span> · <span class="roas-amber">1–3x Building</span> · <span class="roas-red">&lt; 1x Investment phase</span> &nbsp;·&nbsp; <strong>↑ ↓ badges</strong> = change vs prior month · dashed chart lines = running benchmarks · <strong>\uD83D\uDDD3 table badges</strong> = the fixed data window each table covers</div>'+
    '<div><strong>MRP GMV</strong> — sales value at MRP · <strong>Ad-Spend / Ad-Revenue</strong> — advertising cost and the sales it directly drove · '+
    '<strong>Ad-ROAS</strong> — Ad-Revenue ÷ Ad-Spend · <strong>bROAS (Blended)</strong> — total sales ÷ Ad-Spend (ads + organic together) · '+
    '<strong>CPM</strong> — cost per 1,000 ad views (Blinkit prices ads this way, so clicks/CPC do not apply there) · '+
    '<strong>CPC</strong> — cost per click · <strong>ATC</strong> — add-to-carts from ads · '+
    '<strong>SP / SB / SD</strong> — Sponsored Products / Brands / Display ad formats</div></div>';
  c.innerHTML=html;

  const labels=results.map(o=>pName(o.p).toUpperCase()).concat(extra.map(o=>o.label));
  const gmvData=results.map(o=>o.r.gmv).concat(extra.map(o=>o.r.gmv));
  const spendData=results.map(o=>o.r.spend).concat(extra.map(o=>o.r.spend));
  const revData=results.map(o=>o.r.revenue).concat(extra.map(o=>o.r.revenue));
  const colors=results.map(o=>(D.platforms[o.p].meta&&D.platforms[o.p].meta.color)||'#1CBFBB').concat(extra.map(()=>'#16A34A'));
  destroyChart('summaryGmv');
  charts['summaryGmv']=new Chart(document.getElementById('summaryGmvChart'),{type:'doughnut',data:{labels,datasets:[{data:gmvData,backgroundColor:colors.slice(0,labels.length)}]},options:{maintainAspectRatio:false,layout:{padding:8},plugins:{legend:{position:'right',labels:{boxWidth:14,font:{size:12}}},tooltip:{callbacks:{label:c=>c.label+': '+fmtINR(c.raw)+' ('+(c.raw/gmvData.reduce((a,b)=>a+b,0)*100).toFixed(0)+'%)'}}}}});
  destroyChart('summarySpend');
  // Compute breakeven target (mean ROAS = 1, so target value = spend)
  charts['summarySpend']=new Chart(document.getElementById('summarySpendChart'),{type:'bar',data:{labels,datasets:[{label:'Ad-Spend',data:spendData,backgroundColor:'#1CBFBB'},{label:'Ad-Revenue',data:revData,backgroundColor:'#F5C518'}]},options:{scales:{y:{ticks:{callback:v=>fmtINR(v)}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtINR(c.raw)}}}}});
  const mlabels=mArr.map(m=>m.label);
  destroyChart('summaryMonthlyGmv');
  const gmvSets=platforms.map(p=>({label:pName(p),data:(D.platforms[p].sales.monthly||[]).map(m=>m.gmv),backgroundColor:(D.platforms[p].meta&&D.platforms[p].meta.color)||'#1CBFBB'}));
  if(D.projection){
    const pi=projMonthIdx(D.platforms[platforms[0]].sales.monthly);
    if(pi>=0){
      const rest=mArr.map((m,i)=>i===pi?platforms.reduce((s,p)=>s+projFor(p,'gmv_rest'),0):0);
      gmvSets.push({label:'Rest of '+D.projection.label+' (estimated)',data:rest,backgroundColor:'rgba(28,191,187,0.28)',borderColor:'#1CBFBB',borderWidth:1,borderDash:[4,3]});
    }
  }
  charts['summaryMonthlyGmv']=new Chart(document.getElementById('summaryMonthlyGmvChart'),{type:'bar',data:{labels:mlabels,datasets:gmvSets},options:{scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>fmtINR(v)}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtINR(c.raw)}}}}});
  destroyChart('summaryMonthlyAds');
  const adSets=[{label:'Ad-Spend',data:cam.map(m=>m.spend),backgroundColor:'#1CBFBB',stack:'s'},
                {label:'Ad-Revenue',data:cam.map(m=>m.revenue),backgroundColor:'#F5C518',stack:'r'}];
  if(D.projection){
    const pi=projMonthIdx(cam);
    if(pi>=0){
      adSets.push({label:'Spend \u2014 rest of '+D.projection.label+' (est.)',data:cam.map((m,i)=>i===pi?platforms.reduce((s,p)=>s+projFor(p,'spend_rest'),0):0),backgroundColor:'rgba(28,191,187,0.28)',stack:'s'});
      adSets.push({label:'Revenue \u2014 rest of '+D.projection.label+' (est.)',data:cam.map((m,i)=>i===pi?platforms.reduce((s,p)=>s+projFor(p,'revenue_rest'),0):0),backgroundColor:'rgba(245,197,24,0.30)',stack:'r'});
    }
  }
  charts['summaryMonthlyAds']=new Chart(document.getElementById('summaryMonthlyAdsChart'),{type:'bar',data:{labels:mlabels,datasets:adSets},options:{scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>fmtINR(v)}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtINR(c.raw)}}}}});
}

function renderPlatform(p,block,naFor,isIZ){
  const r=recompute(block);
  const c=document.getElementById(p+'Content');
  const platformCss=isIZ?'infino-zero':p;
  const platformLabel=isIZ?'Infino Zero (Zepto)':pName(p);
  const adsPeriod=block.meta.ads_period||'—';
  const noAdsActivity=r.am.every(m=>(m.spend||0)===0);
  const hasClicks=(naFor||[]).indexOf('clicks')<0;

  let html=insightBanner(buildPlatformInsight(p,isIZ));
  html+='<div style="margin-bottom:18px"><div style="font-size:11px;color:var(--ns-gray)">Ads period: <strong>'+adsPeriod+'</strong></div></div>';
  html+=kpiGrid(r,platformLabel,naFor,r.smRaw,r.amRaw);
  if(block.meta&&block.meta.notes){html+='<div class="data-note"><strong>Data basis:</strong> '+block.meta.notes+'</div>';}

  if(noAdsActivity){
    const mLbl=currentMonth==='all'?periodLabel():document.querySelector('#monthFilter option[value="'+currentMonth+'"]').textContent;
    html+='<div class="empty-state">No ad activity in current selection ('+mLbl+') — opportunity to activate campaigns in this window.</div>';
  }

  // Compute 3-month trailing average for GMV target line
  const smAll=r.smRaw||[];
  const trailing3 = smAll.length>=3 ? smAll.slice(-3).reduce((s,m)=>s+(m.gmv||0),0)/3 : 0;

  html+='<div class="section-title">Month-by-month</div>'+
    '<div class="charts-row"><div class="chart-card"><h3>Monthly Sales GMV</h3><div class="chart-sub">all months · pale top segment = rest of August at current daily pace</div><div class="chart-container"><canvas id="'+p+'GmvChart"></canvas></div></div>'+
    '<div class="chart-card"><h3>Ad-Spend vs Ad-Revenue (monthly)</h3><div class="chart-sub">all months · dashed line = breakeven (Spend=Revenue)</div><div class="chart-container"><canvas id="'+p+'AdsChart"></canvas></div></div></div>';

  html+=partialNote();
  html+=filterNotice();
  // Sales — Products
  html+='<div class="section-title">What sold</div>'+
    '<div class="table-card"><h3>Top '+Math.min(20,block.sales.products.length)+' Products by Sales GMV '+perBadge('YTD \u00b7 '+(D.sales_period||''))+'<button class="csv-btn" onclick="exportCSV(\''+p+'ProductTable\')">CSV</button></h3>'+
    (block.sales.products_grand.count>block.sales.products.length?'<div class="table-note">Showing top 20 of '+block.sales.products_grand.count+' products. Total row reflects ALL products.</div>':'')+
    '<table id="'+p+'ProductTable"><thead><tr><th class="left">#</th><th class="left">Product</th><th>Units</th><th>Avg Price</th><th>GMV</th><th>% Share (of Total)</th></tr></thead><tbody>';
  block.sales.products.forEach((pr,i)=>{const share=safeDiv(pr.gmv,block.sales.products_grand.gmv)*100;html+=tableRow([i+1,pr.product,fmtNum(pr.units),fmtINR(safeDiv(pr.gmv,pr.units)),fmtINR(pr.gmv),fmtPct(share)]);});
  html+=totalRow(['—','Total ('+block.sales.products_grand.count+' products)',fmtNum(block.sales.products_grand.units),'—',fmtINR(block.sales.products_grand.gmv),'100.0%']);
  html+='</tbody></table></div>';

  // Sales — Cities
  html+='<div class="table-card"><h3>Top '+Math.min(20,block.sales.cities.length)+' Cities by Sales GMV '+perBadge('YTD \u00b7 '+(D.sales_period||''))+'<button class="csv-btn" onclick="exportCSV(\''+p+'CityTable\')">CSV</button></h3>'+
    (block.sales.cities_grand.count>block.sales.cities.length?'<div class="table-note">Showing top 20 of '+block.sales.cities_grand.count+' cities. Total row reflects ALL cities.</div>':'')+
    '<table id="'+p+'CityTable"><thead><tr><th class="left">#</th><th class="left">City</th><th>Units</th><th>% Units Share</th><th>GMV</th><th>% GMV Share</th></tr></thead><tbody>';
  block.sales.cities.forEach((ct,i)=>{const us=safeDiv(ct.units,block.sales.cities_grand.units)*100;const gs=safeDiv(ct.gmv,block.sales.cities_grand.gmv)*100;html+=tableRow([i+1,ct.city,fmtNum(ct.units),fmtPct(us),fmtINR(ct.gmv),fmtPct(gs)]);});
  html+=totalRow(['—','Total ('+block.sales.cities_grand.count+' cities)',fmtNum(block.sales.cities_grand.units),'100.0%',fmtINR(block.sales.cities_grand.gmv),'100.0%']);
  html+='</tbody></table></div>';

  // Apr-May Ads Detail
  let apr=null;
  if(isIZ&&D.infino_zero&&D.infino_zero.ads_apr_may)apr=D.infino_zero.ads_apr_may;
  else if(D.ads_apr_may&&D.ads_apr_may.platforms&&D.ads_apr_may.platforms[p])apr=D.ads_apr_may.platforms[p];

  if(apr&&apr.total.spend>0){
    html+='<div class="section-title">Ads Detail — '+apr.period+' (focus window)</div>'+
      '<div class="data-note">Detail tables below are scoped to <strong>'+apr.period+'</strong> — the most recent activity window. Monthly trend above shows YTD; KPI cards reflect period selector.</div>';

    const A=apr.total;
    const naCardSm=(lbl)=>'<div class="kpi-card unavailable"><div class="kpi-label">'+lbl+'</div><div class="kpi-value">—</div><div class="kpi-sub">Not tracked by '+platformLabel+'</div></div>';
    html+='<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">'+
      '<div class="kpi-card '+platformCss+'"><div class="kpi-label">Ad-Spend (Jul 1 – Aug 13)</div><div class="kpi-value">'+(A.spend>0?fmtINR(A.spend):'—')+'</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Ad-Revenue</div><div class="kpi-value">'+(A.revenue>0?fmtINR(A.revenue):'—')+'</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Ad-ROAS</div><div class="kpi-value">'+(A.spend>0?fmtRoas(A.roas):'—')+'</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Ad-Impressions</div><div class="kpi-value">'+(A.impressions>0?fmtNum(A.impressions):'—')+'</div></div>'+
      '<div class="kpi-card"><div class="kpi-label">Ad-CPM</div><div class="kpi-value">'+(A.cpm>0?fmtINR(A.cpm):'—')+'</div></div>'+
      (hasClicks?'<div class="kpi-card"><div class="kpi-label">Ad-Clicks</div><div class="kpi-value">'+(A.clicks>0?fmtNum(A.clicks):'—')+'</div></div>':naCardSm('Ad-Clicks'))+
      (hasClicks?'<div class="kpi-card"><div class="kpi-label">Ad-CPC</div><div class="kpi-value">'+(A.cpc>0?fmtINR(A.cpc):'—')+'</div></div>':naCardSm('Ad-CPC'))+
      '<div class="kpi-card"><div class="kpi-label">Ad-ATC</div><div class="kpi-value">'+(A.atc>0?fmtNum(A.atc):'—')+'</div></div>'+
      '</div>';

    const aprTypes=apr.types||apr.targeting_types||apr.ad_types;
    if(aprTypes&&aprTypes.length){
      const typeKey=aprTypes[0].targeting_type!==undefined?'targeting_type':(aprTypes[0].ad_type!==undefined?'ad_type':'type');
      const typeLabel=(typeKey==='targeting_type'||(aprTypes[0].type!==undefined&&String(aprTypes[0].type).length>3&&'SPSBSD'.indexOf(String(aprTypes[0].type))<0))?'Targeting Type':'Ad Type';
      let t_spend=0,t_rev=0,t_impr=0,t_clk=0;
      aprTypes.forEach(t=>{t_spend+=t.spend;t_rev+=t.revenue;t_impr+=t.impressions;t_clk+=t.clicks||0;});
      let rows='';
      aprTypes.forEach(t=>{
        const sp=safeDiv(t.spend,t_spend)*100;
        const row=[t[typeKey],fmtINR(t.spend),fmtPct(sp),fmtNum(t.impressions),t.cpm>0?fmtINR(t.cpm):'—'];
        if(hasClicks){row.push(t.clicks>0?fmtNum(t.clicks):'—');row.push(t.cpc>0?fmtINR(t.cpc):'—');}
        row.push(t.revenue>0?fmtINR(t.revenue):'—');row.push(t.spend>0?fmtRoas(t.roas):'—');
        rows+=tableRow(row);
      });
      const totRow=['Total',fmtINR(t_spend),'100.0%',fmtNum(t_impr),fmtINR(safeDiv(t_spend*1000,t_impr))];
      if(hasClicks){totRow.push(fmtNum(t_clk));totRow.push(t_clk>0?fmtINR(safeDiv(t_spend,t_clk)):'—');}
      totRow.push(fmtINR(t_rev));totRow.push(fmtRoas(safeDiv(t_rev,t_spend)));
      html+='<div class="table-card"><h3>'+typeLabel+' Breakdown '+perBadge(apr.period)+'<button class="csv-btn" onclick="exportCSV(\''+p+'TypeTable\')">CSV</button></h3>'+
        '<table id="'+p+'TypeTable"><thead><tr><th class="left">'+typeLabel+'</th><th>Ad-Spend</th><th>% of Spend</th><th>Ad-Impressions</th><th>Ad-CPM</th>'+(hasClicks?'<th>Ad-Clicks</th><th>Ad-CPC</th>':'')+'<th>Ad-Revenue</th><th>Ad-ROAS</th></tr></thead><tbody>'+rows+totalRow(totRow)+'</tbody></table></div>';
    }

    if(apr.campaigns&&apr.campaigns.length){
      const g=apr.campaigns_grand;
      let rows='';
      apr.campaigns.forEach(camp=>{
        const sp=safeDiv(camp.spend,g.spend)*100;
        const row=[camp.campaign,camp.type||camp.ad_type||'—',fmtINR(camp.spend),fmtPct(sp),fmtNum(camp.impressions),camp.cpm>0?fmtINR(camp.cpm):'—'];
        if(hasClicks){row.push(camp.clicks>0?fmtNum(camp.clicks):'—');row.push(camp.cpc>0?fmtINR(camp.cpc):'—');}
        row.push(camp.revenue>0?fmtINR(camp.revenue):'—');row.push(camp.spend>0?fmtRoas(camp.roas):'—');
        rows+=tableRow(row);
      });
      const totRow=['Total ('+g.count+' campaigns)','—',fmtINR(g.spend),'100.0%','—','—'];
      if(hasClicks){totRow.push('—');totRow.push('—');}
      totRow.push(g.revenue==null?'—':fmtINR(g.revenue));totRow.push(g.revenue==null?'—':fmtRoas(safeDiv(g.revenue,g.spend)));
      html+='<div class="table-card"><h3>Top '+Math.min(20,apr.campaigns.length)+' Campaigns by Ad-Spend '+perBadge(apr.period)+'<button class="csv-btn" onclick="exportCSV(\''+p+'CampaignTable\')">CSV</button></h3>'+
        (g.count>apr.campaigns.length?'<div class="table-note">Showing top 20 of '+g.count+' campaigns. Total row reflects ALL campaigns in window.</div>':'')+
        '<table id="'+p+'CampaignTable"><thead><tr><th class="left">Campaign</th><th class="left">Type</th><th>Ad-Spend</th><th>% of Spend</th><th>Ad-Impressions</th><th>Ad-CPM</th>'+(hasClicks?'<th>Ad-Clicks</th><th>Ad-CPC</th>':'')+'<th>Ad-Revenue</th><th>Ad-ROAS</th></tr></thead><tbody>'+rows+totalRow(totRow)+'</tbody></table></div>';
    }

    if(apr.top_keywords&&apr.top_keywords.length){
      const g=apr.keywords_grand;
      let rows='';
      apr.top_keywords.slice(0,30).forEach((k,i)=>{
        const sp=safeDiv(k.spend,g.spend)*100;
        const row=[i+1,k.keyword,k.type||k.match_type||'—',fmtINR(k.spend),fmtPct(sp),fmtNum(k.impressions),k.cpm>0?fmtINR(k.cpm):'—'];
        if(hasClicks){row.push(k.clicks>0?fmtNum(k.clicks):'—');row.push(k.cpc>0?fmtINR(k.cpc):'—');}
        row.push(k.revenue==null?'—':(k.revenue>0?fmtINR(k.revenue):'—'));row.push(k.revenue==null?'—':(k.spend>0?fmtRoas(k.roas):'—'));
        rows+=tableRow(row);
      });
      const totRow=['—','Total ('+g.count+' keywords)','—',fmtINR(g.spend),'100.0%','—','—'];
      if(hasClicks){totRow.push('—');totRow.push('—');}
      totRow.push(g.revenue==null?'—':fmtINR(g.revenue));totRow.push(g.revenue==null?'—':fmtRoas(safeDiv(g.revenue,g.spend)));
      html+='<div class="table-card"><h3>Top '+Math.min(30,apr.top_keywords.length)+' Keywords by Ad-Spend '+perBadge(apr.period)+'<button class="csv-btn" onclick="exportCSV(\''+p+'KeywordTable\')">CSV</button></h3>'+
        (g.count>apr.top_keywords.length?'<div class="table-note">Showing top 30 of '+g.count+' keywords. Total row reflects ALL keywords in window.</div>':'')+
        '<table id="'+p+'KeywordTable"><thead><tr><th class="left">#</th><th class="left">Keyword</th><th>Type</th><th>Ad-Spend</th><th>% of Spend</th><th>Ad-Impressions</th><th>Ad-CPM</th>'+(hasClicks?'<th>Ad-Clicks</th><th>Ad-CPC</th>':'')+'<th>Ad-Revenue</th><th>Ad-ROAS</th></tr></thead><tbody>'+rows+totalRow(totRow)+'</tbody></table></div>';
    }
  }else if(apr){
    html+='<div class="section-title">Ads Detail — '+apr.period+' (focus window)</div>';
    html+='<div class="empty-state">No ad activity in '+apr.period+' on this platform — opportunity for new campaign activation.</div>';
  }

  c.innerHTML=html;

  destroyChart(p+'Gmv');
  charts[p+'Gmv']=new Chart(document.getElementById(p+'GmvChart'),{
    type:'bar',
    data:{labels:r.smRaw.map(m=>m.label),datasets:(function(){
      const ds=[{label:'Sales',data:r.smRaw.map(m=>m.gmv),backgroundColor:block.meta.color||'#1CBFBB'}];
      if(D.projection&&!isIZ&&D.projection.platforms[p]){
        const pi=r.smRaw.findIndex(m=>m.month===D.projection.month);
        if(pi>=0) ds.push({label:'Rest of '+D.projection.label+' (estimated)',data:r.smRaw.map((m,i)=>i===pi?projFor(p,'gmv_rest'):0),backgroundColor:'rgba(120,120,120,0.22)',borderColor:'#9ca3af',borderWidth:1});
      }
      return ds;})()},
    options:{
      scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{callback:v=>fmtINR(v)}}},
      plugins:{
        tooltip:{callbacks:{label:c=>'Sales GMV: '+fmtINR(c.raw)}},
        targetLine:{value:trailing3,label:trailing3>0?'3-mo avg '+fmtINR(trailing3):'',color:'#16A34A'}
      }
    }
  });
  destroyChart(p+'Ads');
  // Breakeven dashed line = revenue=spend axis; we'll mark the max(spend) average as reference
  const spendArr=r.amRaw.filter(m=>m.spend>0);
  const avgSpend=spendArr.length?spendArr.reduce((s,m)=>s+m.spend,0)/spendArr.length:0;
  charts[p+'Ads']=new Chart(document.getElementById(p+'AdsChart'),{
    type:'bar',
    data:{labels:r.amRaw.map(m=>m.label),datasets:[{label:'Ad-Spend',data:r.amRaw.map(m=>m.spend),backgroundColor:'#1CBFBB'},{label:'Ad-Revenue',data:r.amRaw.map(m=>m.revenue),backgroundColor:'#F5C518'}]},
    options:{
      scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtINR(v)}}},
      plugins:{
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtINR(c.raw)}},
        targetLine:{value:avgSpend,label:avgSpend>0?'Avg Spend '+fmtINR(avgSpend):'',color:'#0284c7'}
      }
    }
  });
}

function renderAll(){
  // Update period text in subtitle / date text
  const pText=periodLabel();
  const subtitle=document.getElementById('subtitle');
  if(subtitle) subtitle.textContent='Sales + Advertising · '+pText+(D&&D.data_through?' (through '+D.data_through+')':'');

  renderSummary();
  renderPlatform('amazon',D.platforms.amazon,['atc']);
  renderPlatform('blinkit',D.platforms.blinkit,['clicks','cpc','orders']);
  renderPlatform('zepto',D.platforms.zepto,[]);
  renderPlatform('bigbasket',D.platforms.bigbasket,['atc','orders']);
}

function initDashboard(){
  if(!D)return;
  document.getElementById('generatedDate').textContent='Generated '+(D.generated||'today');
  document.getElementById('footerDate').textContent=D.generated||'';
  document.getElementById('dateText').textContent=D.sales_period||'';
  if(D.infino_zero){
    const nav=document.getElementById('tabNav');
    const btn=document.createElement('button');
    btn.className='tab-btn iz-tab';
    btn.dataset.tab='infino_zero';
    btn.onclick=function(){switchTab('infino_zero',this);};
    btn.innerHTML='🌱 Infino Zero (Zepto)';
    nav.appendChild(btn);
  }
  const monthSet=new Set();
  ['amazon','blinkit','zepto','bigbasket'].forEach(p=>{
    const pb=D.platforms[p];if(!pb)return;
    (pb.sales.monthly||[]).forEach(m=>monthSet.add(m.month));
    (pb.ads.monthly||[]).forEach(m=>monthSet.add(m.month));
  });
  if(D.infino_zero){
    (D.infino_zero.block.sales.monthly||[]).forEach(m=>monthSet.add(m.month));
    (D.infino_zero.block.ads.monthly||[]).forEach(m=>monthSet.add(m.month));
  }
  const mf=document.getElementById('monthFilter');
  const names=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  Array.from(monthSet).sort().forEach(m=>{
    const opt=document.createElement('option');opt.value=m;
    const [yr,mo]=m.split('-');opt.textContent=names[parseInt(mo)]+' '+yr;
    mf.appendChild(opt);
  });
  renderAll();
}
document.getElementById('pwdInput').addEventListener('keydown',function(e){if(e.key==='Enter')tryDecrypt();});
</script>
