<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta http-equiv="X-Robots-Tag" content="noindex, nofollow">
<title>Chheda's — Amazon.com Sales Dashboard (Sample)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ns-teal:#1CBFBB;--ns-teal-dark:#18A6A3;--ns-teal-deep:#369290;--ns-black:#020202;--ns-white:#fff;
--ns-grey:#7D7D7D;--ns-grey-light:#F2F2F2;--ns-grey-warm:#E6E4E4;--ns-green:#15803d;--ns-amber:#d97706;--ns-red:#dc2626;--ns-bg:#f8f9fa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Calibri',sans-serif;background:var(--ns-bg);color:var(--ns-black);line-height:1.6;font-feature-settings:'tnum'}
.header{background:linear-gradient(135deg,#020202 0%,#1a3a39 100%);color:#fff;padding:18px 32px;display:flex;align-items:center;gap:22px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header .brandlogo{height:52px;width:auto;background:#fff;border-radius:8px;padding:5px 9px}
.header .nslogo{height:34px;width:auto;margin-left:auto}
.header h1{font-size:22px;font-weight:600;line-height:1.25}
.header .sub{font-size:12px;color:#b8c4c3;margin-top:3px}
.hdr-chd .header{background:#040404;padding:14px 40px;gap:28px}
.hdr-chd .header .brandlogo{height:92px;background:none;border-radius:0;padding:0}
.hdr-chd .header h1{font-size:25px;font-weight:700}
.hdr-chd .header .sub{text-transform:uppercase;letter-spacing:1.3px;font-size:11px;font-weight:600;color:#96a3a2;margin-top:5px}
.hdr-chd .hright{margin-left:auto;display:flex;align-items:center;gap:22px}
.hdr-chd .header .nslogo{margin-left:0;height:32px}
.hdr-chd .sample-pill{margin:0;background:rgba(28,191,187,.07);border:1.5px solid #1CBFBB;color:#66dbd7;font-size:12px;font-weight:600;letter-spacing:.2px;text-transform:none;padding:7px 16px;border-radius:9px;white-space:nowrap}
@media (max-width:900px){.hdr-chd .header .brandlogo{height:60px}.hdr-chd .hright{margin-left:0}}
.sample-pill{display:inline-block;background:rgba(28,191,187,.18);border:1px solid rgba(28,191,187,.5);color:#7fe6e3;font-size:10.5px;font-weight:600;letter-spacing:.4px;padding:2px 10px;border-radius:10px;margin-top:6px;text-transform:uppercase}
.tab-navigation{background:#fff;border-bottom:2px solid var(--ns-grey-light);display:flex;padding:0 24px;overflow-x:auto;position:sticky;top:0;z-index:50}
.tab-button{background:none;border:none;padding:15px 18px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ns-grey);border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;font-family:inherit}
.tab-button:hover{color:var(--ns-black)}
.tab-button.active{color:var(--tabcolor,var(--ns-teal));border-bottom-color:var(--tabcolor,var(--ns-teal))}
.filter-bar{background:#fff;padding:10px 32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--ns-grey-warm)}
.filter-bar label{font-size:12px;font-weight:600;color:var(--ns-grey)}
.period-toggle{display:inline-flex;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:8px;padding:3px;gap:2px}
.period-btn{padding:6px 14px;background:none;border:none;font-size:12px;font-weight:600;color:#6b6b6b;cursor:pointer;border-radius:6px;white-space:nowrap;font-family:inherit}
.period-btn:hover{color:#1a1a1a}
.period-btn.active{background:var(--ns-teal);color:#fff}
.period-dates{font-size:12px;color:var(--ns-grey)}
.reset-btn{padding:6px 14px;border:1px solid var(--ns-grey-warm);background:#fff;border-radius:6px;font-size:12px;font-weight:600;color:var(--ns-grey);cursor:pointer;font-family:inherit}
.reset-btn:hover{border-color:var(--ns-teal);color:var(--ns-teal-dark)}
.container{padding:24px 32px;max-width:1500px;margin:0 auto}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.insight-banner{background:linear-gradient(95deg,#E6FAF9 0%,#fff 100%);border-left:5px solid var(--ns-teal);padding:14px 18px 14px 22px;border-radius:8px;margin-bottom:22px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.insight-icon{font-size:24px;line-height:1.2}
.insight-text{flex:1;font-size:14px;color:#1a1a1a;line-height:1.55}
.insight-text strong{color:var(--ns-teal-dark);font-weight:700}
.stories-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 22px}
.story-card{background:#fff;padding:14px 14px 16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-top:3px solid var(--ns-teal);display:flex;flex-direction:column;gap:6px;transition:transform .18s,box-shadow .18s}
.story-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.09)}
.story-card.win{border-top-color:#15803d}.story-card.opp{border-top-color:#0284c7}.story-card.launch{border-top-color:#16A34A}
.story-card.geo{border-top-color:var(--ns-teal)}.story-card.metric{border-top-color:#F5C518}
.story-icon{font-size:22px;line-height:1}
.story-title{font-size:11px;font-weight:700;color:#6b6b6b;text-transform:uppercase;letter-spacing:.5px}
.story-body{font-size:13px;color:#1a1a1a;line-height:1.5;font-weight:500}
.story-body strong{color:var(--ns-teal-dark)}
.stories-note{font-size:11px;color:var(--ns-grey);margin:-16px 0 20px;text-align:right}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
.kpi-card{background:#fff;padding:16px 18px 14px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid var(--cardcolor,var(--ns-teal));transition:transform .18s,box-shadow .18s;position:relative}
.kpi-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.10)}
.kpi-label{font-size:11.5px;font-weight:700;color:var(--ns-grey);text-transform:none;letter-spacing:.2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.kpi-value{font-size:25px;font-weight:700;color:var(--ns-black);margin:4px 0 1px;line-height:1.15}
.kpi-sub{font-size:11px;color:var(--ns-grey)}
.mom-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.2px;line-height:1.5}
.mom-badge.up{background:#DCFCE7;color:#15803d}.mom-badge.down{background:#FEE2E2;color:#dc2626}
.mom-badge.flat{background:#F3F4F6;color:#6b7280}.mom-badge.new{background:#E6FAF9;color:#18A6A3}
.spark{margin-top:8px;display:flex;align-items:flex-end;gap:3px;height:26px}
.spark i{flex:1;background:var(--cardcolor,var(--ns-teal));opacity:.35;border-radius:2px 2px 0 0;min-height:2px}
.spark i:last-child{opacity:.95}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:25px}
.chart-card{background:#fff;border-radius:8px;padding:18px 18px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart-card.full{grid-column:1/-1}
.chart-card h3{font-size:14px;font-weight:700;color:var(--ns-black);margin-bottom:12px}
.chwrap{position:relative;height:300px}
.chart-card.half .chwrap{height:270px}
.chart-note{font-size:11px;color:var(--ns-grey);margin-top:8px}
.table-card{background:#fff;border-radius:8px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:25px}
.table-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.table-head h3{font-size:14px;font-weight:700;flex:1;min-width:200px}
.tbl-search{padding:6px 12px;border:1px solid var(--ns-grey-warm);border-radius:6px;font-size:12px;font-family:inherit;outline:none;width:180px}
.tbl-search:focus{border-color:var(--ns-teal)}
.tbl-btn{padding:6px 12px;border:1px solid var(--ns-grey-warm);background:#fff;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--ns-grey);cursor:pointer;font-family:inherit;white-space:nowrap}
.tbl-btn:hover{border-color:var(--ns-teal);color:var(--ns-teal-dark)}
.tbl-btn.on{background:var(--ns-teal);border-color:var(--ns-teal);color:#fff}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--ns-grey-light);font-weight:700;color:#444;padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:2px solid var(--ns-grey-warm)}
td{padding:8px 10px;text-align:center;border-bottom:1px solid #f0efef;white-space:nowrap}
td.lft,th.lft{text-align:left;white-space:normal}
tbody tr:hover{background:#F4FBFB}
tr.total-row td{font-weight:700;background:#EDFAF9;border-top:2px solid var(--ns-teal)}
.roas-chip{display:inline-block;min-width:52px;padding:2px 9px;border-radius:11px;font-weight:700;font-size:11.5px}
.roas-chip.g{background:#DCFCE7;color:#15803d}.roas-chip.a{background:#FEF3C7;color:#b45309}.roas-chip.r{background:#FEE2E2;color:#dc2626}
.table-note{font-size:11px;color:var(--ns-grey);margin-top:8px}
.callout{background:linear-gradient(95deg,#E6FAF9,#fff);border:1px solid #c9efee;border-radius:8px;padding:16px 20px;margin-bottom:22px}
.callout .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;background:var(--ns-teal);border-radius:4px;padding:2px 8px;margin-bottom:8px}
.callout h4{font-size:14.5px;margin-bottom:4px}
.callout p{font-size:13px;color:#333}
.recos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:25px}
.reco-card{background:#fff;border-radius:8px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--ns-teal);transition:transform .18s,box-shadow .18s}
.reco-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.10)}
.reco-badge{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 10px;border-radius:10px}
.reco-badge.qw{background:#DCFCE7;color:#15803d}.reco-badge.hi{background:#DBEAFE;color:#1d4ed8}.reco-badge.st{background:#EDE9FE;color:#6D28D9}
.reco-card h4{font-size:14.5px}
.reco-card p{font-size:12.5px;color:#444;flex:1}
.reco-impact{font-size:11.5px;font-weight:700;color:var(--ns-teal-dark);border-top:1px dashed var(--ns-grey-warm);padding-top:8px}
details.meta-block{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px;padding:14px 18px}
details.meta-block summary{font-size:13px;font-weight:700;cursor:pointer;color:var(--ns-teal-dark)}
details.meta-block ul{margin:10px 0 4px 18px;font-size:12.5px;color:#333}
details.meta-block li{margin-bottom:5px}
details.meta-block b{color:var(--ns-black)}
.footer{text-align:center;font-size:11px;color:var(--ns-grey);padding:18px 0 30px}
.fab{position:fixed;right:26px;bottom:26px;width:52px;height:52px;border-radius:50%;background:var(--ns-teal);color:#fff;border:none;font-size:21px;cursor:pointer;box-shadow:0 6px 18px rgba(28,191,187,.45);z-index:60;transition:background .2s,transform .2s}
.fab:hover{background:var(--ns-teal-deep);transform:scale(1.06)}
.password-overlay{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#020202 0%,#0E2A30 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.gatebox{width:100%;max-width:400px;text-align:center}
.gatebox .gl{background:#fff;border-radius:14px;display:inline-block;padding:14px 22px 10px;margin-bottom:22px}
.gatebox .gl img{height:64px;display:block}
.gatebox .gnslead{height:40px;margin-bottom:24px}
.gatebox h2{color:#fff;font-size:17px;font-weight:650;letter-spacing:-.01em;margin-bottom:6px}
.gatebox p{color:rgba(255,255,255,.55);font-size:13px;margin:0 0 18px}
.gatebox input{width:100%;padding:12px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:15px;text-align:center;letter-spacing:.08em;outline:0;transition:border-color .15s;box-sizing:border-box}
.gatebox input:focus{border-color:#1CBFBB}
.gatebox input::placeholder{color:rgba(255,255,255,.35);letter-spacing:0}
.gatebox button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:#1CBFBB;color:#fff;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:background .15s}
.gatebox button:hover{background:#369290}
.password-error{color:#FCA5A5;font-size:12.5px;margin-top:11px;min-height:17px;display:none}
.gns{margin-top:26px;opacity:.75}
.gns img{height:18px}
:focus-visible{outline:2px solid var(--ns-teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1200px){.stories-strip{grid-template-columns:repeat(3,1fr)}.recos-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1000px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.charts-grid{grid-template-columns:1fr}}
@media (max-width:640px){.kpi-grid,.stories-strip,.recos-grid{grid-template-columns:1fr}.container{padding:16px}.header{padding:14px 16px;flex-wrap:wrap}.header .nslogo{margin-left:0}}
@media print{.tab-navigation,.filter-bar,.fab,.password-overlay,.tbl-search,.tbl-btn{display:none!important}
.tab-content{display:block!important;page-break-before:always}
.tab-content:first-of-type{page-break-before:avoid}
.kpi-grid,.charts-grid,.table-card,.stories-strip{page-break-inside:avoid}
body{background:#fff}}
</style>
</head>

'use strict';
let D=null;
const enc=new TextEncoder();
function b64ToBytes(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function deriveKey(password,salt){
  const km=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decryptData(password){
  const key=await deriveKey(password,b64ToBytes(ENC_SALT));
  const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ENC_IV)},key,b64ToBytes(ENC_DATA));
  return JSON.parse(new TextDecoder().decode(dec));
}
async function checkPassword(){
  const f=document.getElementById('passwordInput');
  const pw=f.value.trim();
  if(!pw){f.focus();return;}
  try{
    D=await decryptData(pw);
    document.getElementById('passwordOverlay').style.display='none';
    document.getElementById('dashboardContent').style.display='block';
    f.value='';
    boot();
  }catch(e){
    D=null;
    document.getElementById('passwordError').style.display='block';
    f.value='';f.focus();
  }
}

/* ---------- formatting ---------- */
function cur(){return D.meta.currency;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtMoney(v){
  const a=Math.abs(v),s=v<0?'-':'';
  if(cur()==='inr'){
    if(a>=1e7)return s+'₹'+(a/1e7).toFixed(2)+' Cr';
    if(a>=1e5)return s+'₹'+(a/1e5).toFixed(2)+' L';
    if(a>=1e3)return s+'₹'+(a/1e3).toFixed(1)+'K';
    return s+'₹'+a.toFixed(0);
  }
  if(a>=1e6)return s+'$'+(a/1e6).toFixed(2)+'M';
  if(a>=1e3)return s+'$'+(a/1e3).toFixed(1)+'K';
  return s+'$'+a.toFixed(0);
}
function fmtMoney2(v){
  if(cur()==='inr')return '₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:1});
  return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtNum(v){
  const a=Math.abs(v);
  if(cur()==='inr'){
    if(a>=1e7)return (v/1e7).toFixed(2)+' Cr';
    if(a>=1e5)return (v/1e5).toFixed(2)+' L';
    if(a>=1e3)return (v/1e3).toFixed(1)+'K';
  }else{
    if(a>=1e6)return (v/1e6).toFixed(2)+'M';
    if(a>=1e3)return (v/1e3).toFixed(1)+'K';
  }
  return String(Math.round(v));
}
function fmtFullNum(v){return Number(v).toLocaleString(cur()==='inr'?'en-IN':'en-US');}
function fmtVal(fmt,v){
  if(v===null||v===undefined||v==='')return '—';
  switch(fmt){
    case 'money':return fmtMoney(v);
    case 'money2':return fmtMoney2(v);
    case 'usd2':return '$'+Number(v).toFixed(2);
    case 'num':return fmtFullNum(v);
    case 'roas':return Number(v).toFixed(2)+'x';
    case 'pct':return Number(v).toFixed(1)+'%';
    default:return esc(v);
  }
}
function roasChip(v){
  if(v===null||v===undefined)return '—';
  const c=v>=3?'g':(v>=1?'a':'r');
  return '<span class="roas-chip '+c+'">'+Number(v).toFixed(2)+'x</span>';
}

/* ---------- state ---------- */
let curPeriod='ytd';
let activeTab=null;
const chartDefs=[];
const liveCharts={};
const staleTabs={};
const tableState={};

/* ---------- section builders ---------- */
let uid=0;
function secInsight(s,tabId){
  const id='ins_'+(uid++);
  s._id=id;
  return '<div class="insight-banner"><span class="insight-icon">💡</span><div class="insight-text" id="'+id+'"></div></div>';
}
function secStories(s){
  let h='<div class="stories-strip">';
  s.cards.forEach(c=>{
    h+='<div class="story-card '+c.cls+'"><span class="story-icon">'+c.icon+'</span><div class="story-title">'+esc(c.title)+'</div><div class="story-body">'+c.body+'</div></div>';
  });
  h+='</div>';
  if(s.note)h+='<div class="stories-note">'+esc(s.note)+'</div>';
  return h;
}
function sparkHtml(vals,color){
  if(!vals||vals.length<2)return '';
  const mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  let h='<div class="spark" aria-hidden="true">';
  vals.forEach(v=>{
    const pct=mx===mn?60:8+((v-mn)/(mx-mn))*92;
    h+='<i style="height:'+pct.toFixed(0)+'%"></i>';
  });
  return h+'</div>';
}
function secKpis(s){
  let h='<div class="kpi-grid">';
  s.cards.forEach(c=>{
    const id='kv_'+(uid++);
    c._id=id;
    const style=c.color?' style="--cardcolor:'+c.color+'"':'';
    const mom=c.mom?' <span class="mom-badge '+c.mom.cls+'" title="'+esc(c.mom.title||'')+'">'+c.mom.text+'</span>':'';
    h+='<div class="kpi-card"'+style+'><div class="kpi-label">'+esc(c.label)+mom+'</div>'+
       '<div class="kpi-value" id="'+id+'"></div>'+
       (c.sub?'<div class="kpi-sub">'+esc(c.sub)+'</div>':'')+
       sparkHtml(c.spark)+'</div>';
  });
  return h+'</div>';
}
function secCharts(s,tabId){
  let h='<div class="charts-grid">';
  s.items.forEach(it=>{
    chartDefs.push({tab:tabId,def:it});
    h+='<div class="chart-card '+(it.width==='full'?'full':'half')+'"><h3>'+esc(it.title)+'</h3><div class="chwrap"><canvas id="'+it.id+'"></canvas></div>'+
       (it.note?'<div class="chart-note">'+esc(it.note)+'</div>':'')+'</div>';
  });
  return h+'</div>';
}
function secTable(s){
  tableState[s.id]={search:'',pareto:false};
  let tools='';
  if(s.search)tools+='<input class="tbl-search" placeholder="Search…" oninput="tblSearch(\''+s.id+'\',this.value)">';
  if(s.pareto)tools+='<button class="tbl-btn" id="pbtn_'+s.id+'" onclick="tblPareto(\''+s.id+'\')">Top 80% view</button>';
  tools+='<button class="tbl-btn" onclick="exportCSV(\''+s.id+'\')">⬇ CSV</button>';
  return '<div class="table-card"><div class="table-head"><h3>'+esc(s.title)+'</h3>'+tools+'</div>'+
         '<div class="tscroll" id="twrap_'+s.id+'"></div>'+
         (s.note?'<div class="table-note">'+esc(s.note)+'</div>':'')+'</div>';
}
function secRecos(s){
  const map={'Quick Win':'qw','High Impact':'hi','Strategic':'st'};
  let h='<div class="recos-grid">';
  s.cards.forEach(c=>{
    h+='<div class="reco-card"><span class="reco-badge '+(map[c.badge]||'qw')+'">'+esc(c.badge)+'</span><h4>'+esc(c.title)+'</h4><p>'+esc(c.body)+'</p><div class="reco-impact">'+esc(c.impact)+'</div></div>';
  });
  return h+'</div>';
}
function secCallout(s){
  return '<div class="callout"><span class="tag">'+esc(s.tag)+'</span><h4>'+esc(s.title)+'</h4><p>'+esc(s.body)+'</p></div>';
}
function buildSection(s,tabId){
  switch(s.type){
    case 'insight':return secInsight(s,tabId);
    case 'stories':return secStories(s);
    case 'kpis':return secKpis(s);
    case 'charts':return secCharts(s,tabId);
    case 'table':return secTable(s);
    case 'recos':return secRecos(s);
    case 'callout':return secCallout(s);
    default:return '';
  }
}

/* ---------- tables ---------- */
function findTable(id){
  for(const t of D.tabs)for(const s of t.sections)if(s.type==='table'&&s.id===id)return s;
  return null;
}
function cellHtml(col,row){
  const v=row[col.key];
  if(col.fmt==='roas')return '<td>'+roasChip(v)+'</td>';
  const cls=(col.fmt==='text'||col.align==='left')?' class="lft"':'';
  return '<td'+cls+'>'+fmtVal(col.fmt,v)+'</td>';
}
function renderTable(id){
  const s=findTable(id),st=tableState[id];
  let rows=s.rows;
  if(st.search){
    const q=st.search.toLowerCase();
    rows=rows.filter(r=>s.columns.some(c=>String(r[c.key]).toLowerCase().includes(q)));
  }
  if(st.pareto&&s.pareto){
    const key=s.pareto.key;
    const grand=(s.total&&s.total[key])?s.total[key]:s.rows.reduce((a,r)=>a+(r[key]||0),0);
    const sorted=s.rows.slice().sort((a,b)=>(b[key]||0)-(a[key]||0));
    let cum=0;const keep=new Set();
    for(const r of sorted){if(cum>=grand*0.8)break;cum+=(r[key]||0);keep.add(r);}
    rows=rows.filter(r=>keep.has(r));
  }
  let h='<table><thead><tr>';
  s.columns.forEach(c=>{h+='<th'+((c.fmt==='text'||c.align==='left')?' class="lft"':'')+'>'+esc(c.label)+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr>';s.columns.forEach(c=>{h+=cellHtml(c,r);});h+='</tr>';});
  if(s.total&&!st.search&&!st.pareto){h+='<tr class="total-row">';s.columns.forEach(c=>{h+=cellHtml(c,s.total);});h+='</tr>';}
  h+='</tbody></table>';
  document.getElementById('twrap_'+id).innerHTML=h;
}
function tblSearch(id,v){tableState[id].search=v;renderTable(id);}
function tblPareto(id){
  const st=tableState[id];st.pareto=!st.pareto;
  document.getElementById('pbtn_'+id).classList.toggle('on',st.pareto);
  renderTable(id);
}
function exportCSV(id){
  const s=findTable(id);
  const lines=[s.columns.map(c=>'"'+c.label.replace(/"/g,'""')+'"').join(',')];
  const rowLine=r=>s.columns.map(c=>{
    const v=r[c.key];
    if(v===null||v===undefined)return '';
    return typeof v==='number'?v:'"'+String(v).replace(/"/g,'""')+'"';
  }).join(',');
  s.rows.forEach(r=>lines.push(rowLine(r)));
  if(s.total)lines.push(rowLine(s.total));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=id+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- charts ---------- */
const targetLinePlugin={
  id:'targetLine',
  afterDraw(chart,args,opts){
    if(!opts||!opts.value)return;
    const ca=chart.chartArea,sc=chart.scales;
    if(!sc.y)return;
    const y=sc.y.getPixelForValue(opts.value);
    if(y<ca.top||y>ca.bottom)return;
    const ctx=chart.ctx;
    ctx.save();
    ctx.strokeStyle=opts.color||'#16A34A';
    ctx.lineWidth=1.5;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(ca.left,y);ctx.lineTo(ca.right,y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=opts.color||'#16A34A';
    ctx.font='bold 10px sans-serif';ctx.textAlign='right';
    ctx.fillText(opts.label||'',ca.right-6,y-4);
    ctx.restore();
  }
};
function dsData(ds){return ds.data_by_period?ds.data_by_period[curPeriod]:ds.data;}
function axisFmt(fmt){
  return v=>{
    if(fmt==='money'||fmt==='money2')return fmtMoney(v);
    if(fmt==='roas')return v+'x';
    if(fmt==='pct')return v+'%';
    return fmtNum(v);
  };
}
function tipFmt(fmt,v){
  if(fmt==='money'||fmt==='money2')return fmtMoney(v);
  if(fmt==='roas')return Number(v).toFixed(2)+'x';
  if(fmt==='pct')return Number(v).toFixed(1)+'%';
  return fmtFullNum(v);
}
function buildChart(def){
  if(typeof Chart==='undefined'){
    const cv0=document.getElementById(def.id);
    if(cv0&&cv0.parentElement)cv0.parentElement.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#7D7D7D;font-size:12px;text-align:center">Charts need an internet connection (chart library loads from a secure CDN).<br>All numbers remain available in the KPI cards and tables.</div>';
    return;
  }
  const cv=document.getElementById(def.id);
  if(!cv)return;
  if(liveCharts[def.id]){liveCharts[def.id].destroy();delete liveCharts[def.id];}
  const fmt=def.format||'num';
  let cfg;
  if(def.kind==='doughnut'){
    const ds=def.datasets[0];
    const data=dsData(ds);
    cfg={type:'doughnut',
      data:{labels:def.labels,datasets:[{data:data,backgroundColor:ds.colors,borderWidth:2,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'58%',
        plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11},generateLabels(chart){
          const d=chart.data.datasets[0].data,total=d.reduce((a,b)=>a+b,0);
          return chart.data.labels.map((l,i)=>({text:l+' — '+(total?(d[i]/total*100).toFixed(0):0)+'%',
            fillStyle:chart.data.datasets[0].backgroundColor[i],strokeStyle:'#fff',lineWidth:0,index:i,fontColor:'#333'}));
        }}},
        tooltip:{callbacks:{label(c){const t=c.dataset.data.reduce((a,b)=>a+b,0);
          return ' '+c.label.split(' —')[0]+': '+tipFmt(fmt,c.parsed)+' ('+(t?(c.parsed/t*100).toFixed(1):0)+'%)';}}}}}};
  }else{
    const horizontal=def.kind==='hbar';
    const datasets=def.datasets.map(ds=>{
      const isLine=ds.type==='line'||def.kind==='line';
      const base={label:ds.label||'',data:dsData(ds),borderWidth:isLine?2.5:0};
      if(isLine){
        base.type='line';base.borderColor=ds.color;base.backgroundColor=ds.color;
        base.pointRadius=3;base.tension=.35;base.spanGaps=true;
        if(ds.yAxisID)base.yAxisID=ds.yAxisID;
        if(ds.fill){base.fill=true;base.backgroundColor=ds.color+'22';}
      }else{
        base.backgroundColor=ds.colors?ds.colors:ds.color;
        base.borderRadius=4;base.maxBarThickness=56;
      }
      return base;
    });
    const hasY1=def.datasets.some(ds=>ds.yAxisID==='y1');
    const y1fmt=def.datasets.filter(ds=>ds.yAxisID==='y1').length&&def.datasets.find(ds=>ds.yAxisID==='y1').label&&def.datasets.find(ds=>ds.yAxisID==='y1').label.toLowerCase().includes('roas')?'roas':'num';
    const scales={};
    scales[horizontal?'x':'y']={beginAtZero:true,stacked:!!def.stacked,ticks:{callback:axisFmt(fmt),font:{size:11}},grid:{color:'#f0efef'}};
    scales[horizontal?'y':'x']={stacked:!!def.stacked,ticks:{font:{size:11}},grid:{display:false}};
    if(hasY1)scales.y1={position:'right',beginAtZero:true,ticks:{callback:axisFmt(y1fmt),font:{size:11}},grid:{drawOnChartArea:false}};
    cfg={type:def.kind==='line'?'line':'bar',
      data:{labels:def.labels,datasets:datasets},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:horizontal?'y':'x',
        interaction:{mode:'index',intersect:false},
        scales:scales,
        plugins:{
          legend:{display:def.datasets.length>1||!!def.datasets[0].label,labels:{boxWidth:12,font:{size:11}}},
          tooltip:{callbacks:{label(c){
            const dsdef=def.datasets[c.datasetIndex]||{};
            const f=(dsdef.yAxisID==='y1')?y1fmt:fmt;
            const val=horizontal?c.parsed.x:c.parsed.y;
            return ' '+(c.dataset.label?c.dataset.label+': ':'')+tipFmt(f,val);
          }}},
          targetLine:def.target&&def.target.value?{value:def.target.value,label:def.target.label,color:def.target.color}:false
        }}};
  }
  liveCharts[def.id]=new Chart(cv,cfg);
}
function renderChartsFor(tabId){
  chartDefs.filter(d=>d.tab===tabId).forEach(d=>buildChart(d.def));
  staleTabs[tabId]=false;
}

/* ---------- KPI + insight refresh ---------- */
function animateKpi(el,card){
  const target=card.raw?card.raw[curPeriod]:null;
  const finalText=card.values[curPeriod];
  if(target===null||target===undefined||card.fmt==='plain'||typeof target!=='number'){el.textContent=finalText;return;}
  const startText=el.dataset.raw?parseFloat(el.dataset.raw):0;
  const t0=performance.now(),dur=650;
  function frame(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    const v=startText+(target-startText)*e;
    el.textContent=(p<1)?fmtVal(card.fmt==='pct'?'pct':card.fmt==='roas'?'roas':card.fmt,v):finalText;
    if(p<1)requestAnimationFrame(frame);
  }
  el.dataset.raw=target;
  requestAnimationFrame(frame);
}
function refreshValues(){
  D.tabs.forEach(t=>t.sections.forEach(s=>{
    if(s.type==='kpis')s.cards.forEach(c=>{const el=document.getElementById(c._id);if(el)animateKpi(el,c);});
    if(s.type==='insight'){const el=document.getElementById(s._id);if(el)el.innerHTML=s.text[curPeriod]||s.text.ytd;}
  }));
  document.getElementById('periodDates').textContent=D.meta.periods[curPeriod];
}
function setPeriod(p,btn){
  curPeriod=p;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  refreshValues();
  Object.keys(staleTabs).forEach(k=>{staleTabs[k]=true;});
  renderChartsFor(activeTab);
}
function resetFilters(){
  const first=document.querySelector('.period-btn');
  setPeriod('ytd',first);
  Object.keys(tableState).forEach(id=>{
    tableState[id].search='';tableState[id].pareto=false;
    const b=document.getElementById('pbtn_'+id);if(b)b.classList.remove('on');
    renderTable(id);
  });
  document.querySelectorAll('.tbl-search').forEach(i=>{i.value='';});
}

/* ---------- tabs ---------- */
function switchTab(tabId,btn){
  activeTab=tabId;
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-button').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab_'+tabId).classList.add('active');
  if(btn)btn.classList.add('active');
  if(staleTabs[tabId]!==false)renderChartsFor(tabId);
}

/* ---------- boot ---------- */
function boot(){
  if(typeof Chart!=='undefined'){
    Chart.register(targetLinePlugin);
    Chart.defaults.font.family="'Segoe UI','Calibri',sans-serif";
  }
  const m=D.meta;
  document.getElementById('hTitle').textContent=m.header_title||(m.brand+' — '+m.title);
  document.getElementById('hSub').textContent=m.subtitle;
  document.getElementById('samplePill').textContent=m.header_pill||'Sample · Illustrative data';
  const nav=document.getElementById('tabNav');
  const wrap=document.getElementById('tabWrap');
  let navH='',bodyH='';
  D.tabs.forEach((t,i)=>{
    navH+='<button class="tab-button'+(i===0?' active':'')+'" style="--tabcolor:'+(t.color||'#1CBFBB')+'" onclick="switchTab(\''+t.id+'\',this)">'+esc(t.label)+'</button>';
    let sec='';
    t.sections.forEach(s=>{sec+=buildSection(s,t.id);});
    bodyH+='<div class="tab-content'+(i===0?' active':'')+'" id="tab_'+t.id+'">'+sec+'</div>';
  });
  nav.innerHTML=navH;
  wrap.innerHTML=bodyH;
  let metaH='';
  if(D.glossary&&D.glossary.length){
    metaH+='<details class="meta-block"><summary>📘 Glossary — what each metric means</summary><ul>';
    D.glossary.forEach(g=>{metaH+='<li><b>'+esc(g[0])+':</b> '+esc(g[1])+'</li>';});
    metaH+='</ul></details>';
  }
  if(D.methodology&&D.methodology.length){
    metaH+='<details class="meta-block"><summary>🔍 Methodology & data notes</summary><ul>';
    D.methodology.forEach(x=>{metaH+='<li>'+esc(x)+'</li>';});
    metaH+='</ul></details>';
  }
  if(D.planned&&D.planned.length){
    metaH+='<details class="meta-block"><summary>🛠 Planned improvements</summary><ul>';
    D.planned.forEach(x=>{metaH+='<li>'+esc(x)+'</li>';});
    metaH+='</ul></details>';
  }
  document.getElementById('metaBlocks').innerHTML=metaH;
  document.getElementById('footer').textContent=m.footer;
  document.getElementById('sampleNote').textContent=m.sample_note;
  Object.keys(tableState).forEach(id=>renderTable(id));
  activeTab=D.tabs[0].id;
  D.tabs.forEach(t=>{staleTabs[t.id]=true;});
  refreshValues();
  renderChartsFor(activeTab);
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('passwordInput').focus();
});

</script>
